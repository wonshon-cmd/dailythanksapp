<!doctype html>

<head>

<title>Daily Thanks · 감사가 이어지는 하루</title><style>
:root{--paper:#FCFCFA;--card:#F6F6F4;--white:#fff;--ink:#303438;--sub:#686E73;--line:#E5E6E3;--soft:#ECEEED;--dark:#444C53;--safe-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9eaeb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #667887;outline-offset:2px}.app-shell{max-width:520px;min-height:100dvh;margin:0 auto;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 0 45px #343b4410}.topbar{height:67px;padding:0 21px;display:flex;align-items:center;justify-content:space-between;position:absolute;z-index:4;top:0;left:0;right:0;background:linear-gradient(to bottom,#fcfcfaf5,#fcfcfae0)}.brand{border:none;background:none;display:flex;align-items:center;gap:9px;font-size:18px;letter-spacing:-.065em;font-weight:700;color:var(--ink)}.sprout{font-size:19px;font-weight:400;transform:rotate(-24deg);display:inline-block}.top-actions{display:flex;gap:5px}.icon-btn{border:0;background:transparent;width:38px;height:38px;border-radius:50%;font-size:25px;color:var(--ink)}.icon-btn:hover{background:var(--soft)}.bottom-nav{position:absolute;z-index:4;bottom:0;left:0;right:0;height:calc(74px + var(--safe-bottom));padding:7px 9px calc(8px + var(--safe-bottom));display:flex;align-items:center;justify-content:space-between;background:#fcfcfaf5;border-top:1px solid var(--line);backdrop-filter:blur(14px)}.bottom-nav button{background:none;border:0;color:#92989b;flex:1;display:grid;gap:2px;place-items:center;font-size:10px}.bottom-nav button.active{color:var(--ink);font-weight:700}.nav-ico{font-size:24px;font-weight:300}.bottom-nav .compose-nav{flex:0 0 62px}.compose-nav span{background:var(--dark);color:white;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:200;box-shadow:0 5px 14px #2830371c}.screen{height:100dvh;padding-top:67px;padding-bottom:calc(74px + var(--safe-bottom));overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.feed-top{height:46px;display:flex;align-items:center;justify-content:center;gap:6px;position:sticky;top:0;background:var(--paper);z-index:3;border-bottom:1px solid var(--line)}.pill{border:none;background:none;color:var(--sub);font-weight:500;font-size:12px;border-radius:999px;padding:9px 14px}.pill.active{background:var(--soft);color:var(--ink);font-weight:700}.feed-scroll{height:calc(100% - 46px);overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}.feed-scroll::-webkit-scrollbar{display:none}.post{height:100%;min-height:360px;scroll-snap-align:start;scroll-snap-stop:always;padding:32px 30px 19px;display:flex;flex-direction:column;justify-content:space-between;position:relative}.post-top{display:flex;align-items:center;justify-content:space-between;color:var(--sub);font-size:12px}.post-type{border:1px solid var(--line);padding:7px 11px;border-radius:100px;background:#fff8}.post-middle{max-width:415px;margin:auto 0;text-align:center;position:relative}.quote{font-family:Georgia,serif;color:#aab0b1;font-size:55px;line-height:1;height:43px}.post-text{font-size:clamp(23px,5.6vw,32px);letter-spacing:-.063em;font-weight:480;line-height:1.74;word-break:keep-all;margin:15px 0 12px;white-space:pre-wrap}.post-reflect{font-size:13px;color:var(--sub);margin-top:26px;line-height:1.6;padding:13px 15px;background:var(--card);border-radius:12px}.post-bottom{width:100%}.post-by{display:flex;justify-content:center;gap:8px;align-items:center;color:var(--sub);font-size:12px;margin-bottom:20px}.avatar{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#e8ebeb;color:#50585d;font-weight:600;font-size:11px}.post-actions{border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:center;gap:12px}.action-chip{border:none;background:transparent;color:var(--ink);font-size:12px;padding:10px 12px;border-radius:12px}.action-chip.liked{color:#bf6671}.swipe-hint{text-align:center;font-size:10px;color:#a2a8aa;margin-top:8px}.empty{padding:40px 26px;text-align:center;color:var(--sub);line-height:1.8}.empty button{margin-top:15px}.section{padding:25px 22px 35px}.section-kicker{letter-spacing:.07em;font-size:10px;color:var(--sub);text-transform:uppercase}.section-title{font-size:28px;font-weight:570;line-height:1.4;letter-spacing:-.06em;margin:12px 0 9px}.section-desc{font-size:13px;line-height:1.8;color:var(--sub);margin:0 0 23px}.panel{border:1px solid var(--line);background:var(--white);border-radius:19px;padding:18px;margin:13px 0;box-shadow:0 3px 12px #26303908}.panel-muted{background:var(--card)}.panel h3{font-size:16px;letter-spacing:-.04em;margin:3px 0 8px;font-weight:600}.panel p{font-size:13px;line-height:1.75;color:var(--sub);margin:6px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--sub);font-size:12px}.primary{border:0;background:var(--dark);color:#fff;border-radius:13px;padding:14px 18px;font-weight:600;font-size:13px}.secondary{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 16px;color:var(--ink);font-size:13px}.small-btn{border:none;background:var(--soft);border-radius:8px;padding:9px 12px;color:var(--ink);font-size:12px}.days{display:flex;justify-content:space-between;gap:5px;margin:20px 0}.day{text-align:center;flex:1;font-size:10px;color:var(--sub)}.day span{width:100%;max-width:36px;aspect-ratio:1;border-radius:50%;border:1px solid #d7dcdd;background:#fff;display:grid;place-items:center;margin:0 auto 8px;font-size:13px}.day.done span{background:var(--dark);color:white;border-color:var(--dark)}.day.today span{border:2px solid var(--dark)}.mini-tabs{display:flex;gap:6px;margin:11px 0 16px}.mini-tabs button{border:1px solid var(--line);background:white;color:var(--sub);border-radius:100px;padding:9px 14px;font-size:12px}.mini-tabs button.active{background:var(--dark);color:white;border-color:var(--dark)}.note-card{padding:18px;margin:12px 0;border-radius:16px;background:#fff;border:1px solid var(--line)}.note-card h3{font-size:14px;margin:5px 0 9px}.note-card p{white-space:pre-wrap;color:var(--ink);font-size:15px;line-height:1.8;letter-spacing:-.035em}.note-card footer{color:var(--sub);font-size:11px}.note-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:15px}.note-actions button{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 10px;font-size:11px;color:var(--ink)}.widget-surface{background:radial-gradient(ellipse at 85% 8%,#f7f7f7,transparent 48%),radial-gradient(ellipse at 7% 80%,#e1e2e4,transparent 61%),#eceeee;border-radius:24px;padding:28px 16px 32px;margin-top:15px;min-height:430px}.widget-card{background:#fcfcfbee;border:1px solid #fff;border-radius:25px;padding:21px;margin:0 0 14px;box-shadow:0 12px 28px #25303c0e}.widget-card h3{font-size:16px;margin:0 0 14px}.widget-card .question{font-size:20px;line-height:1.55;letter-spacing:-.05em;padding:7px 0 18px}.widget-card button{width:100%}.widget-card .days{margin:15px 0 1px}.widget-card .day span{max-width:31px}.sheet-backdrop{position:absolute;inset:0;background:#171c2380;z-index:9}.sheet{position:absolute;z-index:10;bottom:0;left:0;right:0;max-height:94dvh;overflow:auto;background:var(--paper);border-radius:23px 23px 0 0;padding:20px 23px calc(26px + var(--safe-bottom));box-shadow:0 -10px 36px #161c231c}.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.sheet-top h2{font-size:21px;letter-spacing:-.05em;margin:0}.close{background:#f1f2f1;border:0;border-radius:50%;width:35px;height:35px;font-size:21px;color:var(--sub)}.field-label{display:block;font-size:12px;color:var(--sub);margin:18px 0 9px}.field,textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px;font-size:13px;color:var(--ink)}textarea{min-height:155px;resize:vertical;font-size:16px;line-height:1.8;letter-spacing:-.03em}.radio-row{display:flex;gap:7px}.radio-row button{border:1px solid var(--line);background:white;border-radius:100px;padding:11px 15px;color:var(--sub);font-size:12px}.radio-row button.active{background:var(--dark);color:#fff}.hint{font-size:12px;line-height:1.7;color:var(--sub)}.sample-grid{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.sample-grid button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;font-size:11px}.share-preview{border:1px solid var(--line);background:#fff;padding:35px 24px;border-radius:18px;text-align:center;margin:18px 0}.share-preview p{font-size:22px;line-height:1.7;white-space:pre-wrap;letter-spacing:-.04em}.share-preview small{color:var(--sub)}.toast{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;background:var(--ink);color:#fff;border-radius:999px;padding:12px 19px;font-size:12px;z-index:15}.subtle-link{background:transparent;border:0;color:var(--sub);padding:11px}.fine-print{font-size:11px;color:#858b8e;line-height:1.7}.divider{border:none;border-top:1px solid var(--line);margin:19px 0}@media (min-width:700px){.app-shell{margin:20px auto;min-height:calc(100dvh - 40px);height:calc(100dvh - 40px);border-radius:29px;border:1px solid #dadddf}.screen{height:calc(100dvh - 42px)}.bottom-nav{border-radius:0 0 28px 28px}.sheet{border-radius:23px 23px 28px 28px}}@media(max-height:640px){.post{padding-top:16px}.post-text{font-size:22px}.post-by{margin-bottom:8px}.quote{font-size:38px;height:29px}}

</style>
</head>
<body>
<div class="app-shell" id="app">
  <header class="topbar"><button class="brand" data-action="home" aria-label="Daily Thanks 홈"><span class="sprout">✳</span><span>daily thanks</span></button><div class="top-actions"><button class="icon-btn" data-action="notification" title="알림 설정" aria-label="알림 설정">♧</button><button class="icon-btn" data-action="settings" title="설정" aria-label="설정">⋯</button></div></header>
  <main id="main" aria-live="polite"></main>
  <nav class="bottom-nav" aria-label="주요 메뉴"><button data-tab="feed" class="active"><span class="nav-ico">◫</span><span>감사 피드</span></button><button data-tab="challenges"><span class="nav-ico">◎</span><span>함께 7일</span></button><button data-tab="compose" class="compose-nav" aria-label="감사 작성"><span>＋</span></button><button data-tab="journal"><span class="nav-ico">▤</span><span>내 감사</span></button><button data-tab="widget"><span class="nav-ico">▣</span><span>위젯</span></button></nav>
  <div class="sheet-backdrop" id="backdrop" hidden></div><section class="sheet" id="sheet" aria-label="상세 화면" role="dialog" aria-modal="true" hidden></section>
  <div class="toast" id="toast" role="status" hidden></div>
</div><script>
/* Daily Thanks — dependency-free offline prototype. No accounts, server, push, Kakao or Instagram integration. */
(()=>{'use strict';
const KEY='daily-thanks-demo-v1';
const seed={
 posts:[
  {id:'pub1',name:'서연',scope:'public',kind:'today',text:'잠깐 멈춰 보니, 집으로 돌아가는 길에도 예쁜 하늘이 있었어요. 평범한 하루를 아름답게 하심에 감사합니다.',date:'2026-11-16',likes:24},
  {id:'pub2',name:'지우',scope:'public',kind:'ahead',text:'하나님, 이번 한 주도 직장에서 기쁨으로 하루하루를 보내게 하심에 감사합니다.',date:'2026-11-16',likes:17},
  {id:'pub3',name:'하은',scope:'public',kind:'today',text:'오늘 마음이 무거웠는데 친구가 먼저 안부를 물어봐 주었어요. 함께할 사람이 있어 감사합니다.',date:'2026-11-15',likes:12},
  {id:'gr1',name:'지은',scope:'group',group:'은혜 소그룹',kind:'today',text:'평범하게 식탁에 앉아 이야기 나눌 수 있었던 저녁이 감사했어요.',date:'2026-11-16',likes:8},
  {id:'gr2',name:'민서',scope:'group',group:'은혜 소그룹',kind:'ahead',text:'하나님, 이번 한 주도 서로를 이해하는 마음을 주심에 감사합니다.',date:'2026-11-15',likes:5},
  {id:'mine1',name:'나',scope:'private',kind:'today',text:'오늘도 새롭게 시작할 수 있는 아침을 주셔서 감사합니다.',date:'2026-11-15',likes:0}
 ],liked:[],groups:['은혜 소그룹','우리 가족'],challenges:[{id:'ch1',name:'함께 발견하는 감사',group:'은혜 소그룹',members:['나','지은','민서'],start:'2026-11-14',days:[1,2],joined:true}],settings:{notificationTime:'21:00',notificationEnabled:false,groupUpdates:false}
};
const clone=x=>JSON.parse(JSON.stringify(x));let data;try{const stored=JSON.parse(localStorage.getItem(KEY));data=stored&&Array.isArray(stored.posts)?stored:clone(seed)}catch{data=clone(seed)};
let state={tab:'feed',feed:'public',group:data.groups[0],composeKind:'today',scope:'private',challenge:null,filter:'all',currentPost:null};
const $=s=>document.querySelector(s),main=$('#main'),sheet=$('#sheet'),backdrop=$('#backdrop');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');const isoDay=(iso,n)=>{let d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')};
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{toast('현재 브라우저에 저장할 수 없어요.')}}
function toast(text){const t=$('#toast');t.textContent=text;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,2600)}
function showSheet(inner){sheet.innerHTML='<div class="sheet-top"><h2>'+inner.title+'</h2><button class="close" data-action="close" aria-label="닫기">×</button></div>'+inner.body;sheet.hidden=false;backdrop.hidden=false;setTimeout(()=>sheet.querySelector('textarea,input,button')?.focus(),30)}
function close(){sheet.hidden=true;backdrop.hidden=true;sheet.innerHTML=''}
function kindLabel(p){return p.kind==='ahead'?'미리 감사 · 기도':'오늘의 감사'}
function scopeLabel(p){return p.scope==='public'?'모두의 감사':p.scope==='private'?'나만 보기':p.group||'소그룹'}
function originalPosts(){return data.posts.filter(p=>p.scope!=='private')}
function filteredPosts(){return data.posts.filter(p=>state.feed==='public'?p.scope==='public':p.scope==='group'&&p.group===state.group)}
function postTemplate(p,index,count){const liked=data.liked.includes(p.id);return `<article class="post" data-post="${esc(p.id)}"><div class="post-top"><span class="post-type">${esc(kindLabel(p))}</span><span>${esc(scopeLabel(p))}</span></div><div class="post-middle"><div class="quote">“</div><div class="post-text">${esc(p.text)}</div>${p.reflection?`<div class="post-reflect">돌아보며 · ${esc(p.reflection)}</div>`:''}</div><div class="post-bottom"><div class="post-by"><span class="avatar">${esc(p.name[0])}</span><span>${esc(p.name)} · ${esc(p.date)}</span><span>· ${index+1} / ${count}</span></div><div class="post-actions"><button class="action-chip ${liked?'liked':''}" data-action="like" data-id="${esc(p.id)}" aria-pressed="${liked}">${liked?'♥':'♡'} <span>${p.likes+(liked?1:0)}</span></button><button class="action-chip" data-action="share" data-id="${esc(p.id)}">↗ 공유</button><button class="action-chip" data-action="send-group" data-id="${esc(p.id)}">＋ 소그룹</button></div><p class="swipe-hint">↑ 다음 감사로 스크롤</p></div></article>`}
function renderFeed(){const posts=filteredPosts();main.innerHTML=`<div class="screen"><div class="feed-top"><button class="pill ${state.feed==='group'?'active':''}" data-action="feed-group">내 소그룹</button><button class="pill ${state.feed==='public'?'active':''}" data-action="feed-public">모두의 감사</button><button class="pill" data-action="challenges">함께 7일</button></div><div class="feed-scroll" id="feed-scroll">${state.feed==='group'?`<div style="scroll-snap-align:none;min-height:50px;text-align:center;padding:7px"><select data-action="change-group" style="width:auto;min-width:140px;padding:7px 10px;border-radius:999px;font-size:12px">${data.groups.map(g=>`<option ${state.group===g?'selected':''}>${esc(g)}</option>`).join('')}</select></div>`:''}${posts.length?posts.map((p,i)=>postTemplate(p,i,posts.length)).join(''):`<div class="empty">아직 이곳에 올라온 감사가 없어요.<br>첫 번째 감사를 나눠보세요.<br><button class="primary" data-action="compose">감사 쓰기</button></div>`}</div></div>`}
function renderChallenges(){const all=data.challenges;main.innerHTML=`<div class="screen"><div class="section"><span class="section-kicker">7 DAYS TOGETHER</span><h1 class="section-title">함께 쌓아가는<br>일곱 번의 감사.</h1><p class="section-desc">친구 한 명이나 소그룹과 시작해요. 하루를 쉬어도 다시 이어갈 수 있어요.</p><button class="primary" data-action="new-challenge">＋ 새로운 7일 챌린지</button>${all.map(ch=>{const count=Math.min(7,ch.days.length);return `<section class="panel"><div class="row"><span class="muted">${esc(ch.group)}</span><span class="muted">${count}/7일</span></div><h3>${esc(ch.name)}</h3><p>${esc(ch.members.join(' · '))}</p>${dayRow(ch)}<div class="row"><button class="primary" data-action="challenge-write" data-id="${esc(ch.id)}">오늘의 감사 쓰기</button><button class="secondary" data-action="challenge-detail" data-id="${esc(ch.id)}">자세히 보기</button></div></section>`}).join('')}<p class="fine-print">오프라인 시안에서는 참여 인원과 완료 상태가 이 브라우저에만 저장됩니다. 실제 친구 초대는 서버와 사용자 계정 연동이 필요합니다.</p></div></div>`}
function dayRow(ch){return `<div class="days">${Array.from({length:7},(_,i)=>`<div class="day ${ch.days.includes(i+1)?'done':''} ${i+1===Math.min(ch.days.length+1,7)?'today':''}"><span>${ch.days.includes(i+1)?'✓':i+1}</span>${i+1}일</div>`).join('')}</div>`}
function renderJournal(){let mine=data.posts.filter(p=>p.name==='나');if(state.filter==='ahead')mine=mine.filter(p=>p.kind==='ahead');if(state.filter==='today')mine=mine.filter(p=>p.kind==='today');main.innerHTML=`<div class="screen"><div class="section"><span class="section-kicker">MY GRATITUDE</span><h1 class="section-title">나의 감사가<br>쌓이는 곳.</h1><p class="section-desc">오늘 받은 은혜와 앞으로의 시간을 맡기며 드린 미리 감사를 함께 돌아봐요.</p><div class="mini-tabs">${[['all','전체'],['today','오늘의 감사'],['ahead','미리 감사']].map(([k,label])=>`<button class="${state.filter===k?'active':''}" data-action="journal-filter" data-id="${k}">${label}</button>`).join('')}</div><button class="primary" data-action="compose">＋ 새로운 감사 쓰기</button>${mine.length?mine.map(p=>`<section class="note-card"><span class="muted">${esc(kindLabel(p))} · ${esc(scopeLabel(p))}</span><p>${esc(p.text)}</p>${p.reflection?`<p class="muted">돌아보며: ${esc(p.reflection)}</p>`:''}<footer>${esc(p.date)}</footer><div class="note-actions"><button data-action="share" data-id="${esc(p.id)}">공유</button>${p.kind==='ahead'?`<button data-action="reflect" data-id="${esc(p.id)}">돌아보며 감사 쓰기</button>`:''}<button data-action="delete" data-id="${esc(p.id)}">삭제</button></div></section>`).join(''):'<p class="empty">아직 기록된 감사가 없어요.</p>'}</div></div>`}
function renderWidget(){main.innerHTML=`<div class="screen"><div class="section"><span class="section-kicker">HOME SCREEN WIDGET CONCEPT</span><h1 class="section-title">매일 한 줄,<br>가장 가까운 곳에.</h1><p class="section-desc">실제 iPhone 위젯이 아닌 홈 화면 디자인 미리보기예요.</p><div class="widget-surface"><div class="widget-card"><h3>✳ 오늘의 감사</h3><div class="question">오늘 나를 웃게 한 일은 무엇인가요?</div><button class="primary" data-action="compose">＋ 한 줄 쓰기</button></div><div class="widget-card"><h3>◎ 은혜 소그룹</h3><p class="muted">함께 채우는 7일 · 우리의 작은 감사</p>${dayRow(data.challenges[0])}<button class="secondary" data-action="challenges">챌린지 보기</button></div></div><p class="fine-print">실제 위젯 설치·위젯에서 앱 열기는 iOS/Android 네이티브 개발 단계에서 구현해야 합니다.</p></div></div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));if(state.tab==='feed')renderFeed();else if(state.tab==='challenges')renderChallenges();else if(state.tab==='journal')renderJournal();else if(state.tab==='widget')renderWidget()}
const samples={work:'하나님, 이번 한 주도 직장에서 기쁨으로 하루하루를 보내게 하심에 감사합니다.',relationship:'하나님, 이번 주 만나는 사람들을 사랑과 인내로 대하게 하심에 감사합니다.',everyday:'하나님, 평범한 하루 가운데서 작은 은혜를 발견하게 하심에 감사합니다.'};
function compose(kind=state.composeKind,chId=null){state.composeKind=kind;state.challenge=chId;const personal=kind==='ahead';showSheet({title:'감사 한 줄 남기기',body:`<form id="compose-form"><div class="radio-row"><button type="button" data-action="kind-today" class="${personal?'':'active'}">오늘의 감사</button><button type="button" data-action="kind-ahead" class="${personal?'active':''}">미리 감사 · 기도</button></div><label class="field-label" for="gratitude-text">${personal?'미리 감사하며 하나님께 맡기는 일은?':'오늘 고마웠던 순간은?'}</label><textarea id="gratitude-text" maxlength="1500" placeholder="${personal?'하나님, 이번 한 주도…':'오늘 감사했던 순간을 적어보세요.'}" required></textarea><div id="samples" ${personal?'':'hidden'}><p class="field-label">문장을 눌러 수정해 보세요</p><div class="sample-grid"><button type="button" data-action="sample" data-id="work">직장에서</button><button type="button" data-action="sample" data-id="relationship">관계에서</button><button type="button" data-action="sample" data-id="everyday">일상에서</button></div></div><label class="field-label" for="post-scope">누구와 나눌까요?</label><select id="post-scope"><option value="private">나만 보기 (기본)</option><option value="group">내 소그룹</option><option value="public">전체 공개</option></select><div id="group-picker" hidden><label class="field-label" for="post-group">소그룹</label><select id="post-group">${data.groups.map(g=>`<option>${esc(g)}</option>`).join('')}</select></div><p class="hint">개인적인 기도는 나만 보기로 안전하게 남길 수 있어요. 공개하면 다른 사람도 읽고 공유할 수 있습니다.</p><button class="primary" type="submit" style="width:100%">감사 남기기</button></form>`});const form=$('#compose-form');form.addEventListener('submit',e=>{e.preventDefault();const text=$('#gratitude-text').value.trim();if(!text)return;const scope=$('#post-scope').value;const p={id:'p'+Date.now(),name:'나',scope,group:scope==='group'?$('#post-group').value:undefined,kind:state.composeKind,text,date:today(),likes:0};data.posts.unshift(p);if(state.challenge){const ch=data.challenges.find(c=>c.id===state.challenge);if(ch&&!ch.days.includes(Math.min(ch.days.length+1,7)))ch.days.push(Math.min(ch.days.length+1,7))}save();close();state.tab='journal';render();toast('감사가 저장되었어요.');});$('#post-scope').addEventListener('change',()=>$('#group-picker').hidden=$('#post-scope').value!=='group')}
function reflect(id){const p=data.posts.find(p=>p.id===id);if(!p)return;showSheet({title:'돌아보며 감사 쓰기',body:`<p class="hint">그때 드린 미리 감사</p><div class="panel panel-muted">${esc(p.text)}</div><form id="reflect-form"><label class="field-label" for="reflect-text">이번 주에 실제로 발견한 감사는?</label><textarea id="reflect-text" placeholder="작은 순간도 좋아요.">${esc(p.reflection||'')}</textarea><button class="primary" type="submit" style="width:100%">기록에 덧붙이기</button></form>`});$('#reflect-form').addEventListener('submit',e=>{e.preventDefault();p.reflection=$('#reflect-text').value.trim();save();close();renderJournal();toast('한 주의 감사가 더해졌어요.')})}
function like(id){const p=data.posts.find(p=>p.id===id);if(!p)return;const i=data.liked.indexOf(id);if(i>=0)data.liked.splice(i,1);else data.liked.push(id);save();let scroll=$('#feed-scroll'),index=scroll?Math.round(scroll.scrollTop/scroll.clientHeight):0;render();if(scroll&&$('#feed-scroll'))$('#feed-scroll').scrollTop=index*$('#feed-scroll').clientHeight;toast(p.kind==='ahead'?'함께 기도해요.':'함께 감사해요.')}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('글을 복사했어요.')}catch{const el=document.createElement('textarea');el.value=text;document.body.append(el);el.select();document.execCommand('copy');el.remove();toast('복사했어요.')}}
function share(id){const p=data.posts.find(p=>p.id===id);if(!p)return;const content=`${p.text}\n\n— ${p.name} · Daily Thanks`;showSheet({title:'감사 공유',body:`<p class="hint">실제 카카오톡·인스타그램 연결 전 미리보기입니다. 공개 또는 본인이 허락한 내용만 공유하세요.</p><div class="share-preview"><span class="section-kicker">DAILY THANKS</span><p>${esc(p.text)}</p><small>${esc(p.name)} · ${esc(kindLabel(p))}</small></div><div class="row"><button class="primary" data-action="copy-share" data-id="${esc(id)}">텍스트 복사</button><button class="secondary" data-action="native-share" data-id="${esc(id)}">기기 공유</button></div><p class="hint">카카오톡·인스타그램 공유는 휴대폰의 기본 공유 기능을 사용할 수 있지만, 플랫폼별 전용 카드·게시 기능은 별도 연동이 필요합니다.</p>`})}
function sendToGroup(id){const p=data.posts.find(p=>p.id===id);if(!p)return;showSheet({title:'소그룹에 나누기',body:`<p class="hint">원작자가 공유한 글은 작성자 표시를 유지하세요. 비공개 글은 다른 사람에게 보내기 전에 허락을 받으세요.</p><div class="panel panel-muted">${esc(p.text)}</div><label class="field-label" for="send-target">공유할 소그룹</label><select id="send-target">${data.groups.map(g=>`<option>${esc(g)}</option>`).join('')}</select><button class="primary" style="margin-top:16px;width:100%" data-action="confirm-send" data-id="${esc(id)}">이 그룹에 나누기</button>`})}
function createChallenge(){showSheet({title:'7일 감사 챌린지 만들기',body:`<form id="challenge-form"><label class="field-label">챌린지 이름</label><input id="challenge-name" class="field" value="함께 채우는 7일" maxlength="50" required><label class="field-label">누구와 함께하나요?</label><select id="challenge-group"><option value="친구와 둘이">친구와 둘이 (초대 링크는 출시 이후)</option>${data.groups.map(g=>`<option>${esc(g)}</option>`).join('')}</select><p class="hint">한 주 중 하루를 놓쳐도 시작부터 다시 하지 않아요. 실제 친구 초대·실시간 동기화는 백엔드 구현 후 이용할 수 있습니다.</p><button class="primary" style="width:100%" type="submit">챌린지 시작하기</button></form>`});$('#challenge-form').addEventListener('submit',e=>{e.preventDefault();const name=$('#challenge-name').value.trim();if(!name)return;data.challenges.unshift({id:'ch'+Date.now(),name,group:$('#challenge-group').value,members:['나'],start:today(),days:[],joined:true});save();close();state.tab='challenges';render();toast('새로운 7일 챌린지가 시작되었어요.')})}
function challengeDetail(id){const ch=data.challenges.find(c=>c.id===id);if(!ch)return;showSheet({title:ch.name,body:`<p class="muted">${esc(ch.group)} · ${esc(ch.members.join(', '))}</p>${dayRow(ch)}<p class="hint">오늘의 질문: 이번 주에 감사하고 싶은 사람은 누구인가요?</p><button class="primary" style="width:100%" data-action="challenge-write" data-id="${esc(ch.id)}">오늘의 감사 쓰기</button><p class="hint">한 사람이 글을 썼을 때 모든 참가자의 참여로 계산하지 않도록, 실제 서비스에서는 사용자별 체크인 기록이 필요합니다.</p>`})}
function notifications(){const s=data.settings;showSheet({title:'나의 감사 시간',body:`<p class="hint">매일 부담 없이 한 줄을 남기도록, 내가 정한 시간에 한 번만 알려주는 흐름을 설계했어요.</p><label class="field-label">감사 알림 시간</label><input id="notify-time" class="field" type="time" value="${esc(s.notificationTime)}"><label class="field-label"><input id="notify-enabled" type="checkbox" ${s.notificationEnabled?'checked':''}> 매일 감사 알림 사용 (설정 시안)</label><label class="field-label"><input id="notify-group" type="checkbox" ${s.groupUpdates?'checked':''}> 그룹 반응 모아 보기</label><div class="panel panel-muted"><h3>잠금 화면 알림 예시</h3><p>오늘 고마웠던 순간 하나</p><p>작은 일도 좋아요. 한 줄로 남겨볼까요?</p></div><button class="primary" style="width:100%" data-action="save-notifications">알림 설정 저장</button><p class="fine-print">이 화면은 기기에 실제 푸시 알림을 예약하지 않습니다. 실제 알림은 권한 요청 및 네이티브 앱/웹 푸시 설정이 필요합니다.</p>`})}
function settings(){showSheet({title:'디자인과 데이터',body:`<p class="hint">컬러 팔레트 · Soft White</p><div class="row" style="margin:12px 0"><span style="background:#fcfcfa;border:1px solid #ddd;width:52px;height:52px;border-radius:10px"></span><span style="background:#f6f6f4;border:1px solid #ddd;width:52px;height:52px;border-radius:10px"></span><span style="background:#303438;width:52px;height:52px;border-radius:10px"></span><span class="muted">#FCFCFA<br>#F6F6F4<br>#303438</span></div><button class="secondary" data-action="export" style="width:100%">내 데모 데이터 JSON 내보내기</button><p class="fine-print">현재의 기록은 이 브라우저에만 저장됩니다. 새 브라우저나 기기로 자동 동기화되지 않습니다.</p><hr class="divider"><button class="secondary" data-action="reset" style="width:100%">데모 초기화</button>`})}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='daily-thanks-demo-data.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function handleAction(action,id){if(action==='home'){state.tab='feed';render()}else if(action==='feed-public'){state.feed='public';renderFeed()}else if(action==='feed-group'){state.feed='group';renderFeed()}else if(action==='challenges'){state.tab='challenges';render()}else if(action==='compose')compose();else if(action==='notification')notifications();else if(action==='settings')settings();else if(action==='close')close();else if(action==='like')like(id);else if(action==='share')share(id);else if(action==='send-group')sendToGroup(id);else if(action==='kind-today'||action==='kind-ahead'){const value=action==='kind-ahead'?'ahead':'today';const prev=$('#gratitude-text')?.value||'';compose(value,state.challenge);$('#gratitude-text').value=prev}else if(action==='sample'){$('#gratitude-text').value=samples[id];$('#gratitude-text').focus()}else if(action==='journal-filter'){state.filter=id;renderJournal()}else if(action==='reflect')reflect(id);else if(action==='delete'){if(confirm('이 감사 기록을 삭제할까요?')){data.posts=data.posts.filter(p=>p.id!==id);save();render()}}else if(action==='copy-share'){copyText(data.posts.find(p=>p.id===id)?.text||'')}else if(action==='native-share'){const p=data.posts.find(p=>p.id===id);if(navigator.share&&p){navigator.share({title:'Daily Thanks',text:p.text}).catch(()=>{})}else toast('이 환경에서는 기기 공유를 사용할 수 없어요.')}else if(action==='confirm-send'){const p=data.posts.find(p=>p.id===id);if(p){const targetGroup=$('#send-target').value;data.posts.unshift({...p,id:'repost'+Date.now(),scope:'group',group:targetGroup,name:p.name+' · 공유',likes:0});save();close();state.feed='group';state.group=targetGroup;state.tab='feed';render();toast('그룹에 나누었어요.')}}else if(action==='new-challenge')createChallenge();else if(action==='challenge-write'){close();compose('today',id)}else if(action==='challenge-detail')challengeDetail(id);else if(action==='save-notifications'){data.settings.notificationTime=$('#notify-time').value;data.settings.notificationEnabled=$('#notify-enabled').checked;data.settings.groupUpdates=$('#notify-group').checked;save();close();toast('데모 설정이 저장되었어요.')}else if(action==='export')exportData();else if(action==='reset'){if(confirm('데모에서 추가한 기록과 설정을 모두 초기화할까요?')){data=clone(seed);save();close();render();toast('데모가 초기화되었어요.')}}}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){if(tab.dataset.tab==='compose')compose();else{state.tab=tab.dataset.tab;close();render()}return}const b=e.target.closest('[data-action]');if(b)handleAction(b.dataset.action,b.dataset.id)});
document.addEventListener('change',e=>{if(e.target.matches('[data-action="change-group"]')){state.group=e.target.value;renderFeed()}});
backdrop.addEventListener('click',close);document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
})();

</script>
</body></html>
