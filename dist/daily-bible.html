function memory() {
  const mine = data.posts.filter(p => p.mine && p.kind !== 'thanks');
  for (const [n, key] of [[365, 'mem.year'], [30, 'mem.month'], [7, 'mem.week']]) {
    const p = mine.find(x => x.date === daysAgo(n)); if (p) return { p, label: t(key) };
  }
  const older = mine.filter(x => x.date <= daysAgo(3)).sort((a, b) => a.date < b.date ? -1 : 1);
  if (!older.length) return null;
  const p = older[dayOfYear() % older.length];
  const n = Math.round((new Date(today()) - new Date(p.date)) / 864e5);
  return { p, label: t('mem.ago').replace('{n}', n) };
}
function memoryCard() {
  const m = memory(); if (!m) return '';
  return `<button class="mem-card" data-action="note" data-id="${esc(m.p.id)}"><span class="mem-head">${icon('history')}<span>${t('mem.label')} · ${esc(m.label)}</span></span><span class="mem-text">${esc(L(m.p.text))}</span></button>`;
}

// This month as a small garden of days.
function calendarCard() {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  const iso = d => new Date(y, m, d).toLocaleDateString('en-CA');
  const written = new Set(data.posts.filter(p => p.mine).map(p => p.date));
  let count = 0;
  const cells = Array.from({ length: first }, () => '<i class="cal-pad"></i>').concat(Array.from({ length: days }, (_, i) => {
    const d = i + 1, on = written.has(iso(d)); if (on) count++;
    return `<button class="cal-day ${on ? 'on' : ''} ${iso(d) === today() ? 'today' : ''}" data-action="cal-day" data-id="${iso(d)}" aria-label="${iso(d)}">${d}</button>`;
  }));
  const title = lang() === 'ko' ? t('cal.title').replace('{m}', m + 1).replace('{n}', count) : t('cal.title').replace('{mon}', now.toLocaleDateString(lang(), { month: 'long' })).replace('{n}', count);
  return `<section class="cal-card"><div class="cal-head"><span>${icon('calendar')}${title}</span><button class="row-link" data-action="recap">${t('cal.recap')} ›</button></div>
    <div class="cal-grid">${cells.join('')}</div></section>`;
}

/* ---------------- notification priming ----------------
   iOS / the browser show their own fixed permission popup. Right before it, this screen explains why reminders help
   and lets people pick a time; only "Turn on reminders" triggers the system popup (Notification.requestPermission
   on the web; UNUserNotificationCenter.requestAuthorization in the native iOS app). */
const NOTIFY_TIMES = [['morning', '07:00', 'sunrise'], ['noon', '12:30', 'sun'], ['evening', '21:00', 'moon']];
// offered right after setting up a reading plan or a challenge (once each), if reminders aren't on yet
function askReminders(context) {
  if (data.settings.notificationEnabled || (data.settings.notifyAskedFor || {})[context]) return;
  // never on top of something the person is doing: if a sheet is open by then, ask another time
  setTimeout(() => { if (!sheet.hidden || document.body.classList.contains('reading')) return;
    data.settings.notifyAskedFor = { ...(data.settings.notifyAskedFor || {}), [context]: today() }; save(); notifyPrime(context); }, 600);
}
function notifyPrime(context) {
  data.settings.notifyAsked = data.settings.notifyAsked || today(); save(); // asked once, even if closed with ✕
  if (!data.settings.widgetAsked) state.pendingWidget = true;              // the widget guide follows when this closes
  state.primeTimes = state.primeTimes || new Set([context === 'plan' ? 'morning' : 'evening']); state.primeTime = [...state.primeTimes][0];
  const tile = ([id, time, ic]) => `<button type="button" class="time-tile ${state.primeTimes.has(id) ? 'active' : ''}" data-action="prime-time" data-id="${id}">${icon(ic)}<strong>${t('np.' + id)}</strong><span>${time.replace(/^0/, '')}</span><small>${t('np.' + id + 'Sub')}</small></button>`;
  showSheet({ title: '', body: `<div class="prime">
    <div class="cel-mark">${icon('bell')}</div>
    <p class="prime-title">${context === 'plan' ? t('np.planTitle') : context === 'challenge' ? t('np.chTitle') : t('np.title')}</p>${!context && t('np.sub') ? `<p class="prime-sub">${t('np.sub')}</p>` : ''}
    <ul class="prime-reasons"><li>${icon('sun')}${context ? t('np.cr1') : t('np.r1')}</li><li>${icon('check')}${context === 'plan' ? t('np.pr2') : context ? t('np.cr2') : t('np.r2')}</li><li>${icon('people')}${t('np.r3')}</li></ul>
    <p class="field-label">${t('np.when')} <small class="hint">${t('np.multi')}</small></p>
    <div class="time-tiles">${NOTIFY_TIMES.map(tile).join('')}</div>
    <label class="prime-other">${t('np.other')}<input id="prime-custom" class="time-input" type="time" value="${esc(data.settings.notificationTime)}"></label>
    <button class="primary block" data-action="prime-allow">${icon('bell')}${t('np.allow')}</button>
    <button class="subtle-link" data-action="prime-later">${t('np.later')}</button></div>` });
  $('#prime-custom').addEventListener('change', () => { state.primeCustom = true; });
}
async function primeAllow() {
  const times = [...NOTIFY_TIMES.filter(x => state.primeTimes?.has(x[0])).map(x => x[1]), ...(state.primeCustom && $('#prime-custom')?.value ? [$('#prime-custom').value] : [])];
  const list = [...new Set(times.length ? times : [$('#prime-custom')?.value || '21:00'])].sort(), time = list[0];
  Object.assign(data.settings, { notificationEnabled: true, notificationTime: time, notificationTimes: list, notifyAsked: today() });
  save(); close();
  let granted = false;
  try {
    if ('Notification' in window) {
      const res = await Notification.requestPermission();
      granted = res === 'granted';
      if (granted) new Notification('Daily Thanks', { body: t('np.test') });
    }
  } catch { /* some embedded viewers block the permission request; the preference is still saved */ }
  toast((granted || !('Notification' in window) ? t('np.on') : t('np.blocked')).replace('{time}', list.join(' · ')));
}

// The only yellow in the app: a small light that grows larger and deeper as reach grows (log scale, full at ~300 pts).
// How much my sharing reached people lately: likes, saves, shares and prayers on what I posted in the last 7 / 30 days,
// plus hearts on my thanks links. A big week makes the light clearly bigger, a big month makes it big; a quiet stretch and it shrinks back.
function glowLevel() {
  const touch = p => (p.likes || 0) + (p.saves || 0) + (p.shares || 0) + (p.prayedBy || []).length;
  const mine = data.posts.filter(p => p.mine && p.scope !== 'private' && !p.status && p.date);
  const w7 = daysAgo(6), w30 = daysAgo(29), hearts = data.settings.replies || [];
  const reach = since => mine.filter(p => p.date >= since).reduce((a, p) => a + touch(p), 0) + hearts.filter(h => String(h.at || '').slice(0, 10) >= since).length;
  const part = (n, full) => Math.min(1, Math.log(1 + n) / Math.log(1 + full));
  return Math.min(1, 0.45 * Math.pow(part(reach(w7), 40), 1.3) + 0.55 * Math.pow(part(reach(w30), 200), 1.3));
}
function glow(score, scale = 1) {
  const g = glowLevel();
  return `<span class="glow" style="--g:${g.toFixed(3)};--s:${scale}" aria-hidden="true"></span>`;
}

async function toggleFullscreen() {

  const entering = !state.immersive;

  if (entering) { if (!BIBLE_MODE) state.tab = 'feed'; state.feed = 'public'; state.immFeed = 'public'; }
  else if (BIBLE_MODE) { state.immFeed = 'public'; state.tab = 'read'; state.groupDetail = null; } // daily bible: closing the feed always lands on 읽기

  render(state.tab === 'feed' && state.feed === 'public' ? idx : 0);

/* ---------------- 매일 읽기 알림 ----------------

   question: remind me at this time tomorrow? (the phone app then sends "오늘의 말씀 · 잠언 3:5-6" — never on a day I've read). */
const hhmmLabel = hhmm => { const [h, m] = hhmm.split(':').map(Number), d = new Date(); d.setHours(h, m, 0, 0);
  return d.toLocaleTimeString(lang() === 'ko' ? 'ko-KR' : lang() === 'es' ? 'es' : 'en-US', { hour: 'numeric', minute: '2-digit' }); };
function remindAsk() {
  const s = data.settings;
  if (!BIBLE_MODE || s.notifyAsked || s.notificationEnabled || !('Notification' in window) || !sheet.hidden || state.onb) return;
  s.notifyAsked = today(); save(true);
  const d = new Date(); d.setMinutes(Math.round(d.getMinutes() / 5) * 5, 0, 0); const hhmm = d.toTimeString().slice(0, 5);
  showSheet({ title: t('rm.title'), body: `<p class="hint">${esc(t('rm.sub').replace('{time}', hhmmLabel(hhmm)))}</p>
    <div class="sheet-actions"><button class="primary" data-action="rm-yes" data-id="${hhmm}">${t('rm.yes')}</button><button class="secondary" data-action="close">${t('rm.no')}</button></div>` });
}
async function remindOn(hhmm) {
  close(); Object.assign(data.settings, { notificationEnabled: true, notificationTime: hhmm, notificationTimes: [hhmm] }); save();
  let perm = 'granted'; try { perm = await Notification.requestPermission(); } catch {}
  if (perm !== 'granted') { data.settings.notificationEnabled = false; save(); toast(t('rm.denied')); return; }
  toast(t('rm.done').replace('{time}', hhmmLabel(hhmm)));
}
// the passage for any day (today's may be one a community picked)
function passageOn(day) {
  if (day === today()) return todaysPassage(data.groups[0]?.id)?.ref || null;
  const planFor = CONTENT.qtPlan?.[lang()] && typeof CONTENT.qtPlan[lang()] === 'object' ? CONTENT.qtPlan[lang()] : CONTENT.qtPlan;
  const plan = planFor?.[day] || QT_BUILTIN[lang()]?.[day]; if (plan) return parseRef(plan);
  const gospel = [[40, 28], [41, 16], [42, 24], [43, 21]], all = gospel.flatMap(([b, n]) => Array.from({ length: n }, (_, i) => [b, i + 1]));
  const d = new Date(day + 'T12:00:00'), n = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
  const [b, c] = all[(n - 1) % all.length]; return { b, c, v: 0, v2: 0 };
}
// for the phone app's reminders: what to say on a given day, and whether to skip it
async function reminderFor(day) {
  const ref = passageOn(day); let first = '';
  try { if (ref) first = (await passageVerses(ref.v ? { ...ref, v2: ref.v } : { ...ref, v: 1, v2: 1 }))[0]?.text || ''; } catch {}
  return { title: t('rm.nTitle'), body: ref ? `${refText(ref)}${first ? ' · ' + (first.length > 60 ? first.slice(0, 60) + '…' : first) : ''}` : '', skip: !!data.readDevo?.[day] };
}
// open on today's passage (app start on an unread day, or a reminder tap)
function goToday(force) {
  if (!BIBLE_MODE) return;
  if (force) { document.getElementById('splash')?.remove(); if (!sheet.hidden) close(); state.tab = 'feed'; state.immersive = true; render(0); }
  let mine = null;
  const go = () => { if (!state.immersive) return; const sc = $('#feed-scroll'); if (!sc) return;
    if (mine && mine.el === sc && sc.scrollTop !== mine.top) return;   // they've scrolled on their own: leave it
    const i = [...sc.children].findIndex(c => c.matches('.fv-card, .devo-load')); if (i > 0) { sc.scrollTop = i * sc.clientHeight; mine = { el: sc, top: sc.scrollTop }; } };
  [120, 700, 1500, 2600].forEach(ms => setTimeout(go, ms));
}
function onbPassage() {
  if (!sheet.hidden) close();
  state.onb = 'passage'; state.tab = 'feed'; state.immersive = true; render(0);
  const go = () => { const sc = $('#feed-scroll'); if (!sc) return; const i = [...sc.children].findIndex(c => c.matches('.fv-card, .devo-load'));
    if (i >= 0) sc.scrollTop = i * sc.clientHeight; onbArrow(); };
  setTimeout(go, 60); setTimeout(go, 900);   // again once the verses have loaded
}
function onbArrow() {
  if (state.onb !== 'passage' || $('#onb-arrow')) return;
  const a = Object.assign(document.createElement('div'), { id: 'onb-arrow', className: 'onb-arrow', innerHTML: icon('down') });
  const app = document.getElementById('app'); app.append(a);
  // halfway between the verse and the reference line under it
  const place = () => { const sc0 = $('#feed-scroll'); if (!sc0) return; const cur = sc0.children[Math.round(sc0.scrollTop / Math.max(1, sc0.clientHeight))];
    const tx = cur?.querySelector('.fv-text'), ref = $('#fl-ref-fv-card') || cur?.querySelector('.fv-ref'); if (!tx || !ref) return;
    const ar = app.getBoundingClientRect(), mid = (tx.getBoundingClientRect().bottom + ref.getBoundingClientRect().top) / 2;
    a.style.top = (mid - ar.top - 11) + 'px'; a.style.bottom = 'auto'; };
  place(); setTimeout(place, 300);
  const sc = $('#feed-scroll'), y0 = sc?.scrollTop || 0;
  sc?.addEventListener('scroll', function off() { if (Math.abs(sc.scrollTop - y0) > 40) { a.classList.add('gone'); setTimeout(() => a.remove(), 600); sc.removeEventListener('scroll', off); } });
}
// reached the end of today's passage
function onbDone() {
  if (state.onb !== 'passage') return; state.onb = 'name';
  setTimeout(() => {
    showSheet({ title: t('ob.nameTitle'), body: `<form id="ob-name" class="sheet-form"><p class="hint">${t('ob.nameSub')}</p>
      <input id="ob-name-in" class="field" maxlength="30" autocomplete="name" value="${esc(data.settings.myName || '')}" placeholder="${esc(t('cl.namePh'))}" required>
      <button class="primary block" type="submit">${t('wl.next')}</button></form>` });
    $('#ob-name').addEventListener('submit', e => { e.preventDefault(); const n = $('#ob-name-in').value.trim().slice(0, 30); if (!n) return;
      data.settings.myName = n; save();
      if (Cloud.on()) Cloud.rest(`profiles?id=eq.${Cloud.uid()}`, { method: 'PATCH', body: { name: n } }).catch(() => {});
      showSheet({ title: esc(t('ob.welcome').replace('{name}', n)), body: `<p class="hint">${t('ob.welcomeSub')}</p>` });
      setTimeout(() => { if (state.onb !== 'name') return; state.onb = null; data.settings.onboarded = true; save(true); close(); }, 1800);
    });
  }, 900);
}
// Always the newest version: when the app comes back to the screen (and every 10 minutes), check whether a newer
// app.js was published; if so, reload — but never while something is being written in a sheet.
(() => {
  const mine = document.querySelector('script[src*="app.js?v="]')?.getAttribute('src').split('v=')[1]; if (!mine || window.Capacitor?.isNativePlatform?.()) return;
  let last = 0;
  const check = async () => {
    if (Date.now() - last < 60e3) return; last = Date.now();
    try { const html = await (await fetch(location.pathname + '?fresh=' + Date.now(), { cache: 'no-store' })).text();
      const v = html.match(/app\.js\?v=([a-z0-9]+)/)?.[1];
      let tried = ''; try { tried = sessionStorage.getItem('dt-reloaded-for') || ''; } catch {}
      if (v && v !== mine && v !== tried && sheet.hidden && !document.body.classList.contains('reading')) { try { sessionStorage.setItem('dt-reloaded-for', v); } catch {} location.reload(); } } catch {}   // once per version, never a loop
  };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  setInterval(() => { if (!document.hidden) check(); }, 10 * 60e3);
  setTimeout(check, 5000);
})();
// a shared verse: #v=BOOK-CHAPTER-VERSE opens the Bible at that verse
{ const sc = new URLSearchParams(location.search).get('s');
  if (CLOUD && sc && /^[a-z0-9]{6,16}$/.test(sc)) {
    let who = null; try { who = localStorage.getItem('dt-oid'); if (!who) { who = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join(''); localStorage.setItem('dt-oid', who); } } catch {}
    const k = location.hash.startsWith('#v=') ? 'verse' : location.hash.startsWith('#m=') ? 'reflection' : 'link';
    if (who && sc !== data.settings.shareCode) fetch(SUPA.url + '/rest/v1/rpc/record_open', { method: 'POST', headers: { apikey: SUPA.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ c: sc, who, k }) }).catch(() => {});
    try { history.replaceState(null, '', location.pathname + location.hash); } catch {}
  } }
{ const m = location.hash.match(/^#v=(\d+)-(\d+)-(\d+)$/);
  if (m) { try { history.replaceState(null, '', location.pathname + location.search); } catch {} document.getElementById('splash')?.remove();
    const [b, c, v] = m.slice(1).map(Number); if (b >= 1 && b <= 66) setTimeout(() => openReader({ b, c, v }), 120); } }
if (location.hash.startsWith('#reply')) { const q = new URLSearchParams(location.hash.split('?')[1] || ''); document.getElementById('splash')?.remove();
  setTimeout(() => { state.tyName = (q.get('to') || '').slice(0, 30); if (q.get('from') && !data.settings.myName) data.settings.myName = q.get('from').slice(0, 30); compose('thanks', null); }, 80); }
if (BIBLE_MODE && !location.hash && data.settings.onboarded && !data.readDevo?.[today()]) goToday();
if (BIBLE_MODE) setTimeout(trRefresh, data.settings.bibleTr && !TR_NAME[data.settings.bibleTr] ? 0 : 2500);   // newly added free translations show up in Settings
if (location.hash.startsWith('#friend')) { const q = new URLSearchParams(location.hash.split('?')[1] || ''); document.getElementById('splash')?.remove(); setTimeout(() => friendLink(q), 80); }
if (location.hash.startsWith('#join')) { const q = new URLSearchParams(location.hash.split('?')[1] || ''); document.getElementById('splash')?.remove(); setTimeout(() => joinGroup(q.get('c'), q.get('n'), q.get('k')), 80); }
if (location.hash.startsWith('#pastor=')) { try { state.pastorView = unb64url(location.hash.slice(8)); state.immersive = false; state.tab = 'group'; document.getElementById('splash')?.remove(); setTimeout(render, 60); } catch {} }
if (location.hash.startsWith('#m=')) { const b64 = location.hash.slice(3); document.getElementById('splash')?.remove(); setTimeout(() => openSharedMeditation(b64), 120); }
if (location.hash.startsWith('#plan')) { const q = new URLSearchParams(location.hash.split('?')[1] || ''); document.getElementById('splash')?.remove(); setTimeout(() => planJoin(q), 80); }
if (location.hash === '#write') { document.getElementById('splash')?.remove(); setTimeout(() => compose('today', null), 50); }

/* Splash second line follows the language: Korean gets its own words; the wordmark stays as it is.
   content.json "tagline" may be a list (all languages) or { ko: [...], en: [...] }. */
(() => {
  const tag = document.querySelector('#splash .splash-tag'); if (!tag || BIBLE_MODE) return;
  const remote = CONTENT.tagline && !Array.isArray(CONTENT.tagline) ? CONTENT.tagline[lang()] : null;
  const lines = Array.isArray(remote) && remote.length ? remote : lang() === 'ko' ? ['매일 감사', '풍성한 하루', '나눔의 기쁨'] : null;
  if (lines) { tag.innerHTML = lines.slice(0, 4).map(l => `<span>${safeEm(l)}</span>`).join(''); tag.classList.toggle('ko', lang() === 'ko'); }
})();
/* Splash: white screen with the wordmark only, then fades into the app (tap to skip). */
const splash = $('#splash');
if (splash) {
  let gone = false;
  const hide = () => {
    if (gone) return; gone = true; splash.classList.add('out'); setTimeout(() => splash.remove(), 600);
    ['pointerdown', 'touchstart', 'wheel', 'keydown'].forEach(ev => window.removeEventListener(ev, hide, true));
  };
  // The splash never blocks input (pointer-events: none): the first swipe or wheel scrolls the feed
  // underneath right away, and any touch, scroll or key press fades the splash out immediately.
  ['pointerdown', 'touchstart', 'wheel', 'keydown'].forEach(ev => window.addEventListener(ev, hide, { capture: true, passive: true }));
  // 1) wordmark  2) "Give thanks daily. Live abundantly. Share the joy."  3) feed
  // daily bible: just the wordmark, then the app (no tagline step)
  if (BIBLE_MODE) { splash.querySelector('.splash-tag')?.remove(); splash.setAttribute('aria-label', `${BRAND}. © 2026 Daily Journey, Inc.`); setTimeout(hide, 2400); }
  else { setTimeout(() => { if (!gone) splash.classList.add('step2'); }, 1400); setTimeout(hide, 4200); }
}
})();
