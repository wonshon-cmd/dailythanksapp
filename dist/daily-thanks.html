<title>Daily Thanks · 감사가 이어지는 하루</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FCFCFA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Thanks">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Daily Thanks — 오늘의 감사와 미리 감사, 소그룹과 함께하는 일상">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Noto+Sans+KR:wght@300;400;500;600&display=swap">
<style>
/* Daily Thanks — Soft White design.
   Fonts: Newsreader (serif wordmark, "thanks" in italic) + Noto Sans KR Light (body, ko & en).
   Both fall back to system fonts when offline. */
:root{
  --paper:#FCFCFA;--card:#F6F6F4;--white:#fff;--ink:#303438;--sub:#686E73;--faint:#9BA0A3;
  --line:#E5E6E3;--soft:#EFEFED;--dark:#2F3337;
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #7A8590;outline-offset:2px}
svg.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.15em}
[hidden]{display:none!important}

/* ---------- device frame (desktop only) ----------
   All feed metrics below are measured from the original design photo,
   normalised to a 393 x 852 pt phone screen (iPhone 15 / 15 Pro). */
.device{height:100%}
.statusbar{display:none}
.app-shell{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--paper);padding-top:var(--safe-top)}
.home-indicator{display:none}
@media (min-width:700px){
  body{background:#E9EAEA;display:grid;place-items:center;min-height:100dvh}
  .device{width:405px;height:min(864px,calc(100dvh - 32px));border-radius:56px;background:var(--paper);border:6px solid #EDEEEC;box-shadow:0 0 0 1px #D4D6D6,0 30px 70px #2a30361f;overflow:hidden;display:flex;flex-direction:column;position:relative;--safe-bottom:34px}
  .statusbar{display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 27px;font:600 15px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;flex:none;position:relative}
  .island{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:100px;height:30px;border-radius:16px;background:#111}
  .status-icons{display:flex;gap:6px;align-items:center}.status-icons svg{height:11px;width:auto;fill:currentColor}
  .app-shell{flex:1;height:auto;padding-top:0}
  .home-indicator{display:block;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:4px;background:#2A2D30;z-index:6}
}

/* ---------- top bar: 64pt tall, wordmark 26px, write pill 90x42 ---------- */
.topbar{flex:none;height:64px;padding:0 23px 0 27px;display:flex;align-items:center;justify-content:space-between}
.brand{border:0;background:none;display:flex;align-items:center;gap:10px;padding:0;color:var(--ink)}
.brand-sun{color:#A3A8AB;font-size:18px;display:inline-flex}
.brand-sun .ico{stroke-width:1.4}
.wordmark{font-family:var(--serif);font-size:26px;font-weight:400;letter-spacing:-.025em;line-height:1;white-space:nowrap}
.wordmark em{font-style:italic}
.write-pill{border:0;background:#F0F0EE;border-radius:999px;height:42px;padding:0 9px 0 10px;font-size:14px;display:flex;align-items:center;gap:5px;color:var(--ink);white-space:nowrap}
.write-pill .plus{display:inline-flex;font-size:15px}.write-pill .plus .ico{stroke-width:1.4}

/* ---------- main & screens ---------- */
main{flex:1;min-height:0;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}

/* feed tabs: 50pt row, 15px labels, 27pt gap, divider inset 28pt */
.feed-tabs{flex:none;display:flex;gap:27px;margin:0 28px;border-bottom:1px solid var(--line)}
.feed-tabs button{border:0;background:none;padding:21px 0 9px;line-height:19px;font-size:15px;color:#A3A8AB;position:relative}
.feed-tabs button.active{color:var(--ink);font-weight:500}
.feed-tabs button.active::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.feed-sub{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;height:50px;padding:0 27px 0 29px;font-size:13px;color:var(--sub)}
.link-btn{border:0;background:none;color:var(--sub);font-size:13px;display:flex;align-items:center;gap:6px;padding:4px 0}
.link-btn .ico{font-size:18px;stroke-width:1.3}
.group-select{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;color:var(--ink);max-width:170px}

.feed-scroll{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;container-type:size}
.feed-scroll::-webkit-scrollbar{display:none}

/* post: text block 40pt from left, ~300pt wide; footer anchored to the bottom */
.post{height:100%;min-height:420px;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;padding:0 0 21px;position:relative}
.post-body{flex:1;min-height:0;padding:14.6cqh 53px 12px 40px}
.post-kind{display:flex;align-items:center;gap:7px;font-size:13px;line-height:18px;color:var(--sub);margin-bottom:24px;letter-spacing:.02em}
.post-kind .ico{font-size:18px;color:#8E9497;stroke-width:1.3}
.post-text{font-size:28px;font-weight:300;line-height:55px;letter-spacing:.01em;word-break:keep-all;overflow-wrap:break-word;white-space:pre-wrap;margin:0;color:var(--ink)}
.post-text.long{font-size:24px;line-height:46px}
.post-text.xlong{font-size:19px;line-height:36px}
.post-reflect{font-size:13px;color:var(--sub);margin-top:18px;line-height:1.7;padding:12px 14px;background:var(--card);border-radius:12px}

/* right rail: heart + share only, 20px icons, centred 48pt from the right edge */
.post-rail{position:absolute;right:26px;bottom:72px;display:flex;flex-direction:column;align-items:center;gap:29px}
.rail-btn{border:0;background:none;display:grid;justify-items:center;gap:9px;font-size:13px;line-height:18px;color:var(--sub);padding:0;width:44px}
.rail-btn .ico{font-size:20px;color:var(--ink);stroke-width:1.3}
.rail-btn.liked .ico{fill:#C46B76;stroke:#C46B76}

.post-foot{padding:0 27px 0 40px}
.post-author{display:flex;align-items:center;gap:11px;margin-bottom:18px;height:34px}
.avatar{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#F0F0EE;color:var(--sub);font-size:13px;flex:none}
.author-name{font-size:12px;line-height:16px;color:#B4B8BA}
.author-meta{font-size:13px;line-height:18px;color:var(--sub)}
.post-scope{display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:var(--sub);margin-bottom:24px}
.post-scope .ico{font-size:18px;stroke-width:1.3}
.post-nav{display:flex;justify-content:space-between;align-items:center;font-size:13px;line-height:18px;color:var(--sub)}
.post-nav span{display:flex;align-items:center;gap:9px}
.post-nav .ico{font-size:13px}
.post-nav .count{letter-spacing:.1em;gap:6px}
.post-nav .count .ico{font-size:15px}

/* next button: 34pt black circle, bottom centre, between the 2nd and 3rd tabs */
.next-fab{position:absolute;left:50%;transform:translateX(-50%);bottom:max(12px,calc(var(--safe-bottom) - 12px));z-index:5;width:34px;height:34px;border-radius:50%;border:0;background:#141618;color:#fff;display:grid;place-items:center;font-size:17px;padding:0}
.next-fab .ico{stroke-width:1.8}
@media (min-width:700px){.next-fab{bottom:22px}}

/* bottom nav: 4 equal columns (18pt side padding), border inset 24pt */
.bottom-nav{flex:none;display:flex;align-items:flex-start;height:calc(60px + var(--safe-bottom));padding:11px 18px 0;background:var(--paper);position:relative;z-index:4}
.bottom-nav::before{content:"";position:absolute;top:0;left:24px;right:24px;border-top:1px solid var(--line)}
.bottom-nav button{border:0;background:none;flex:1;display:grid;justify-items:center;gap:7px;font-size:13px;line-height:18px;color:var(--sub);padding:0}
.bottom-nav .nav-ico{font-size:20px;display:inline-flex}
.bottom-nav .nav-ico .ico{stroke-width:1.3}
.bottom-nav button.active{color:var(--ink);font-weight:500}

/* settings entry (moved out of the header so the header matches the original) */
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.section-tools{display:flex;gap:6px}
.chip-btn{border:1px solid var(--line);background:#fff;border-radius:999px;height:30px;min-width:30px;padding:0 10px;font-size:11px;color:var(--sub)}

/* ---------- content sections ---------- */
.empty{margin:auto;padding:40px 30px;text-align:center;color:var(--sub);line-height:1.9;font-size:14px}
.section{padding:22px 24px 40px}
.section-kicker{letter-spacing:.12em;font-size:10px;color:var(--faint);text-transform:uppercase}
.section-title{font-size:27px;font-weight:300;line-height:1.5;letter-spacing:0;margin:10px 0 8px;word-break:keep-all}
.section-desc{font-size:13px;line-height:1.85;color:var(--sub);margin:0 0 22px;word-break:keep-all}
.panel{border:1px solid var(--line);background:var(--white);border-radius:20px;padding:18px;margin:14px 0}
.panel-muted{background:var(--card)}
.panel h3{font-size:17px;font-weight:500;margin:4px 0 6px}
.panel p{font-size:13px;line-height:1.75;color:var(--sub);margin:6px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--sub);font-size:12px}
.tag{display:inline-block;background:var(--soft);border-radius:999px;padding:5px 10px;font-size:11px;color:var(--ink)}
.primary{border:0;background:var(--dark);color:#fff;border-radius:999px;padding:13px 20px;font-weight:500;font-size:13px}
.secondary{border:1px solid var(--line);background:#fff;border-radius:999px;padding:12px 18px;font-size:13px}
.block{width:100%}
.days{display:flex;justify-content:space-between;gap:4px;margin:18px 0}
.day{text-align:center;flex:1;font-size:11px;color:var(--sub)}
.day span{width:100%;max-width:34px;aspect-ratio:1;border-radius:50%;border:1px solid #D9DCDC;background:#fff;display:grid;place-items:center;margin:0 auto 7px;font-size:12px}
.day.done span{background:var(--soft);border-color:var(--soft);color:var(--ink)}
.day.today span{border:1.5px solid var(--ink)}
.mini-tabs{display:flex;gap:6px;margin:6px 0 16px;flex-wrap:wrap}
.mini-tabs button{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;padding:8px 14px;font-size:12px}
.mini-tabs button.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.note-card{padding:20px;margin:12px 0;border-radius:18px;background:#fff;border:1px solid var(--line)}
.note-card .post-kind{margin-bottom:10px;font-size:12px}
.note-card .post-kind .ico{font-size:16px}
.note-card p.note-text{white-space:pre-wrap;font-size:17px;font-weight:300;line-height:1.85;margin:6px 0 10px;word-break:keep-all}
.note-card footer{color:var(--faint);font-size:11px}
.note-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.note-actions button{border:1px solid var(--line);border-radius:999px;background:#fff;padding:7px 12px;font-size:11px}

/* widget preview */
.widget-surface{background:radial-gradient(ellipse at 85% 8%,#f8f8f8,transparent 48%),radial-gradient(ellipse at 7% 80%,#e2e3e4,transparent 61%),#ECEDED;border-radius:24px;padding:22px 14px}
.widget-card{background:#fcfcfbee;border:1px solid #fff;border-radius:24px;padding:20px;margin:0 0 12px;box-shadow:0 12px 28px #25303c0e}
.widget-card h3{font-size:15px;font-weight:500;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.widget-card .question{font-size:18px;font-weight:300;line-height:1.6;padding:2px 0 16px}

/* ---------- sheet ---------- */
.sheet-backdrop{position:absolute;inset:0;background:#171c2366;z-index:9}
.sheet{position:absolute;z-index:10;bottom:0;left:0;right:0;max-height:92%;overflow:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:20px 24px calc(28px + var(--safe-bottom));box-shadow:0 -10px 36px #161c231c}
.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sheet-top h2{font-size:20px;font-weight:500;margin:0}
.close{background:var(--soft);border:0;border-radius:50%;width:34px;height:34px;font-size:18px;color:var(--sub);display:grid;place-items:center}
.field-label{display:block;font-size:12px;color:var(--sub);margin:18px 0 8px}
.check-label{display:flex;align-items:center;gap:8px;font-size:13px;margin:14px 0}
.field,textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;font-size:14px}
textarea{min-height:150px;resize:vertical;font-size:17px;font-weight:300;line-height:1.8}
.radio-row{display:flex;gap:7px;flex-wrap:wrap}
.radio-row button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 15px;color:var(--sub);font-size:13px;display:flex;align-items:center;gap:6px}
.radio-row button.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.hint{font-size:12px;line-height:1.75;color:var(--sub);word-break:keep-all}
.sample-grid{display:flex;gap:7px;flex-wrap:wrap}
.sample-grid button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:12px}
.share-preview{border:1px solid var(--line);background:#fff;padding:34px 24px;border-radius:20px;margin:16px 0}
.share-preview .wordmark{font-size:18px;color:var(--sub)}
.share-preview p{font-size:21px;font-weight:300;line-height:1.75;white-space:pre-wrap;word-break:keep-all}
.share-preview small{color:var(--sub)}
.menu-list{display:grid;gap:8px}
.menu-list button{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px 16px;font-size:14px;text-align:left}
.menu-list .ico{font-size:19px;color:var(--sub)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:9px;font-size:13px;color:var(--sub)}
.seg button.active{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 4px #0000000f}
.fine-print{font-size:11px;color:#858b8e;line-height:1.75}
.divider{border:0;border-top:1px solid var(--line);margin:18px 0}
.toast{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);width:max-content;max-width:88%;background:var(--ink);color:#fff;border-radius:999px;padding:11px 18px;font-size:12px;z-index:15}

/* ---------- English: identical layout; Latin text scaled ~0.9 because it reads larger than Hangul ---------- */
html[lang="en"] .post-text{font-size:25px;line-height:50px;letter-spacing:0}
html[lang="en"] .post-text.long{font-size:22px;line-height:42px}
html[lang="en"] .post-text.xlong{font-size:18px;line-height:34px}
html[lang="en"] .section-title{font-size:25px}
html[lang="en"] .note-card p.note-text{font-size:16px}
html[lang="en"] .share-preview p{font-size:19px}

@media (max-height:700px){.post-text{font-size:24px;line-height:44px}.post-kind{margin-bottom:12px}.post-author{margin-bottom:10px}.post-scope{margin-bottom:12px}.post-rail{bottom:56px;gap:18px}}

/* ---------- splash (first screen) ---------- */
.splash{position:fixed;inset:0;z-index:100;background:#FFFFFF;display:grid;place-items:center;pointer-events:none;transition:opacity .35s ease}
.splash .wordmark{font-size:clamp(40px,11vw,56px);color:var(--ink);animation:splash-in .9s ease both}
.splash.out{opacity:0;pointer-events:none}
@keyframes splash-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.splash,.splash .wordmark{transition:none;animation:none}}

/* ---------- full screen button: outside the phone frame on desktop; in Settings on phones ---------- */
.fs-btn{display:none}
@media (min-width:700px){
  .fs-btn{position:fixed;top:18px;right:20px;z-index:50;display:flex;align-items:center;gap:7px;border:1px solid #D6D8D8;background:#FCFCFA;color:var(--ink);border-radius:999px;height:36px;padding:0 14px;font-size:13px;box-shadow:0 2px 8px #2a30360d}
  .fs-btn:hover{background:#fff}
  .fs-btn .ico{font-size:16px;stroke-width:1.5}
  .fs-btn[hidden]{display:none!important}
  :fullscreen body{background:#E9EAEA}
}

/* ---------- full-screen feed (opens first): only the thanks text + right rail ---------- */
.app-shell.immersive .topbar,.app-shell.immersive .bottom-nav{display:none}
.post.imm{padding:0}
.post.imm .post-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 72px 24px 40px}
.post.imm .post-rail{bottom:calc(56px + var(--safe-bottom));gap:26px}

/* ---------- in-feed cards: today's thanks + sign-in ---------- */
.card-page{padding:0}
.card-inner{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px 40px calc(24px + var(--safe-bottom))}
.card-title{font-size:26px;font-weight:300;line-height:1.55;margin:4px 0 0;color:var(--ink);word-break:keep-all;display:block}
.card-sub{font-size:14px;line-height:1.75;color:var(--sub);margin:0;word-break:keep-all}
.card-hint{color:var(--faint);font-size:20px;margin:6px 0 0}
.card-input{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:10px 0;min-height:0;font-size:20px;font-weight:300;line-height:1.7;resize:none}
.card-input:focus{outline:none;border-bottom-color:var(--ink)}
.card-actions{display:flex;align-items:center;gap:10px;margin-top:6px}
.card-mark{font-size:22px;color:var(--sub)}
.login-buttons{display:grid;gap:10px;margin-top:10px}
.login-btn{display:flex;align-items:center;justify-content:center;gap:10px;height:50px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:15px;font-weight:500}
.login-btn .ico{font-size:19px}
.login-btn.apple{background:#000;border-color:#000;color:#fff}
.subtle-link{border:0;background:none;color:var(--sub);font-size:13px;padding:10px 4px}
html[lang="en"] .card-title{font-size:24px}

/* ---------- full-screen feed: faint logo, author line and first-visit nudge ---------- */
main{position:relative}
.imm-brand{position:absolute;top:18px;left:27px;z-index:3;pointer-events:none;display:flex;align-items:center}
.imm-brand .wordmark{font-size:20px;color:#B4B8BA}
.imm-by{margin:22px 0 0;font-size:13px;line-height:18px;color:#A9AEB1;letter-spacing:.01em}
.imm-nudge{position:absolute;left:0;right:0;bottom:calc(18px + var(--safe-bottom));z-index:3;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:#A9AEB1;font-size:12px;transition:opacity .4s ease}
.imm-nudge .ico{font-size:18px;animation:nudge-bob 1.8s ease-in-out infinite}
.imm-nudge.out{opacity:0}
@keyframes nudge-bob{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(5px);opacity:1}}
@media (prefers-reduced-motion:reduce){.imm-nudge .ico{animation:none}}

/* ================= Unified UI kit (all non-feed screens) =================
   One title per page, line icons only, two button styles, segmented controls, hairline lists. */
.page{padding:12px 24px 40px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.page-title{font-size:26px;font-weight:300;margin:0;letter-spacing:-.005em}
.page-tools{display:flex;gap:8px}
.page-desc{font-size:14px;line-height:1.7;color:var(--sub);margin:6px 0 22px;word-break:keep-all}
.round-btn{width:40px;height:40px;border-radius:50%;border:0;background:#F0F0EE;color:var(--ink);display:grid;place-items:center;font-size:19px;padding:0}
.round-btn .ico{stroke-width:1.4}
.round-btn:active,.list-row:active,.note:active{opacity:.6}

/* buttons */
.primary{border:0;background:var(--dark);color:#fff;border-radius:999px;height:48px;padding:0 22px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.secondary{border:1px solid var(--line);background:#fff;border-radius:999px;height:44px;padding:0 18px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.block{width:100%}

/* segmented control */
.seg{display:flex;background:#F0F0EE;border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:999px;height:38px;padding:0 10px;font-size:13px;color:var(--sub);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button .ico{font-size:15px;stroke-width:1.4}
.seg button.active{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 4px #0000000f}
.seg-page{margin:0 0 8px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;height:36px;padding:0 14px;font-size:13px;color:var(--ink)}
.chip.active{background:var(--dark);border-color:var(--dark);color:#fff}

/* hairline list */
.list{display:flex;flex-direction:column}
.list-row{display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;color:var(--ink);font:inherit;cursor:pointer}
.list-row:last-child{border-bottom:0}
.list-row.static{cursor:default}
.list-row.danger{color:#B4585F}
.row-icon{display:inline-flex;font-size:20px;color:var(--sub)}
.row-icon .ico{stroke-width:1.3}
.list-row.danger .row-icon{color:#B4585F}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-title{font-size:15px;line-height:1.4}
.row-sub{font-size:12px;color:var(--faint)}
.row-end{display:inline-flex;align-items:center;gap:6px;color:#B4B8BA;font-size:18px}
.row-link{font-size:13px;color:var(--sub)}

/* journal notes */
.notes{display:flex;flex-direction:column;margin-top:8px}
.note{display:flex;flex-direction:column;gap:8px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:20px 2px;font:inherit;color:var(--ink);cursor:pointer;width:100%}
.note:last-child{border-bottom:0}
.note-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint)}
.note-meta .ico{font-size:14px;stroke-width:1.3}
.note-scope{margin-left:auto;display:inline-flex}
.note-text{font-size:18px;font-weight:300;line-height:1.75;white-space:pre-wrap;word-break:keep-all}
.note-reflect{font-size:13px;color:var(--sub);line-height:1.6;padding-left:12px;border-left:2px solid var(--line)}
.empty-state{display:flex;flex-direction:column;align-items:center;gap:12px;padding:56px 0;color:var(--sub);text-align:center}
.empty-state .ico{font-size:28px;color:#B4B8BA;stroke-width:1.2}
.empty-state p{margin:0 0 6px;font-size:14px}

/* 7-day challenge */
.ch-card{border:1px solid var(--line);border-radius:22px;padding:18px 18px 18px;margin:0 0 14px;background:#fff}
.ch-head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.ch-name{font-size:18px;font-weight:400;margin-top:2px}
.ch-card .days{margin:18px 0}
.day span .ico{font-size:14px;stroke-width:1.8}

/* sheets */
.sheet{padding:18px 24px calc(28px + var(--safe-bottom))}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:4px;background:#DADCDC;margin:0 auto 14px}
.sheet-top{margin-bottom:18px}
.sheet-top h2{font-size:19px;font-weight:500}
.close{width:34px;height:34px;font-size:16px}
.close .ico{stroke-width:1.6}
.sheet-form{display:flex;flex-direction:column;gap:16px}
.sheet .field-label{margin:4px 0 -6px}
.sheet > .seg{margin-bottom:14px}
.big-input{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:6px 0 12px;min-height:0;font-size:20px;font-weight:300;line-height:1.7;resize:none}
.big-input:focus{outline:none;border-bottom-color:var(--ink)}
.field{height:50px;border-radius:14px;font-size:15px}
.quote{font-size:17px;font-weight:300;line-height:1.75;color:var(--sub);margin:0 0 6px;padding-left:14px;border-left:2px solid var(--line);white-space:pre-wrap;word-break:keep-all}
.quote.center,.hint.center{text-align:center;border:0;padding:0}
.quote.center{color:var(--ink);font-size:19px;margin:6px 0 14px}
.share-preview{margin:0 0 8px;padding:28px 22px}
.about{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.7;color:var(--faint);margin:18px 0 0}
.about .ico{font-size:15px;flex:none;margin-top:2px}

/* switches & time */
.switch{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:#E2E3E1;position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0000002a;transition:transform .2s}
.switch:checked{background:var(--dark)}
.switch:checked::after{transform:translateX(18px)}
.time-input{border:0;background:#F0F0EE;border-radius:10px;height:36px;padding:0 10px;font-size:14px;color:var(--ink)}
.lock-preview{display:flex;flex-direction:column;gap:3px;padding:14px 16px;border-radius:18px;background:#F0F0EE;font-size:13px;color:var(--sub)}
.lock-preview strong{font-weight:500;color:var(--ink);font-size:14px}

/* ---------- save · report ---------- */
.rail-btn.saved .ico{fill:var(--ink)}
.rail-more{gap:0;padding-top:2px}
.post.imm .post-rail{gap:20px}
.report-done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:8px 8px 14px}
.report-done > .ico{font-size:30px;color:var(--ink);stroke-width:1.6;margin-bottom:4px}
.report-done .row-title{font-size:17px;font-weight:500;margin:0}
.report-done .hint{margin:0}
.help-box{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:16px;background:#F0F0EE;font-size:13px;color:var(--sub);margin-bottom:6px}
.help-box p{margin:0}
.help-box strong{color:var(--ink);font-weight:500;font-size:15px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.list-row .secondary{height:34px;padding:0 14px;font-size:13px;flex:none}
.post-body{padding-right:72px}
.post-rail{gap:24px}
.post.imm .post-rail{gap:22px}

/* ---------- reading position: start text in the upper part of the screen, not the middle ---------- */
.post-body{padding-top:7cqh}
.post.imm .post-body{justify-content:flex-start;padding-top:clamp(84px,15cqh,140px)}
.card-inner{justify-content:flex-start;padding-top:clamp(84px,15cqh,140px)}
.post-kind{margin-bottom:18px}
/* small phones (iPhone SE etc.): keep only the author line under the text in the normal feed */
@media (max-height:700px){.post-scope,.post-nav{display:none}.post{padding-bottom:28px}.post-author{margin-bottom:0}}

.post-text,.post-text.long,.post-text.xlong,html[lang="en"] .post-text,html[lang="en"] .post-text.long,html[lang="en"] .post-text.xlong{font-size:var(--read);line-height:1.85}

.note-text,.full-text{font-size:calc(var(--read) - 5px)}
.full-text{font-weight:300;line-height:1.85;white-space:pre-wrap;word-break:keep-all;margin:0}
.big-input,.card-input{font-size:calc(var(--read) - 3px)}
.card-title{font-size:calc(var(--read) + 1px)}

/* reading position: a little lower than before (upper quarter) */

.post.imm .post-body,.card-inner{padding-top:clamp(110px,23cqh,200px)}

/* language filter */

.ty-head{font-family:var(--serif);font-style:italic;font-size:34px;line-height:1.1;color:var(--ink);margin-top:6px}
.ty-name{border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 0 10px;font-size:20px;font-weight:300;color:var(--sub);border-radius:0}
.ty-name::placeholder{color:#C3C6C8}
.ty-name:focus{outline:none;border-bottom-color:var(--ink);color:var(--ink)}
.ty-card{border:1px solid var(--line);background:#fff;border-radius:22px;padding:28px 24px 22px;margin:0 0 16px;display:flex;flex-direction:column;gap:14px}

.ty-card-head em{font-style:italic;color:var(--sub)}

.note-to{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--sub)}

/* ---------- influence ---------- */
.inf-card{display:flex;flex-direction:column;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:20px;padding:16px 16px 14px;margin:0 0 16px;font:inherit;color:var(--ink);cursor:pointer}

.inf-score small{font-size:12px;color:var(--faint);margin-left:2px}
.inf-bar{display:block;height:4px;border-radius:4px;background:#ECEDEB;overflow:hidden}
.inf-bar span{display:block;height:100%;background:#E7B23A;border-radius:4px}

.inf-stats .ico{font-size:14px;stroke-width:1.4}
.inf-week{margin-left:auto;gap:8px!important;font-size:12px;color:var(--faint)}
.mini-dots{display:inline-flex;gap:3px}
.mini-dots i{width:7px;height:7px;border-radius:50%;background:#E2E3E1;display:block}
.mini-dots i.on{background:#E7B23A}
.inf-hero{display:flex;align-items:center;gap:14px;margin-bottom:12px}

.inf-hero p{margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:16px;background:#F4F4F2;color:var(--sub);font-size:12px}

.stat strong{font-size:20px;font-weight:400;color:var(--ink)}
.rank-row{align-items:flex-start}
.rank{width:22px;font-size:15px;color:var(--faint);padding-top:2px}
.top-mark{display:inline-flex;align-items:center;gap:3px;color:#C9971F;margin-left:4px}

.celebrate{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:4px 4px 0}

  en: { work: 'God, thank you for letting me spend each day at work this week with joy.', relationship: 'God, thank you for helping me meet everyone this week with love and patience.', everyday: 'God, thank you for helping me find small graces in an ordinary day.' }
};

/* ---------------- state ---------------- */
const clone = x => JSON.parse(JSON.stringify(x));
let data;
try { const stored = JSON.parse(localStorage.getItem(KEY)); data = stored && Array.isArray(stored.posts) ? stored : clone(seed); }
catch { data = clone(seed); }
if (typeof data.sharesGiven !== 'number') data.sharesGiven = 0;
for (const k of ['liked', 'saved', 'hidden', 'blocked', 'reports', 'celebrated']) if (!Array.isArray(data[k])) data[k] = [];
if (!data.settings.lang) data.settings.lang = (navigator.language || 'ko').toLowerCase().startsWith('ko') ? 'ko' : 'en';

/* Sign-in session. Saved once, kept until the user signs out ("always signed in").
   In the prototype only the state is stored; see fullstack/README.md for wiring real Apple / Google / SMS auth. */
const SESSION_KEY = 'daily-thanks-session';
let session = null;
try { session = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch { session = null; }
function setSession(next) {
  session = next;
  try { next ? localStorage.setItem(SESSION_KEY, JSON.stringify(next)) : localStorage.removeItem(SESSION_KEY); } catch {}
  document.dispatchEvent(new CustomEvent('dt:session', { detail: next }));
}
const GATE_AFTER = 3; // posts shown before the "write today's thanks" card and the sign-in card

const state = { tab: 'feed', feed: 'public', group: data.groups[0]?.id, composeKind: 'today', challenge: null, filter: 'all', immersive: true, justWrote: false, composeScope: 'public' }; // posts default to Everyone; switch to Only me any time // immersive: the app opens on a full-screen feed of people's thanks

const $ = s => document.querySelector(s);
const main = $('#main'), sheet = $('#sheet'), backdrop = $('#backdrop');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lang = () => data.settings.lang;
const t = k => STR[lang()][k] ?? STR.ko[k] ?? k;
const L = v => (v && typeof v === 'object') ? (v[lang()] ?? v.ko ?? v.en) : (v ?? '');
const today = () => new Date().toLocaleDateString('en-CA');

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch { toast(t('toast.noStore')); }
  document.dispatchEvent(new CustomEvent('dt:save', { detail: data }));
}
function toast(text) { const el = $('#toast'); el.textContent = text; el.hidden = false; clearTimeout(toast.timer); toast.timer = setTimeout(() => el.hidden = true, 2600); }

/* ---------------- helpers ---------------- */
const groupName = id => id === 'pair' ? t('ch.pairShort') : L(data.groups.find(g => g.id === id)?.name) || id || '';
const authorName = p => p.mine ? t('me') : L(p.name);
const kindLabel = p => p.kind === 'ahead' ? t('kind.ahead') : p.kind === 'thanks' ? t('kind.thanks') : t('kind.today');
const kindIcon = p => p.kind === 'ahead' ? 'sunrise' : p.kind === 'thanks' ? 'send' : 'sun';
const scopeLabel = p => p.scope === 'public' ? t('scope.public') : p.scope === 'private' ? t('scope.private') : groupName(p.group) || t('scope.group');
const scopeIcon = p => p.scope === 'public' ? 'globe' : p.scope === 'private' ? 'lock' : 'people';
// Same visual line count in both languages: Latin text holds roughly 1.4x the characters per line.
// One reading size for every post (set in Settings › Text size). Very long posts are clamped with "Read more".
const isLong = s => s.length > (lang() === 'en' ? 230 : 150);
const textClass = s => isLong(s) ? 'clamped' : '';
const readMore = (p, text) => isLong(text) ? `<button class="read-more" data-action="read-more" data-id="${esc(p.id)}">${t('readMore')}</button>` : '';
function applyTextSize() { document.documentElement.dataset.size = data.settings.textSize || 'm'; }

function applyStatic() {
  document.documentElement.lang = lang();
  document.title = t('doc.title');
  document.querySelectorAll('[data-i18n]').forEach(el => el.innerHTML = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  document.querySelectorAll('[data-icon]').forEach(el => el.innerHTML = icon(el.dataset.icon));
}

function showSheet({ title, body }) {
  sheet.innerHTML = `<div class="sheet-top"><h2>${title}</h2><button class="close" data-action="close" aria-label="${t('aria.close')}">${icon('x')}</button></div>${body}`;
  sheet.setAttribute('aria-label', title);
  sheet.hidden = false; backdrop.hidden = false;
  if (!sheet.dataset.keepToast) { clearTimeout(toast.timer); $('#toast').hidden = true; }
  setTimeout(() => sheet.querySelector('textarea, input.field')?.focus(), 30); // only text fields get focus
}
function close() { sheet.hidden = true; backdrop.hidden = true; sheet.innerHTML = ''; }

function dayRow(ch) {
  const next = Math.min(ch.days.length + 1, 7);
  return `<div class="days">${Array.from({ length: 7 }, (_, i) => {
    const n = i + 1, done = ch.days.includes(n);
    return `<div class="day ${done ? 'done' : ''} ${n === next && !done ? 'today' : ''}"><span>${done ? icon('check') : n}</span>${lang() === 'ko' ? n + t('ch.day') : t('ch.day') + n}</div>`;
  }).join('')}</div>`;
}

/* ---------------- screens ---------------- */
const wroteToday = () => data.posts.some(p => p.mine && p.date === today());
/* Public feed order: 3 posts → "write today's thanks" card (until written today) → sign-in card (until signed in) → the rest. */
function feedSequence(posts) {
  const items = posts.slice(0, GATE_AFTER).map(p => ({ type: 'post', p }));
  if (posts.length > GATE_AFTER || !session) {
    if (!wroteToday() || state.justWrote) items.push({ type: 'compose' });
    if (!session) return items.concat({ type: 'login' });
  }
  return items.concat(posts.slice(GATE_AFTER).map(p => ({ type: 'post', p })));
}
function composeCard() {
  if (state.justWrote) return `<article class="post card-page" id="compose-card"><div class="card-inner">
    <div class="post-kind">${icon('sun')}<span>${t('gate.kicker')}</span></div>
    <p class="card-title">${t('gate.saved')}</p><p class="card-sub">${t('gate.savedSub')}</p>
    <p class="card-hint">${icon('chevrons')}</p></div></article>`;
  return `<article class="post card-page" id="compose-card"><form class="card-inner" id="gate-compose">
    <div class="post-kind">${icon('sun')}<span>${t('gate.kicker')}</span></div>
    <label class="card-title" for="gate-text">${t('gate.q')}</label>
    <textarea id="gate-text" class="card-input" maxlength="1500" rows="3" placeholder="${esc(t('gate.ph'))}"></textarea>
    ${seg([['public', t('gate.public'), 'globe'], ['private', t('gate.private'), 'lock']], 'gate-scope', state.composeScope)}
    <div class="card-actions"><button class="primary" type="submit">${t('gate.save')}</button><button class="subtle-link" type="button" data-action="gate-later">${t('gate.later')}</button></div>
  </form></article>`;
}
function loginCard() {
  return `<article class="post card-page" id="login-card"><div class="card-inner">
    <span class="wordmark card-mark">daily <em>thanks</em></span>
    <p class="card-title">${t('login.title')}</p><p class="card-sub">${t('login.sub')}</p>
    <div class="login-buttons">
      <button class="login-btn apple" data-action="login" data-id="apple">${icon('apple')}<span>${t('login.apple')}</span></button>
      <button class="login-btn" data-action="login" data-id="google">${icon('google')}<span>${t('login.google')}</span></button>
      <button class="login-btn" data-action="login" data-id="phone">${icon('phoneMsg')}<span>${t('login.phone')}</span></button>
    </div>
    <p class="fine-print">${t('login.demo')}</p></div></article>`;
}
const cardFor = item => item.type === 'compose' ? composeCard() : loginCard();
function bindGateForm() {
  const f = $('#gate-compose'); if (!f) return;
  f.addEventListener('submit', e => {
    e.preventDefault();
    const text = $('#gate-text').value.trim(); if (!text) { $('#gate-text').focus(); return; }
    const post = scope => ({ id: 'p' + Date.now(), mine: true, scope, kind: 'today', text, date: today(), likes: 0 });
    const done = msg => { state.justWrote = true; save(); close(); renderKeep('#compose-card'); cheer(msg); };
    if (passesFilter(text, state.composeScope, (choice, terms) => {
      if (choice === 'edit') { close(); $('#gate-text')?.focus(); return; }
      if (choice === 'private') { data.posts.unshift(post('private')); return done(t('toast.saved')); }
      const p = post(state.composeScope); requestReview(p, terms); data.posts.unshift(p); done(t('mod.appealed'));
    })) { data.posts.unshift(post(state.composeScope)); done(t('toast.saved')); }
  });
}
// Re-render and keep the given card in view (its index can shift when posts change).
function renderKeep(selector) {
  render();
  const sc = $('#feed-scroll'), el = selector && $(selector);
  if (sc && el) sc.scrollTop = el.offsetTop;
}

// Posts the viewer hid, or whose author they blocked, never appear in any feed.
const authorKey = p => p.mine ? 'me' : String(L(p.name) && (p.name.ko || p.name));
const visible = p => !p.status && !data.hidden.includes(p.id) && !data.blocked.includes(authorKey(p)); // 'review' / 'rejected' posts stay off feeds
function feedPosts() {
  return data.posts.filter(visible).filter(p => state.feed === 'public' ? p.scope === 'public' : p.scope === 'group' && p.group === state.group);
}

function postTemplate(p, i, count) {
  const liked = data.liked.includes(p.id), text = L(p.text), name = authorName(p);
  const meta = p.sharedFrom ? t('meta.shared') : (p.kind === 'ahead' ? t('meta.ahead') : t('meta.today'));
  return `<article class="post" data-post="${esc(p.id)}">
    <div class="post-body">
      <div class="post-kind">${icon(kindIcon(p))}<span>${esc(kindLabel(p))}</span></div>
      <p class="post-text ${textClass(text)}">${esc(text)}</p>${readMore(p, text)}
      ${p.reflection ? `<div class="post-reflect">${t('reflect.prefix')} · ${esc(p.reflection)}</div>` : ''}
    </div>
    <aside class="post-rail">
      <button class="rail-btn ${liked ? 'liked' : ''}" data-action="like" data-id="${esc(p.id)}" aria-pressed="${liked}">${icon('heart')}<span>${p.likes + (liked ? 1 : 0)}</span></button>
      <button class="rail-btn ${data.saved.includes(p.id) ? 'saved' : ''}" data-action="save-post" data-id="${esc(p.id)}" aria-pressed="${data.saved.includes(p.id)}" aria-label="${t('save')}">${icon('bookmark')}</button>
      <button class="rail-btn" data-action="share" data-id="${esc(p.id)}">${icon('share')}<span>${t('act.share')}</span></button>
      <button class="rail-btn rail-more" data-action="post-menu" data-id="${esc(p.id)}" aria-label="${t('more')}">${icon('more')}</button>
    </aside>
    <footer class="post-foot">
      <div class="post-author"><div><div class="author-name">${esc(name)}${p.sharedFrom ? ' · ' + esc(L(p.sharedFrom)) : ''}</div><div class="author-meta">${esc(meta)} · ${esc(p.date)}${isTop(p) ? ` <span class="top-mark">${icon('sparkle')}${t('top.badge')}</span>` : ''}</div></div></div>
      <div class="post-scope">${icon(scopeIcon(p))}<span>${esc(scopeLabel(p))}</span></div>
      <div class="post-nav"><span>${icon('chevrons')}${t('feed.swipe')}</span><span class="count">${i + 1} / ${count} ${icon('down')}</span></div>
    </footer>
  </article>`;
}

function renderFeed(keepIndex = 0) {
  const posts = feedPosts();
  const isGroup = state.feed === 'group';
  main.innerHTML = `
    <div class="feed-tabs" role="tablist">
      <button role="tab" class="${isGroup ? 'active' : ''}" aria-selected="${isGroup}" data-action="feed-group">${t('feed.mygroup')}</button>
      <button role="tab" class="${!isGroup ? 'active' : ''}" aria-selected="${!isGroup}" data-action="feed-public">${t('feed.public')}</button>
    </div>
    <div class="feed-sub">
      ${isGroup
        ? `<select class="group-select" data-action="change-group" aria-label="${t('compose.groupLabel')}">${data.groups.map(g => `<option value="${esc(g.id)}" ${state.group === g.id ? 'selected' : ''}>${esc(L(g.name))}</option>`).join('')}</select>`
        : `<span>${t('feed.subPublic')}</span>`}
      <button class="link-btn" data-action="challenges">${icon('sparkle')}${t('feed.together')}</button>
    </div>
    <div class="feed-scroll" id="feed-scroll">
      ${posts.length ? (isGroup ? posts.map((p, i) => postTemplate(p, i, posts.length)).join('')
        : feedSequence(posts).map(it => it.type === 'post' ? postTemplate(it.p, posts.indexOf(it.p), posts.length) : cardFor(it)).join(''))
        : `<div class="empty">${t('feed.empty')}<br><br><button class="primary" data-action="compose">${t('top.write')}</button></div>`}
    </div>
    ${posts.length > 1 ? `<button class="next-fab" data-action="next" aria-label="${t('aria.next')}">${icon('down')}</button>` : ''}`;
  const sc = $('#feed-scroll');
  if (keepIndex && sc) sc.scrollTop = keepIndex * sc.clientHeight;
  bindGateForm();
}

const pageHead = (title, desc, tools = '') => `<header class="page-head"><h1 class="page-title">${title}</h1>${tools ? `<div class="page-tools">${tools}</div>` : ''}</header>${desc ? `<p class="page-desc">${desc}</p>` : ''}`;
const roundBtn = (action, ic, label) => `<button class="round-btn" data-action="${action}" aria-label="${esc(label)}">${icon(ic)}</button>`;

function renderGroups() {
  main.innerHTML = `<div class="screen"><div class="page">
    ${pageHead(t('gr.title'), t('gr.desc'), roundBtn('new-group', 'plus', t('gr.new')))}
    <div class="list">${data.groups.map(g => {
      const n = data.posts.filter(p => p.scope === 'group' && p.group === g.id).length;
      return `<button class="list-row" data-action="open-group" data-id="${esc(g.id)}">
        <span class="row-icon">${icon('people')}</span>
        <span class="row-main"><span class="row-title">${esc(L(g.name))}</span><span class="row-sub">${t('gr.count').replace('{n}', n)}</span></span>
        <span class="row-end">${icon('chevron')}</span></button>`;
    }).join('')}</div>
  </div></div>`;
}

function renderChallenges() {
  main.innerHTML = `<div class="screen"><div class="page">
    ${pageHead(t('ch.title'), t('ch.desc'), roundBtn('new-challenge', 'plus', t('ch.new')))}
    ${data.challenges.map(ch => `<section class="ch-card">
      <button class="ch-head" data-action="challenge-detail" data-id="${esc(ch.id)}">
        <span class="row-main"><span class="row-sub">${esc(groupName(ch.group))} · ${Math.min(7, ch.days.length)}/7</span><span class="ch-name">${esc(L(ch.name))}</span></span>
        <span class="row-end">${icon('chevron')}</span></button>
      ${dayRow(ch)}
      <button class="primary block" data-action="challenge-write" data-id="${esc(ch.id)}">${t('ch.write')}</button>
    </section>`).join('')}
  </div></div>`;
}

function renderJournal() {
  const savedView = state.filter === 'saved';
  let mine = savedView ? data.saved.map(id => data.posts.find(p => p.id === id)).filter(p => p && visible(p)) : data.posts.filter(p => p.mine);
  if (!savedView && state.filter !== 'all') mine = mine.filter(p => p.kind === state.filter);
  main.innerHTML = `<div class="screen"><div class="page">
    ${pageHead(t('j.title'), t('j.desc'), roundBtn('settings', 'more', t('aria.settings')))}
    ${influenceCard()}
    <div class="seg seg-page">${[['all', t('j.all')], ['today', t('kind.today')], ['ahead', t('kind.aheadShort')], ['saved', t('j.saved')]].map(([k, label]) => `<button class="${state.filter === k ? 'active' : ''}" data-action="journal-filter" data-id="${k}">${label}</button>`).join('')}</div>
    ${mine.length ? `<div class="notes">${mine.map(p => `<button class="note" data-action="${savedView ? 'post-menu' : 'note'}" data-id="${esc(p.id)}">
      <span class="note-meta">${icon(kindIcon(p))}<span>${savedView ? esc(authorName(p)) + ' · ' : ''}${esc(kindLabel(p))}</span><span class="dot">·</span><span>${esc(p.date)}</span>${p.status ? `<span class="badge ${p.status}">${t(p.status === 'review' ? 'mod.review' : 'mod.rejected')}</span>` : ''}<span class="note-scope">${icon(scopeIcon(p))}</span></span>
      ${p.kind === 'thanks' ? `<span class="note-to">Thank you, ${esc(p.to)}</span>` : ''}<span class="note-text">${esc(L(p.text))}</span>
      ${p.reflection ? `<span class="note-reflect">${t('reflect.prefix')} · ${esc(p.reflection)}</span>` : ''}
    </button>`).join('')}</div>`
      : savedView ? `<div class="empty-state">${icon('bookmark')}<p>${t('j.savedEmpty')}</p></div>`
      : `<div class="empty-state">${icon('pencil')}<p>${t('j.empty')}</p><button class="primary" data-action="compose">${t('top.write')}</button></div>`}
    <div id="slot-journal"></div>
  </div></div>`;
}

/* Full-screen feed: only the gratitude text, with ♡ count, share and close on the right. */
function renderImmersive(keepIndex = 0) {
  const posts = data.posts.filter(p => p.scope === 'public' && !p.mine && visible(p));
  main.innerHTML = `<div class="feed-scroll imm-scroll" id="feed-scroll">${feedSequence(posts).map(it => {
    if (it.type !== 'post') return cardFor(it);
    const p = it.p, liked = data.liked.includes(p.id), text = L(p.text);
    return `<article class="post imm" data-post="${esc(p.id)}">
      <div class="post-body"><p class="post-text ${textClass(text)}">${esc(text)}</p>${readMore(p, text)}
        <p class="imm-by">${esc(L(p.name))} · ${esc(kindLabel(p))}${isTop(p) ? ` <span class="top-mark">${icon('sparkle')}${t('top.badge')}</span>` : ''}</p></div>
      <aside class="post-rail">
        <button class="rail-btn ${liked ? 'liked' : ''}" data-action="like" data-id="${esc(p.id)}" aria-pressed="${liked}">${icon('heart')}<span>${p.likes + (liked ? 1 : 0)}</span></button>
        <button class="rail-btn ${data.saved.includes(p.id) ? 'saved' : ''}" data-action="save-post" data-id="${esc(p.id)}" aria-pressed="${data.saved.includes(p.id)}" aria-label="${t('save')}">${icon('bookmark')}</button>
      <button class="rail-btn" data-action="share" data-id="${esc(p.id)}">${icon('share')}<span>${t('act.share')}</span></button>
      <button class="rail-btn rail-more" data-action="post-menu" data-id="${esc(p.id)}" aria-label="${t('more')}">${icon('more')}</button>
        <button class="rail-btn" data-action="fullscreen" aria-label="${t('fs.closeAria')}">${icon('minimize')}<span>${t('fs.close')}</span></button>
      </aside></article>`;
  }).join('')}</div>
  <div class="imm-brand" aria-hidden="true"><span class="wordmark">daily <em>thanks</em></span></div>
  ${showNudge() ? `<div class="imm-nudge" id="imm-nudge" aria-hidden="true">${icon('down')}<span>${t('nudge')}</span></div>` : ''}`;
  const sc = $('#feed-scroll');
  if (keepIndex && sc) sc.scrollTop = keepIndex * sc.clientHeight;
  bindGateForm();
  if (sc && $('#imm-nudge')) sc.addEventListener('scroll', hideNudge, { passive: true });
}

/* First visit only: a faint "scroll for more" hint that goes away after the first scroll, for good. */
const NUDGE_KEY = 'daily-thanks-nudged';
let nudged = false;
try { nudged = localStorage.getItem(NUDGE_KEY) === '1'; } catch {}
const showNudge = () => !nudged;
function hideNudge() {
  const sc = $('#feed-scroll');
  if (!sc || sc.scrollTop < 40 || nudged) return;
  nudged = true;
  try { localStorage.setItem(NUDGE_KEY, '1'); } catch {}
  const n = $('#imm-nudge'); if (n) { n.classList.add('out'); setTimeout(() => n.remove(), 500); }
  sc.removeEventListener('scroll', hideNudge);
}

function render(keepIndex) {
  $('#app').classList.toggle('immersive', state.immersive);
  if (state.immersive) { renderImmersive(keepIndex); document.dispatchEvent(new CustomEvent('dt:render', { detail: { tab: 'immersive' } })); return; }
  document.querySelectorAll('[data-tab]').forEach(b => {
    const on = b.dataset.tab === state.tab;
    b.classList.toggle('active', on);
    on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
  });
  ({ feed: () => renderFeed(keepIndex), group: renderGroups, challenges: renderChallenges, journal: renderJournal })[state.tab]();
  document.dispatchEvent(new CustomEvent('dt:render', { detail: { tab: state.tab } }));
}

/* ---------------- sheets ---------------- */
const seg = (items, action, current, extra = '') => `<div class="seg ${extra}">${items.map(([id, label, ic]) => `<button type="button" class="${current === id ? 'active' : ''}" data-action="${action}" data-id="${id}">${ic ? icon(ic) : ''}<span>${label}</span></button>`).join('')}</div>`;

function compose(kind = state.composeKind, chId = state.challenge, keepText = '') {
  state.composeKind = kind; state.challenge = chId;
  state.sheetScope = state.sheetScope || 'public';
  state.sheetGroup = state.sheetGroup || data.groups[0]?.id;
  const ahead = kind === 'ahead';
  const kinds = seg([['today', t('kind.today'), 'sun'], ['ahead', t('kind.aheadShort'), 'sunrise'], ['thanks', t('kind.thanks'), 'send']], 'pick-kind', kind, 'seg-kinds');
  if (kind === 'thanks') {
    showSheet({ title: t('compose.title'), body: `<form id="compose-form" class="sheet-form">${kinds}${thanksForm({ text: keepText, name: state.tyName })}</form>` });
    $('#compose-form').addEventListener('submit', e => {
      e.preventDefault();
      const to = $('#ty-name').value.trim(), text = $('#gratitude-text').value.trim();
      if (!to) { toast(t('ty.needName')); $('#ty-name').focus(); return; }
      if (!text) { $('#gratitude-text').focus(); return; }
      const p = { id: 'p' + Date.now(), mine: true, scope: 'private', kind: 'thanks', to, text, date: today(), likes: 0 };
      data.posts.unshift(p); state.tyName = ''; save(); render(); thanksCard(p.id);
    });
    return;
  }
  showSheet({ title: t('compose.title'), body: `<form id="compose-form" class="sheet-form">
    ${kinds}
    <textarea id="gratitude-text" class="big-input" maxlength="1500" rows="4" placeholder="${esc(ahead ? t('compose.phAhead') : t('compose.qToday'))}" aria-label="${esc(ahead ? t('compose.qAhead') : t('compose.qToday'))}">${esc(keepText)}</textarea>
    ${ahead ? `<div class="chips">${['work', 'relationship', 'everyday'].map(k => `<button type="button" class="chip" data-action="sample" data-id="${k}">${t('sample.' + k)}</button>`).join('')}</div>` : ''}
    <p class="field-label">${t('compose.who')}</p>

/* ---------------- language filter ----------------
   Posts shared with others (group / everyone) are checked for strong or abusive language before posting.
   Private notes are never filtered. The server repeats this check (fullstack/server/moderation.js) —
   the client check is only for instant feedback. Wrongly flagged posts can be sent to a moderator. */
const BLOCKED_TERMS = [
  // Korean (matched after removing spaces, digits and symbols, so "씨 1발" is caught too)
  '씨발', '시발', '씨팔', '쌍놈', '썅', 'ㅅㅂ', 'ㅆㅂ', 'ㅂㅅ', '병신', '븅신', '개새끼', '개색끼', '개쉐이', '좆', '존나', '졸라', 'ㅈㄴ', '지랄', 'ㅈㄹ',
  '미친놈', '미친년', '미친새끼', '닥쳐', '꺼져', '엿먹어', '개같은', '염병', '니미', '느금마', '니애미', '애미뒤', '죽어버려', '뒤져라', '창녀', '걸레년',
  // English
  'fuck', 'fck', 'fuk', 'shit', 'bitch', 'asshole', 'bastard', 'cunt', 'dick', 'motherfucker', 'slut', 'whore', 'retard', 'nigger', 'nigga', 'faggot', 'killyourself', 'kys'
];
const LEET = { '0': 'o', '1': 'i', '3': 'e', '4': 'a', '5': 's', '7': 't', '@': 'a', '$': 's', '!': 'i', '*': '' };
// Korean: keep only Hangul (so "씨 1발", "씨.발" match). English: undo leetspeak, keep only a-z.
const flatKo = s => String(s).replace(/[^가-힣ㄱ-ㅎㅏ-ㅣ]/g, '');
const flatEn = s => String(s).toLowerCase().replace(/[013457@$!*]/g, c => LEET[c]).replace(/[^a-z]/g, '');
const isKo = term => /[가-힣ㄱ-ㅎ]/.test(term);
const SHORT_EN = new Set(['dick', 'kys', 'fck', 'fuk']); // only as whole words, to avoid "dickens", "skys"…
// Ordinary words that happen to contain a blocked term ("시발점" = starting point, "Scunthorpe").
const ALLOWED_WORDS = ['시발점', '시발역', '시발택시', '기시발', 'scunthorpe', 'cocktail', 'shittake', 'dickens', 'hancock'];
function flaggedTerms(raw) {
  let text = String(raw).toLowerCase();
  for (const w of ALLOWED_WORDS) text = text.split(w).join(' ');
  const ko = flatKo(text), en = flatEn(text), words = String(text).toLowerCase().split(/[^a-z0-9@$!*]+/).map(flatEn);
  return BLOCKED_TERMS.filter(term => isKo(term) ? ko.includes(term) : SHORT_EN.has(term) ? words.includes(term) : en.includes(term));
}
const mask = w => w.length <= 1 ? '*' : w[0] + '*'.repeat(Math.min(w.length - 1, 3));

// Returns true when the post may go out now; otherwise shows the filter sheet and calls `onDecision`.
function passesFilter(text, scope, onDecision) {
  if (scope === 'private') return true;
  const terms = flaggedTerms(text);
  if (!terms.length) return true;
  showSheet({ title: t('mod.title'), body: `<p class="page-desc" style="margin:0">${t('mod.body')}</p>
    <div class="flagged"><span class="row-sub">${t('mod.found')}</span><span>${terms.map(mask).map(esc).join(', ')}</span></div>
    <div class="sheet-form">
      <button class="primary block" id="mod-edit">${t('mod.edit')}</button>
      <button class="secondary block" id="mod-private">${icon('lock')}${t('mod.private')}</button>
      <button class="subtle-link" id="mod-appeal">${t('mod.appeal')}</button>
      <p class="hint center" style="margin:0">${t('mod.appealNote')}</p>
    </div>` });
  $('#mod-edit').addEventListener('click', () => onDecision('edit', terms));
  $('#mod-private').addEventListener('click', () => onDecision('private', terms));
  $('#mod-appeal').addEventListener('click', () => onDecision('appeal', terms));
  return false;
}
function requestReview(post, terms) {
  post.status = 'review';
  post.review = { terms, requestedAt: new Date().toISOString() };
  document.dispatchEvent(new CustomEvent('dt:review', { detail: { postId: post.id, text: L(post.text), scope: post.scope, terms } }));
}

/* ---------------- influence (영향력) & streak ----------------
   Score = likes ×1 + saves ×2 + shares ×3 on posts others can see. Levels are gentle milestones, not a leaderboard. */
const likesOf = p => (p.likes || 0) + (data.liked.includes(p.id) ? 1 : 0);
const savesOf = p => (p.saves || 0) + (data.saved.includes(p.id) ? 1 : 0);
const sharesOf = p => p.shares || 0;
const scoreOf = p => likesOf(p) + 2 * savesOf(p) + 3 * sharesOf(p);
// Light theme: the more your thanks travels, the brighter it glows.
const LEVELS = [['candle', 0, 'candle'], ['lantern', 10, 'lantern'], ['sunlight', 50, 'sun'], ['starlight', 150, 'star']];
function influence() {
  const mine = data.posts.filter(p => p.mine && p.scope !== 'private' && !p.status);
  const received = { likes: mine.reduce((a, p) => a + (p.likes || 0), 0), saves: mine.reduce((a, p) => a + (p.saves || 0), 0), shares: mine.reduce((a, p) => a + sharesOf(p), 0) };
  const score = received.likes + 2 * received.saves + 3 * received.shares;
  const given = { likes: data.liked.length, saves: data.saved.length, shares: data.sharesGiven };
  let li = 0; LEVELS.forEach((l, i) => { if (score >= l[1]) li = i; });
  const next = LEVELS[li + 1];
  return { received, given, score, level: LEVELS[li], next, progress: next ? (score - LEVELS[li][1]) / (next[1] - LEVELS[li][1]) : 1 };
}
// Top public posts this week by score; the top 3 get a quiet "reached many" mark in the feed.
const weekAgo = () => daysAgo(7);
function topPosts(n = 5) {
  return data.posts.filter(p => p.scope === 'public' && visible(p) && p.date >= weekAgo()).sort((a, b) => scoreOf(b) - scoreOf(a)).slice(0, n);
}
const isTop = p => topPosts(3).includes(p);
// Consecutive days (ending today) with at least one note of mine.
function streak() {
  const days = new Set(data.posts.filter(p => p.mine).map(p => p.date));
  let n = 0; while (days.has(daysAgo(n))) n++;
  return n;
}
function weekDots() {
  return Array.from({ length: 7 }, (_, i) => { const d = daysAgo(6 - i); return data.posts.some(p => p.mine && p.date === d); });
}
// After saving a note: celebrate a full week, cheer at 3 and 5 days. Shown once per day reached.
function cheer(fallbackToast) {
  const n = streak(), key = today() + ':' + n;
  if (n > 0 && n % 7 === 0 && !data.celebrated.includes(key)) {
    data.celebrated.push(key); save();
    return celebrate();
  }
  if ((n === 3 || n === 5) && !data.celebrated.includes(key)) { data.celebrated.push(key); save(); return toast(t('cel.mid').replace('{n}', n)); }
  if (fallbackToast) toast(fallbackToast);
}
function celebrate() {
  showSheet({ title: '', body: `<div class="celebrate">
    <div class="cel-mark">${icon('sparkle')}</div>
    <p class="cel-title">${t('cel.title')}</p>
    <div class="cel-dots">${weekDots().map(on => `<span class="${on ? 'on' : ''}">${on ? icon('check') : ''}</span>`).join('')}</div>

    <p class="about">${icon('info')}<span>${t('inf.how')}</span></p>` });

/* ---------------- save · report · hide · block ---------------- */
const listRow = (action, id, ic, title, cls = '', end = '') => `<button class="list-row ${cls}" data-action="${action}" data-id="${esc(id)}"><span class="row-icon">${icon(ic)}</span><span class="row-main"><span class="row-title">${title}</span></span>${end ? `<span class="row-end">${end}</span>` : ''}</button>`;

function keepPlace() { const sc = $('#feed-scroll'); return sc ? Math.round(sc.scrollTop / sc.clientHeight) : 0; }

function toggleSave(id) {
  const i = data.saved.indexOf(id);
  i >= 0 ? data.saved.splice(i, 1) : data.saved.unshift(id);
  save(); render(keepPlace()); toast(t(i >= 0 ? 'saved.off' : 'saved.on'));
}

function postMenu(id) {
  const p = data.posts.find(x => x.id === id); if (!p) return;
  if (p.mine) return noteSheet(id);
  const saved = data.saved.includes(id);
  showSheet({ title: esc(L(p.name)), body: `<p class="quote">${esc(L(p.text))}</p>
    <div class="list">
      ${listRow('save-post', id, 'bookmark', saved ? t('menu.unsave') : t('save'))}
      ${listRow('share', id, 'upload', t('note.share'))}
      ${listRow('hide-post', id, 'eyeOff', t('menu.hide'))}
      ${listRow('block-author', id, 'ban', t('menu.block'), 'danger')}
      ${listRow('report', id, 'flag', t('menu.report'), 'danger', icon('chevron'))}
    </div>` });
}

const REPORT_REASONS = ['spam', 'hate', 'violence', 'sexual', 'false', 'privacy', 'selfharm', 'other'];
function reportSheet(id) {
  const p = data.posts.find(x => x.id === id); if (!p) return;
  showSheet({ title: t('report.title'), body: `<p class="page-desc" style="margin:0 0 6px">${t('report.q')}</p>
    <div class="list">${REPORT_REASONS.map(r => listRow('report-reason', `${id}|${r}`, r === 'selfharm' ? 'info' : 'flag', t('report.' + r), '', icon('chevron'))).join('')}</div>
    <p class="hint">${t('report.anon')}</p>` });
}
function reportReason(pair) {
  const [id, reason] = pair.split('|');
  if (reason !== 'other') return submitReport(id, reason, '');
  showSheet({ title: t('report.other'), body: `<form id="report-form" class="sheet-form">
    <textarea id="report-text" class="big-input" rows="4" maxlength="500" placeholder="${esc(t('report.otherPh'))}"></textarea>
    <button class="primary block" type="submit">${t('report.send')}</button></form>` });
  $('#report-form').addEventListener('submit', e => { e.preventDefault(); submitReport(id, 'other', $('#report-text').value.trim()); });
}
function submitReport(id, reason, note) {
  const p = data.posts.find(x => x.id === id); if (!p) return;
  const report = { id: 'r' + Date.now(), postId: id, author: authorKey(p), reason, note, at: new Date().toISOString() };
  data.reports.push(report); save();
  document.dispatchEvent(new CustomEvent('dt:report', { detail: report })); // full-stack client forwards this to the server
  showSheet({ title: t('report.title'), body: `<div class="report-done">${icon('check')}<p class="row-title">${t('report.done')}</p><p class="hint">${t('report.doneSub')}</p></div>
    ${reason === 'selfharm' ? `<div class="help-box"><p>${t('report.help')}</p><strong>${t('report.help1')}</strong><span>${t('report.help2')}</span></div>` : ''}
    <div class="list">
      ${listRow('hide-post', id, 'eyeOff', t('menu.hide'))}
      ${listRow('block-author', id, 'ban', t('menu.block'), 'danger')}
    </div>
    <button class="secondary block" data-action="close" style="margin-top:12px">${t('done')}</button>` });
}
function hidePost(id) {
  if (!data.hidden.includes(id)) data.hidden.push(id);
  save(); close(); render(keepPlace()); toast(t('hidden.done'));
}
function blockAuthor(id) {
  const p = data.posts.find(x => x.id === id); if (!p) return;
  const name = L(p.name);
  confirmSheet(t('menu.block'), esc(t('block.confirm').replace('{name}', name)), t('block.ok'), () => {
    const key = authorKey(p);
    if (!data.blocked.includes(key)) data.blocked.push(key);
    save(); render(keepPlace()); toast(t('blocked.done').replace('{name}', name));
  });
}
function blockedSheet() {
  const posts = data.hidden.map(id => data.posts.find(p => p.id === id)).filter(Boolean);
  const nameOf = key => { const p = data.posts.find(x => authorKey(x) === key); return p ? L(p.name) : key; };
  showSheet({ title: t('s.blocked'), body: !posts.length && !data.blocked.length ? `<p class="hint">${t('blocked.none')}</p>` : `
    ${data.blocked.length ? `<p class="field-label">${t('blocked.users')}</p><div class="list">${data.blocked.map(k => `<div class="list-row static"><span class="row-icon">${icon('user')}</span><span class="row-main"><span class="row-title">${esc(nameOf(k))}</span></span><button class="secondary" data-action="unblock" data-id="${esc(k)}">${t('unblock')}</button></div>`).join('')}</div>` : ''}
    ${posts.length ? `<p class="field-label">${t('blocked.posts')}</p><div class="list">${posts.map(p => `<div class="list-row static"><span class="row-main"><span class="row-title clamp">${esc(L(p.text))}</span><span class="row-sub">${esc(L(p.name))}</span></span><button class="secondary" data-action="unhide" data-id="${esc(p.id)}">${t('restore')}</button></div>`).join('')}</div>` : ''}` });
}

/* ---------------- sign-in ---------------- */
function completeLogin(method, extra = {}) {
  setSession({ method, since: new Date().toISOString(), ...extra });
  const hadCompose = !!$('#compose-card');
  close(); render(); toast(t('login.done'));
  const sc = $('#feed-scroll'); // land on the post that comes right after the cards
  if (sc && state.tab === 'feed' && state.feed === 'public') sc.scrollTop = (GATE_AFTER + (hadCompose ? 1 : 0)) * sc.clientHeight;
}
function phoneLogin() {
  showSheet({ title: t('phone.title'), body: `<form id="phone-form">
    <label class="field-label" for="phone-number">${t('phone.number')}</label>
    <input id="phone-number" class="field" type="tel" inputmode="tel" autocomplete="tel" placeholder="010-1234-5678" required>
    <div id="code-step" hidden><label class="field-label" for="phone-code">${t('phone.code')}</label>
    <input id="phone-code" class="field" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></div>
    <p class="hint">${t('phone.demo')}</p>
    <button class="primary block" type="submit" id="phone-submit">${t('phone.send')}</button></form>` });
  let step = 1;
  $('#phone-form').addEventListener('submit', e => {
    e.preventDefault();
    const digits = $('#phone-number').value.replace(/\D/g, '');
    if (step === 1) {
      if (digits.length < 9) { toast(t('phone.bad')); return; }
      step = 2; $('#code-step').hidden = false; $('#phone-submit').textContent = t('phone.verify'); $('#phone-code').focus(); toast(t('phone.sent'));
    } else {
      if (!/^\d{6}$/.test($('#phone-code').value)) { toast(t('phone.badCode')); return; }
      completeLogin('phone', { phone: digits.slice(0, 3) + '****' + digits.slice(-4) });
    }
  });
}
const methodName = m => ({ apple: 'Apple', google: 'Google', phone: lang() === 'ko' ? '휴대폰' : 'Phone' })[m] || m;

/* ---------------- actions ---------------- */
function setLang(l) {
  data.settings.lang = l; save(); applyStatic();
  const wasSettings = !sheet.hidden && sheet.querySelector('.seg');
  render(); if (wasSettings) settings();
}

function like(id) {
  const p = data.posts.find(x => x.id === id); if (!p) return;
  const i = data.liked.indexOf(id); i >= 0 ? data.liked.splice(i, 1) : data.liked.push(id); save();
  const sc = $('#feed-scroll'), idx = sc ? Math.round(sc.scrollTop / sc.clientHeight) : 0;
  render(idx);
  if (i < 0) toast(p.kind === 'ahead' ? t('toast.likeAhead') : t('toast.likeToday'));
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const el = document.createElement('textarea'); el.value = text; document.body.append(el); el.select(); document.execCommand('copy'); el.remove(); }
  toast(t('toast.copied'));
}

// Copies the demo data as JSON (file downloads are blocked in some embedded viewers).
function exportData() { copyText(JSON.stringify(data, null, 2)); }

// In-app confirmation (browser confirm() dialogs are suppressed in some embedded viewers).
function confirmSheet(title, message, okLabel, onOk) {
  showSheet({ title, body: `<p class="hint" style="font-size:14px">${message}</p>
    <div class="btn-row" style="margin-top:18px"><button class="primary" id="confirm-ok">${okLabel}</button><button class="secondary" data-action="close">${t('cancel')}</button></div>` });
  $('#confirm-ok').addEventListener('click', () => { close(); onOk(); });
}

const actions = {
  home: () => { state.tab = 'feed'; state.feed = 'public'; render(); },
  'feed-public': () => { state.feed = 'public'; renderFeed(); },
  'feed-group': () => { state.feed = 'group'; renderFeed(); },
  challenges: () => { close(); state.tab = 'challenges'; render(); },
  next: () => { const sc = $('#feed-scroll'); sc?.scrollBy({ top: sc.clientHeight, behavior: 'smooth' }); },
  settings, notification: notifications, widget, close,
  'toggle-lang': () => setLang(lang() === 'ko' ? 'en' : 'ko'),
  'set-lang': id => setLang(id),
  like, share, 'send-group': sendToGroup, reflect,
  'pick-kind': id => { state.tyName = $('#ty-name')?.value || state.tyName; compose(id, state.challenge, $('#gratitude-text')?.value || ''); },
  'pick-scope': id => {
    state.sheetScope = id;
    document.querySelectorAll('[data-action="pick-scope"]').forEach(b => b.classList.toggle('active', b.dataset.id === id));
    $('#group-chips').hidden = id !== 'group'; $('#public-note').hidden = id !== 'public';
  },
  'pick-group': id => { state.sheetGroup = id; document.querySelectorAll('[data-action="pick-group"]').forEach(b => b.classList.toggle('active', b.dataset.id === id)); },
  'pick-with': id => { state.sheetWith = id; document.querySelectorAll('[data-action="pick-with"]').forEach(b => b.classList.toggle('active', b.dataset.id === id)); },
  note: noteSheet,
  influence: influenceSheet,
  'cel-share': () => { if (navigator.share) navigator.share({ title: 'Daily Thanks', text: t('cel.shareText') }).catch(() => {}); else copyText(t('cel.shareText')); },
  'ty-copy': id => { const p = data.posts.find(x => x.id === id); if (p) copyText(thanksText(p)); },
  'ty-send': id => {
    const p = data.posts.find(x => x.id === id); if (!p) return;
    if (navigator.share) navigator.share({ title: 'Thank you', text: thanksText(p) }).then(() => { close(); cheer(t('ty.saved')); }).catch(() => {});
    else { copyText(thanksText(p)); }
  },
  'set-size': id => { data.settings.textSize = id; save(); applyTextSize(); document.querySelectorAll('[data-action="set-size"]').forEach(b => b.classList.toggle('active', b.dataset.id === id)); },
  'read-more': id => { const p = data.posts.find(x => x.id === id); if (p) showSheet({ title: esc(p.mine ? t('me') : L(p.name)), body: `<p class="full-text">${esc(L(p.text))}</p>` }); },
  'save-post': toggleSave,
  'post-menu': postMenu,
  report: reportSheet,
  'report-reason': reportReason,
  'hide-post': hidePost,
  'block-author': blockAuthor,
  blocked: blockedSheet,
  unblock: key => { data.blocked = data.blocked.filter(k => k !== key); save(); render(); blockedSheet(); },
  unhide: id => { data.hidden = data.hidden.filter(x => x !== id); save(); render(); blockedSheet(); },
  'send-to': pair => {
    const [id, g] = pair.split('|'); const p = data.posts.find(x => x.id === id); if (!p) return;
    if (flaggedTerms(L(p.text)).length) { toast(t('mod.title')); return; }
    countShare(id);
    data.posts.unshift({ ...clone(p), id: 'repost' + Date.now(), scope: 'group', group: g, mine: false, name: p.mine ? { ko: '나', en: 'Me' } : p.name, sharedFrom: { ko: '공유', en: 'shared' }, likes: 0 });
    save(); close(); state.immersive = false; state.tab = 'feed'; state.feed = 'group'; state.group = g; render(); toast(t('toast.sent'));
  },
  sample: id => { const ta = $('#gratitude-text'); ta.value = SAMPLES[lang()][id]; ta.focus(); },
  'journal-filter': id => { state.filter = id; renderJournal(); },
  delete: id => confirmSheet(t('j.delete'), t('j.confirmDelete'), t('j.delete'), () => { data.posts = data.posts.filter(p => p.id !== id); save(); render(); }),
  'copy-share': id => { const p = data.posts.find(x => x.id === id); if (p) { countShare(id); copyText(`${L(p.text)}\n\n— ${authorName(p)} · Daily Thanks`); } },
  'native-share': id => {
    const p = data.posts.find(x => x.id === id);
    if (navigator.share && p) navigator.share({ title: 'Daily Thanks', text: `${L(p.text)}\n\n— ${authorName(p)} · Daily Thanks` }).then(() => countShare(id)).catch(() => {});
    else toast(t('toast.noShare'));
  },
  'new-group': createGroup,
  'open-group': id => { state.tab = 'feed'; state.feed = 'group'; state.group = id; render(); },
  'new-challenge': createChallenge,
  'challenge-write': id => { close(); compose('today', id); },
  compose: () => compose('today', null),
  'challenge-detail': challengeDetail,
  'save-notifications': () => {
    Object.assign(data.settings, { notificationTime: $('#notify-time').value, notificationEnabled: $('#notify-enabled').checked, groupUpdates: $('#notify-group').checked });
    save(); close(); toast(t('toast.nSaved'));
  },
  export: exportData,
  fullscreen: toggleFullscreen,
  login: id => id === 'phone' ? phoneLogin() : completeLogin(id),
  logout: () => { setSession(null); close(); render(); toast(t('acct.loggedOut')); },
  'gate-scope': id => { state.composeScope = id; document.querySelectorAll('[data-action="gate-scope"]').forEach(b => b.classList.toggle('active', b.dataset.id === id)); },
  'gate-later': () => { const sc = $('#feed-scroll'), card = $('#compose-card'); if (sc && card) sc.scrollTo({ top: card.offsetTop + sc.clientHeight, behavior: 'smooth' }); },
  reset: () => confirmSheet(t('s.reset'), t('s.confirmReset'), t('s.reset'), () => {
    const l = lang(); data = clone(seed); data.settings.lang = l; state.group = data.groups[0].id;
    save(); state.tab = 'feed'; render(); toast(t('toast.reset'));
  })
};

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { state.tab = tab.dataset.tab; if (state.tab === 'feed') state.feed = 'public'; close(); render(); return; }
  const b = e.target.closest('[data-action]');
  if (b && b.tagName !== 'SELECT') actions[b.dataset.action]?.(b.dataset.id);
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-action="change-group"]')) { state.group = e.target.value; renderFeed(); }
});
backdrop.addEventListener('click', close);
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

/* Extension hook for optional add-ons (e.g. fullstack/public/client.js): server sync and
   feature-flagged screens. The plain front-end app never uses it, so nothing changes visually. */
window.DailyThanks = {
  getData: () => data,
  replaceData: next => { if (next && Array.isArray(next.posts)) { data = next; try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} applyStatic(); render(); } },
  lang, t, esc, icon, showSheet, close, toast, render: () => render(), getSession: () => session
};

/* Full screen: hides the browser's bars (Fullscreen API). iPhone Safari has no API for pages,
   so there we explain "Add to Home Screen", which opens the app full screen. */
const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
const isFull = () => !!fsElement();
const fsSupported = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
// "Full screen" = the in-app full-screen feed; where the browser allows it, the browser bars hide too.
async function toggleFullscreen() {
  close();
  const sc = $('#feed-scroll'), idx = sc ? Math.round(sc.scrollTop / sc.clientHeight) : 0;
  const entering = !state.immersive;
  state.immersive = entering;
  if (entering) { state.tab = 'feed'; state.feed = 'public'; }
  render(state.tab === 'feed' && state.feed === 'public' ? idx : 0);
  if (!fsSupported()) return;
  const root = document.documentElement;
  try {
    if (!entering && isFull()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else if (entering && !isFull()) await (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
  } catch { /* browser full screen is optional; the in-app full screen already applies */ }
}
function updateFsButton() {
  const b = $('#fs-btn'); if (!b) return;
  b.hidden = false;
  b.innerHTML = `${icon(state.immersive ? 'minimize' : 'maximize')}<span>${state.immersive ? t('fs.exit') : t('fs.enter')}</span>`;
  b.setAttribute('aria-pressed', String(state.immersive));
}
// Leaving browser full screen with Esc also closes the in-app full-screen feed.
const onFsChange = () => { if (!isFull() && state.immersive && fsWasOn) { state.immersive = false; render(); } fsWasOn = isFull(); updateFsButton(); };
let fsWasOn = false;
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);
document.addEventListener('dt:render', updateFsButton);

applyStatic();
applyTextSize();
render();

/* Splash: white screen with the wordmark only, then fades into the app (tap to skip). */
const splash = $('#splash');
if (splash) {
  let gone = false;
  const hide = () => {
    if (gone) return; gone = true; splash.classList.add('out'); setTimeout(() => splash.remove(), 600);
    ['pointerdown', 'touchstart', 'wheel', 'keydown'].forEach(ev => window.removeEventListener(ev, hide, true));
  };
  // The splash never blocks input (pointer-events: none): the first swipe or wheel scrolls the feed
  // underneath right away, and any touch, scroll or key press fades the splash out immediately.
  ['pointerdown', 'touchstart', 'wheel', 'keydown'].forEach(ev => window.addEventListener(ev, hide, { capture: true, passive: true }));
  setTimeout(hide, 1800);
}
})();

</script>
