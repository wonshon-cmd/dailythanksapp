# Publishes the dailyjourney.org website (site/web) with GitHub Pages.
# Runs when the site, the legal texts or the app content change on main, or by hand (Actions › Website › Run workflow).
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/template.html'
      - 'tools/build-site.py'
      - 'store/legal/**'
      - 'content/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site
        run: python3 tools/build-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/web
      - id: deployment
        uses: actions/deploy-pages@v4
