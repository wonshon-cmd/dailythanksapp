# Publishes the dailyjourney.org website (site/web) with GitHub Pages.
# Runs when the site, the legal texts or the app content change on main, or by hand (Actions › Website › Run workflow).
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'brand/**'
      - 'tools/build-site.py'
      - 'store/legal/**'
      - 'content/**'
      - 'bible/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # let a publish finish; a cut-off one is what made GitHub lose the files

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site
        run: python3 tools/build-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/web
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub sometimes can't find the files it just packed: wait a bit and try once more
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - if: steps.deployment.outcome == 'failure'
        id: deployment2
        uses: actions/deploy-pages@v4
