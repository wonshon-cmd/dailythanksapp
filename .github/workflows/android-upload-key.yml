# One time only: makes the Google Play "upload key" for you (no Java on your computer needed).
# GitHub › Actions › "Make Android upload key" › Run workflow → open the finished run → download "android-upload-key"
# (kept for 1 day). Inside are the four values to paste into GitHub › Settings › Secrets and variables › Actions.
# Then delete the downloaded file. If the key is ever lost, Google Play can reset it (Play App Signing).
name: Make Android upload key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Make the key
        run: |
          mkdir out && cd out
          PW=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
          keytool -genkeypair -v -keystore upload.jks -alias upload -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=Daily Journey, O=Daily Journey Inc., C=US" >/dev/null 2>&1
          base64 -w0 upload.jks > ANDROID_KEYSTORE_BASE64.txt
          printf '%s' "$PW" > ANDROID_KEYSTORE_PASSWORD.txt
          printf '%s' "$PW" > ANDROID_KEY_PASSWORD.txt
          printf 'upload' > ANDROID_KEY_ALIAS.txt
          echo "Make one GitHub secret per .txt file: the secret's name is the file name (without .txt), its value is what's inside." > README.txt
          rm upload.jks
      - uses: actions/upload-artifact@v4
        with:
          name: android-upload-key
          path: out
          retention-days: 1
