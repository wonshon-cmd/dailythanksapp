<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Journey</title>
<meta name="description" content="daily bible · daily thanks — 말씀과 감사로 이어지는 하루">
<meta property="og:title" content="Daily Journey">
<meta property="og:description" content="daily bible · daily thanks">
<meta property="og:image" content="https://dailyjourney.org/dailybible/og.png">
<meta name="theme-color" content="#FFFFFF">
<link rel="canonical" href="https://dailyjourney.org/">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Daily Journey, Inc.","url":"https://dailyjourney.org/","email":"hi@dailyjourney.org","logo":"https://dailyjourney.org/dailybible/apple-touch-icon.png","address":{"@type":"PostalAddress","streetAddress":"105 Challenger Rd","addressLocality":"Ridgefield Park","addressRegion":"NJ","postalCode":"07660","addressCountry":"US"}}</script>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Noto+Sans+KR:wght@300;400;500&display=swap">
<style>
:root{
  --paper:#FFFFFF; --ink:#1F2326; --text:#3A3F43; --sub:#8A9095; --line:#ECEDEE; --pill:#F1F1F1;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit}
img{max-width:100%}
.wrap{max-width:960px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;padding-block:22px}
.mark{font-family:var(--serif);font-size:21px;color:var(--ink);letter-spacing:-.02em;text-decoration:none}
.lang{appearance:none;border:0;background:var(--pill);border-radius:999px;font:inherit;font-size:13.5px;color:var(--text);padding:7px 14px;cursor:pointer}
.hero{padding-block:72px 56px;text-align:center}
.hero h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(44px,8vw,76px);line-height:1.05;letter-spacing:-.03em;color:var(--ink);text-wrap:balance}
.hero p{margin:18px auto 0;max-width:30em;color:var(--sub);font-size:17px;text-wrap:balance}
.apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding-bottom:72px}
@media (max-width:720px){.apps{grid-template-columns:1fr}}
.app{border:1px solid var(--line);border-radius:28px;padding:32px 28px 28px;display:flex;flex-direction:column;min-width:0}
.app img.icon{width:64px;height:64px;border-radius:16px;box-shadow:0 1px 3px #2a303614}
.app h2{margin:20px 0 4px;font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.1;letter-spacing:-.025em;color:var(--ink)}
.app h2 em{font-style:italic}
.app .tag{margin:0;color:var(--sub)}
.app ul{list-style:none;margin:22px 0 28px;padding:0;flex:1}
.app li{padding:11px 0;border-top:1px solid var(--line);font-size:15.5px}
.app li:last-child{border-bottom:1px solid var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:400;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--ink);color:#fff}
.btn.secondary{background:var(--pill);color:var(--ink)}
footer{border-top:1px solid var(--line);padding-block:28px 40px;font-size:13.5px;color:var(--sub)}
footer nav{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:10px}
footer nav a{text-decoration:none}
footer nav a:hover{color:var(--ink)}
.co{font-style:normal;line-height:1.7;margin:4px 0 12px}
.co strong{color:var(--ink);font-weight:500}
.co a{text-decoration:none}
.cr{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="mark" href="/">Daily Journey</a>
    <select class="lang" id="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="es">Español</option></select>
  </header>

  <section class="hero">
    <h1>Daily Journey</h1>
    <p data-k="sub"></p>
  </section>

  <section class="apps">
    <article class="app">
      <img class="icon" src="/dailybible/apple-touch-icon.png" alt="" width="64" height="64">
      <h2>daily <em>bible</em></h2>
      <p class="tag" data-k="bTag"></p>
      <ul><li data-k="b1"></li><li data-k="b2"></li><li data-k="b3"></li><li data-k="b4"></li></ul>
      <div class="btns"><a class="btn primary" href="/daily-bible/" data-k="open"></a><a class="btn secondary" href="/dailybible/" data-k="more"></a></div>
    </article>
    <article class="app">
      <img class="icon" src="/favicon.png" alt="" width="64" height="64">
      <h2>daily <em>thanks</em></h2>
      <p class="tag" data-k="tTag"></p>
      <ul><li data-k="t1"></li><li data-k="t2"></li><li data-k="t3"></li><li data-k="t4"></li></ul>
      <div class="btns"><a class="btn primary" href="/app/" data-k="open"></a><a class="btn secondary" href="/thanks/" data-k="more"></a></div>
    </article>
  </section>

  <footer>
    <nav><a href="/privacy/" data-k="privacy"></a><a href="/terms/" data-k="terms"></a><a href="/support/" data-k="support"></a><a href="/delete-account/" data-k="delete"></a></nav>
    <address class="co">
      <strong>Daily Journey, Inc.</strong><br>
      105 Challenger Rd<br>Ridgefield Park, NJ 07660<br>United States<br>
      <a href="mailto:hi@dailyjourney.org">hi@dailyjourney.org</a>
    </address>
    <p class="cr">© <span id="yr">2026</span> Daily Journey, Inc.</p>
  </footer>
</div>
<script>
const S = {
  ko: { sub: '말씀과 감사로 이어지는 하루. 혼자서도, 공동체와 함께도.', bTag: '말씀에 집중하는 하루',
    b1: '한 절씩, 한 장씩 스크롤로 읽는 말씀', b2: '설교를 녹음하면 자동으로 정리되는 설교 노트', b3: '공동체와 함께하는 읽기 계획과 기도제목', b4: '통독 기록과 매일 이어지는 읽은 날',
    tTag: '감사가 이어지는 하루', t1: '하루 한 줄, 오늘의 감사', t2: '가까운 사람들과만 나누는 감사', t3: '함께 7일, 감사 챌린지', t4: '감사 카드로 마음 전하기',
    open: '웹에서 열기', more: '더 알아보기', privacy: '개인정보 처리방침', terms: '이용약관', support: '고객지원', delete: '계정 삭제' },
  en: { sub: 'Days carried by the Word and by gratitude — on your own, or with your community.', bTag: 'A day focused on the Word',
    b1: 'Scripture one verse, one card at a time', b2: 'Record a sermon, get your notes written for you', b3: 'Reading plans and prayer requests with your community', b4: 'Read-through history and your reading days',
    tTag: 'A day that carries gratitude', t1: 'One line of thanks a day', t2: 'Shared only with the people close to you', t3: '7 days of thanks, together', t4: 'Send a thank-you card',
    open: 'Open on the web', more: 'Learn more', privacy: 'Privacy', terms: 'Terms', support: 'Support', delete: 'Delete account' },
  es: { sub: 'Días sostenidos por la Palabra y la gratitud — a solas o con tu comunidad.', bTag: 'Un día centrado en la Palabra',
    b1: 'La Escritura versículo a versículo, una tarjeta a la vez', b2: 'Graba un sermón y tus notas se escriben solas', b3: 'Planes de lectura y peticiones con tu comunidad', b4: 'Historial de lectura y tus días leídos',
    tTag: 'Un día que lleva gratitud', t1: 'Una línea de gratitud al día', t2: 'Solo con las personas cercanas', t3: '7 días de gratitud, juntos', t4: 'Envía una tarjeta de gracias',
    open: 'Abrir en la web', more: 'Saber más', privacy: 'Privacidad', terms: 'Términos', support: 'Soporte', delete: 'Eliminar cuenta' }
};
let lang = 'ko';
try { lang = localStorage.getItem('dj-lang') || ''; } catch (e) {}
if (!S[lang]) { const n = (navigator.language || 'ko').slice(0, 2); lang = S[n] ? n : 'en'; }
const sel = document.getElementById('lang');
function paint() {
  document.documentElement.lang = lang; sel.value = lang;
  document.querySelectorAll('[data-k]').forEach(el => { el.textContent = S[lang][el.dataset.k]; });
}
sel.addEventListener('change', () => { lang = sel.value; try { localStorage.setItem('dj-lang', lang); } catch (e) {} paint(); });
document.getElementById('yr').textContent = new Date().getFullYear();
paint();
</script>
</body>
</html>
