<style>
/* Layout: the app itself, opened up — pure white, one centred reading column, serif wordmark, light sans text. */
:root{
  --paper:#FAFAFA; --ink:#16191C; --text:#303438; --sub:#686E73; --faint:#9BA0A3; --ghost:#B4B8BA;
  --pill:#F1F1F1; --line:#EEEEEE; --light:#F6D77A;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--text);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
.wordmark{font-family:var(--serif);font-weight:400;letter-spacing:-.025em;line-height:1;white-space:nowrap;text-decoration:none}
.wordmark em,.serif em{font-style:italic}
.wrap{max-width:1040px;margin:0 auto}
.col{max-width:640px;margin:0 auto}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:20px}
.top .wordmark{font-size:21px;color:var(--ghost);transition:opacity .3s ease}
body.home .top .wordmark{opacity:0;pointer-events:none}
.top nav{display:flex;align-items:center;gap:22px;font-size:13px;color:var(--faint)}
.top nav a{text-decoration:none}
.top nav a:hover,.top nav a[aria-current="page"]{color:var(--text)}
.lang{position:relative;display:flex;align-items:center;gap:5px;color:var(--faint);font-size:13px}
.lang svg{width:15px;height:15px}
.lang select{appearance:none;border:0;background:transparent;color:inherit;font:inherit;padding:4px 0;cursor:pointer}
.lang select:focus-visible{outline:1px solid var(--faint);outline-offset:3px;border-radius:4px}
@media (max-width:640px){.top nav .navlink{display:none}}

/* hero */
.hero{text-align:center;padding-block:clamp(72px,14vw,150px) clamp(56px,9vw,100px)}
.hero .wordmark{display:block;font-size:clamp(48px,10.5vw,88px);color:#383D42}
.tag{margin:clamp(40px,6vw,60px) 0 0;font-family:var(--serif);font-size:clamp(18px,2.4vw,21px);line-height:1.75;color:#80868A;display:flex;flex-direction:column;align-items:center;letter-spacing:.005em}
.stores{margin-top:44px;display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:var(--pill);color:var(--text);padding:11px 20px;font-size:14px;font-weight:400;text-decoration:none;border:0;font-family:inherit;cursor:pointer}
.pill svg{width:16px;height:16px}
.pill small{color:var(--faint);font-size:12px;font-weight:300}
.pill:focus-visible{outline:2px solid var(--faint);outline-offset:2px}

/* sample thanks, read like the feed */
.reads{border-top:1px solid var(--line)}
.read{min-height:clamp(320px,52vw,460px);display:flex;flex-direction:column;justify-content:center;padding-block:56px;border-bottom:1px solid var(--line)}
.read p{margin:0;font-size:clamp(20px,3.2vw,25px);line-height:1.8;color:var(--text);letter-spacing:-.01em;text-wrap:pretty}
.read .by{margin-top:22px;font-size:13px;color:var(--faint)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 12px}

/* how it works */
.how{padding-block:clamp(72px,11vw,120px)}
.how h2,.legal h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,5vw,42px);line-height:1.2;color:var(--ink);letter-spacing:-.02em;margin:0 0 40px;text-wrap:balance}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px}
.steps h3{margin:0 0 8px;font-size:17px;font-weight:400;color:var(--ink)}
.steps p{margin:0;font-size:15px;color:var(--sub)}
@media (max-width:720px){.steps{grid-template-columns:1fr;gap:28px}}
.reach{display:flex;align-items:center;gap:12px;margin-top:56px;padding-top:28px;border-top:1px solid var(--line);font-size:14px;color:var(--sub)}
.glow{position:relative;width:34px;height:34px;flex:none}
.glow::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#FBE7A6 0,#F8E3A0cc 18%,#FBEFC566 45%,#FFFFFF00 70%);animation:breathe 5s ease-in-out infinite}
.glow::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--light)}
@keyframes breathe{50%{transform:scale(1.18);opacity:.8}}

/* legal pages */
.legal{padding-block:clamp(48px,8vw,88px) 40px}
.legal .back{display:inline-block;margin-bottom:28px;font-size:13px;color:var(--faint);text-decoration:none}
.legal .back:hover{color:var(--text)}
.legal h1{margin-bottom:12px}
.legal h2{font-size:18px;font-weight:500;color:var(--ink);margin:44px 0 10px}
.legal h3{font-size:16px;font-weight:500;color:var(--ink);margin:28px 0 8px}
.legal h4{font-size:15px;font-weight:500;margin:22px 0 6px}
.legal p,.legal li{font-size:15px;color:var(--text)}
.legal p{margin:0 0 14px}
.legal ul,.legal ol{padding-left:20px;margin:0 0 14px}
.legal li{margin:4px 0}
.legal strong{font-weight:500;color:var(--ink)}
.legal code{font-size:.92em;background:var(--pill);border-radius:4px;padding:1px 5px}
.legal a{text-underline-offset:3px;text-decoration-color:var(--ghost)}
.legal mark{background:#FFF6D6;color:inherit;border-radius:3px;padding:0 3px}
.table{overflow-x:auto;margin:6px 0 18px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;vertical-align:top;padding:10px 12px 10px 0;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--ink)}
.mail{font-weight:400;color:var(--ink);user-select:all}

/* shared thanks page */
.shared{padding-block:clamp(56px,10vw,110px) 40px}
.shared-kind{margin:0 0 22px;font-size:13px;color:var(--faint)}
.shared-to{margin:0 0 14px;font-family:var(--serif);font-size:24px;color:#383D42}
.shared-text{margin:0;font-size:clamp(21px,3.4vw,26px);line-height:1.8;color:var(--ink);letter-spacing:-.01em;white-space:pre-line;text-wrap:pretty}
.shared-by{margin:24px 0 0;font-size:14px;color:var(--faint)}
.shared-cta{margin-top:clamp(56px,9vw,90px);padding-top:32px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.shared-cta p{margin:0;color:var(--sub)}
.shared-cta .stores{justify-content:flex-start;margin-top:4px}
/* group invite page */
.join .wordmark{font-size:clamp(34px,7vw,48px)}
.join-kicker{margin:clamp(40px,6vw,56px) 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.join-name{margin:0;font-weight:400;font-size:clamp(28px,5vw,38px);color:var(--ink);letter-spacing:-.01em;text-wrap:balance}
.join-body{margin:14px 0 0;color:var(--sub)}
.join-note{margin:28px 0 0;font-size:14px;color:var(--faint)}
.join .stores{margin-top:22px}
.pill-dark{padding:14px 28px;font-size:15px;font-weight:500;color:var(--ink)}
/* footer */
footer{border-top:1px solid var(--line);margin-top:24px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px;padding-block:40px 56px;font-size:13px;color:var(--faint)}
footer .org{display:flex;flex-direction:column;gap:6px}
footer .org strong{font-weight:400;color:var(--sub)}
footer nav{display:flex;flex-wrap:wrap;gap:8px 20px}
footer nav a{text-decoration:none}
footer nav a:hover{color:var(--text)}
.copy{display:inline-flex;align-items:center;gap:8px}
.copy button{border:0;background:var(--pill);color:var(--sub);border-radius:999px;font:inherit;font-size:12px;padding:3px 10px;cursor:pointer}

@media (prefers-reduced-motion:reduce){.glow::before{animation:none}}
</style>

const PAGES = {"privacy": {"ko": "<p><strong>시행일: <mark>2026년 12월 1일</mark></strong></p>\n<p>Daily Journey, Inc.(이하 \"운영자\")는 Daily Thanks 앱과 웹사이트(이하 \"서비스\")를 이용하는 분들의 개인정보를 소중히 여기며, 「개인정보 보호법」 등 관련 법령을 지킵니다. 이 방침은 어떤 정보를 왜 처리하고, 어떻게 보호하며, 이용자가 어떤 권리를 가지는지 설명합니다.</p>\n<h3>1. 처리하는 개인정보 항목</h3>\n<div class=\"table\"><table><thead><tr><th>구분</th><th>항목</th><th>수집 시점</th></tr></thead><tbody><tr><td>계정</td><td>Apple 또는 Google 계정 식별자, (제공 시) 이메일 주소, 이름 / 휴대폰 번호(휴대폰 로그인 시)</td><td>로그인할 때</td></tr><tr><td>이용자가 작성한 내용</td><td>감사 글, 감사 카드(받는 사람 이름 포함), 돌아보며 쓴 글, 공개 범위 설정</td><td>글을 쓸 때</td></tr><tr><td>이용 기록</td><td>좋아요·저장·공유·신고·차단·숨김 기록, 본 글 기록, 작성 날짜</td><td>서비스를 이용할 때</td></tr><tr><td>설정</td><td>언어, 글자 크기, 알림 시간, 기능 켜기/끄기</td><td>설정할 때</td></tr><tr><td>기기 정보</td><td>푸시 알림 토큰, 기기 종류·운영체제 버전, 앱 버전</td><td>알림을 허용하거나 앱을 실행할 때</td></tr><tr><td>(선택) 설교 요약</td><td>설교 녹음 파일 또는 받아쓴 글, 요약 결과</td><td>\"AI 설교 요약\"을 직접 켜고 사용할 때만</td></tr></tbody></table></div>\n<ul><li>광고 목적의 추적, 위치 정보 수집, 다른 앱·웹사이트에서의 활동 추적은 하지 않습니다.\n</li><li>만 14세 미만은 서비스에 가입할 수 없습니다.\n</li></ul>\n<h3>2. 처리 목적</h3>\n<ol><li>회원 식별, 로그인 유지, 계정 관리\n</li><li>감사 글 저장·표시, 이용자가 고른 공개 범위(나만 보기·소그룹·모두)에 따른 공개\n</li><li>알림 시간에 맞춘 리마인더 발송(이미 글을 쓴 날은 보내지 않음)\n</li><li>부적절한 표현 걸러내기, 신고 처리, 차단·숨김 등 안전한 이용 환경 유지\n</li><li>서비스 오류 확인과 개선\n</li><li>(선택) 이용자가 요청한 설교 녹음의 받아쓰기와 요약\n</li></ol>\n<h3>3. 보유 및 이용 기간</h3>\n<ul><li>계정과 작성한 글은 <strong>회원 탈퇴(계정 삭제) 시 지체 없이 삭제</strong>합니다.\n</li><li>신고 처리 기록은 분쟁 대응을 위해 처리 완료 후 1년간 보관한 뒤 삭제합니다. 신고한 사람의 정보는 탈퇴 시 익명 처리합니다.\n</li><li>관련 법령에 따라 보관해야 하는 정보는 해당 기간 동안만 보관합니다.\n</li></ul>\n<h3>4. 개인정보의 제3자 제공</h3>\n<p>운영자는 이용자의 동의 없이 개인정보를 제3자에게 제공하지 않습니다. 다만 법령에 따라 요구되는 경우는 예외로 합니다.</p>\n<h3>5. 처리 위탁 및 국외 이전</h3>\n<p>서비스 운영을 위해 아래 업체에 처리를 맡깁니다. 이 업체들의 서버는 국외(미국 등)에 있을 수 있습니다.</p>\n<div class=\"table\"><table><thead><tr><th>수탁 업체</th><th>위탁 업무</th><th>이전 국가</th></tr></thead><tbody><tr><td>Google LLC (Firebase)</td><td>로그인, 데이터 저장, 푸시 알림</td><td>미국 등</td></tr><tr><td>Apple Inc.</td><td>Apple 로그인, iOS 푸시 알림</td><td>미국</td></tr><tr><td><mark>문자 인증 업체</mark></td><td>휴대폰 번호 인증 문자 발송</td><td><mark>국가</mark></td></tr><tr><td>Anthropic PBC (선택 기능)</td><td>설교 글 요약</td><td>미국</td></tr><tr><td><mark>음성 인식 업체</mark> (선택 기능)</td><td>설교 녹음 받아쓰기</td><td><mark>국가</mark></td></tr></tbody></table></div>\n<ul><li>이전 시기·방법: 서비스 이용 시 네트워크를 통해 암호화하여 전송합니다.\n</li><li>국외 이전을 원하지 않으면 계정을 삭제해 이전을 중단할 수 있습니다.\n</li><li>선택 기능은 이용자가 켜고 사용할 때만 해당 업체로 전송됩니다.\n</li></ul>\n<h3>6. 파기 절차 및 방법</h3>\n<p>보유 기간이 끝나거나 처리 목적이 달성된 정보는 지체 없이 파기합니다. 전자 파일은 복구할 수 없는 방법으로 삭제합니다.</p>\n<h3>7. 이용자의 권리</h3>\n<ul><li>이용자는 언제든지 자신의 개인정보를 열람·정정·삭제하거나 처리 정지를 요청할 수 있습니다.\n</li><li><strong>앱에서:</strong> 설정 › 정보 › 계정 삭제를 누르면 계정과 작성한 글이 삭제됩니다.\n</li><li><strong>웹에서:</strong> <a href=\"https://dailyjourney.org/delete-account\" target=\"_blank\" rel=\"noopener\">dailyjourney.org/delete-account</a> 에서 삭제를 요청할 수 있습니다.\n</li><li>기타 요청: <span class=\"mail\">hi@dailyjourney.org</span>\n</li></ul>\n<h3>8. 안전성 확보 조치</h3>\n<ul><li>전송 구간 암호화(HTTPS)\n</li><li>서버 측 접근 권한 관리: 다른 사람의 비공개 글은 볼 수 없도록 함\n</li><li>접근 기록 관리\n</li><li>최소한의 인원만 운영 데이터에 접근\n</li></ul>\n<h3>9. 자동 수집 장치</h3>\n<p>서비스는 광고 쿠키를 사용하지 않습니다. 로그인 유지와 설정 저장을 위해 기기 내 저장소를 사용합니다.</p>\n<h3>10. 개인정보 보호책임자</h3>\n<ul><li>이름: <mark>이름</mark>\n</li><li>이메일: <span class=\"mail\">hi@dailyjourney.org</span>\n</li></ul>\n<p>개인정보 침해 신고·상담은 다음 기관에도 문의할 수 있습니다.</p>\n<ul><li>개인정보침해신고센터: (국번 없이) 118, privacy.kisa.or.kr\n</li><li>개인정보분쟁조정위원회: 1833-6972, kopico.go.kr\n</li></ul>\n<h3>11. 방침 변경</h3>\n<p>내용이 바뀌면 시행 7일 전에 앱 또는 웹사이트에 알립니다. 중요한 변경은 30일 전에 알립니다.</p>", "en": "<p><strong>Effective date: <mark>December 1, 2026</mark></strong></p>\n<p>Daily Journey, Inc. (\"we\") runs the Daily Thanks app and website (the \"Service\"). This policy explains what we collect, why, how we protect it, and the choices you have.</p>\n<h3>1. What we collect</h3>\n<div class=\"table\"><table><thead><tr><th>Category</th><th>Data</th><th>When</th></tr></thead><tbody><tr><td>Account</td><td>Apple or Google account identifier, email and name (if you share them), or your phone number if you sign in with your phone</td><td>When you sign in</td></tr><tr><td>Your content</td><td>Notes of thanks, thank-you cards (including the recipient name you type), reflections, visibility setting</td><td>When you write</td></tr><tr><td>Activity</td><td>Likes, saves, shares, reports, blocks, hidden posts, posts viewed, dates written</td><td>When you use the Service</td></tr><tr><td>Settings</td><td>Language, text size, reminder time, features turned on or off</td><td>When you change them</td></tr><tr><td>Device</td><td>Push notification token, device type, OS version, app version</td><td>When you allow notifications or open the app</td></tr><tr><td>Optional: sermon notes</td><td>Sermon recording or transcript, and the summary</td><td>Only if you turn on \"AI sermon notes\" and use it</td></tr></tbody></table></div>\n<ul><li>We do <strong>not</strong> track you across other apps or websites.\n</li><li>We do <strong>not</strong> collect location.\n</li><li>We do <strong>not</strong> use your data for advertising.\n</li><li>The Service is not for children under 14. In the U.S., it is not directed to children under 13.\n</li></ul>\n<h3>2. Why we use it</h3>\n<ol><li>Create and keep your account signed in\n</li><li>Store your notes and show them only to the audience you choose (Only me, a group, or Everyone)\n</li><li>Send one reminder at your chosen time (skipped on days you've already written)\n</li><li>Keep the community safe: filtering abusive language, handling reports, blocking and hiding\n</li><li>Fix bugs and improve the Service\n</li><li>Optional: transcribe and summarize a sermon you submit\n</li></ol>\n<h3>3. How long we keep it</h3>\n<ul><li>Your account and notes are <strong>deleted when you delete your account</strong>.\n</li><li>Report records are kept for one year after resolution, for safety and disputes. The reporter is anonymized when their account is deleted.\n</li><li>We keep data longer only where the law requires it.\n</li></ul>\n<h3>4. Sharing</h3>\n<ul><li>We do not sell your personal information.\n</li><li>We do not share your personal information with third parties, except our service providers below or where required by law.\n</li></ul>\n<h3>5. Service providers (may process data outside your country)</h3>\n<div class=\"table\"><table><thead><tr><th>Provider</th><th>Purpose</th></tr></thead><tbody><tr><td>Google LLC (Firebase)</td><td>Sign-in, storage, push notifications</td></tr><tr><td>Apple Inc.</td><td>Sign in with Apple, iOS notifications</td></tr><tr><td><mark>SMS provider</mark></td><td>Phone verification codes</td></tr><tr><td>Anthropic PBC (optional feature)</td><td>Sermon summaries</td></tr><tr><td><mark>Speech-to-text provider</mark> (optional feature)</td><td>Sermon transcription</td></tr></tbody></table></div>\n<p>Data is encrypted in transit.</p>\n<h3>6. Your rights</h3>\n<p>You can access, correct, or delete your data, or ask us to stop processing it:</p>\n<ul><li><strong>In the app:</strong> Settings › About › Delete account\n</li><li><strong>On the web:</strong> <a href=\"https://dailyjourney.org/delete-account\" target=\"_blank\" rel=\"noopener\">dailyjourney.org/delete-account</a>\n</li><li><strong>By email:</strong> <span class=\"mail\">hi@dailyjourney.org</span>\n</li></ul>\n<p>Depending on where you live (for example, under the GDPR in the EU/UK or the CCPA in California), you may have additional rights, including data portability and the right to complain to a supervisory authority. We honor these rights for all users.</p>\n<h3>7. Security</h3>\n<p>We protect your data with:</p>\n<ul><li>Encryption in transit (HTTPS)\n</li><li>Server-side access rules, so no one else can read your private notes\n</li><li>Access logging\n</li><li>Least-privilege access for operators\n</li></ul>\n<h3>8. Changes</h3>\n<p>We will post changes in the app or on our website at least 7 days before they take effect, and 30 days before for significant changes.</p>\n<h3>9. Contact</h3>\n<p>Daily Journey, Inc. · <span class=\"mail\">hi@dailyjourney.org</span> · <mark>mailing address</mark></p>", "es": "<p><strong>Fecha de vigencia: <mark>1 de diciembre de 2026</mark></strong></p>\n<p>Daily Journey, Inc. (\"nosotros\") opera la app y el sitio web Daily Thanks (el \"Servicio\"). Esta política explica qué datos recogemos, para qué, cómo los protegemos y qué opciones tienes.</p>\n<h3>1. Qué recogemos</h3>\n<div class=\"table\"><table><thead><tr><th>Categoría</th><th>Datos</th><th>Cuándo</th></tr></thead><tbody><tr><td>Cuenta</td><td>Identificador de Apple o Google, correo y nombre (si los compartes) o tu número de teléfono si inicias sesión con él</td><td>Al iniciar sesión</td></tr><tr><td>Tu contenido</td><td>Notas de gratitud, tarjetas de agradecimiento (incluido el nombre que escribas), reflexiones, visibilidad</td><td>Al escribir</td></tr><tr><td>Actividad</td><td>Me gusta, guardados, compartidos, reportes, bloqueos, ocultos, publicaciones vistas, fechas</td><td>Al usar el Servicio</td></tr><tr><td>Ajustes</td><td>Idioma, tamaño de texto, hora del recordatorio, funciones activadas</td><td>Al cambiarlos</td></tr><tr><td>Dispositivo</td><td>Token de notificaciones, tipo de dispositivo, versión del sistema y de la app</td><td>Al permitir notificaciones o abrir la app</td></tr><tr><td>Opcional: notas de sermón</td><td>Grabación o transcripción y el resumen</td><td>Solo si activas y usas \"Notas de sermón con IA\"</td></tr></tbody></table></div>\n<ul><li><strong>No</strong> te rastreamos en otras apps o sitios web.\n</li><li><strong>No</strong> recogemos tu ubicación.\n</li><li><strong>No</strong> usamos tus datos para publicidad.\n</li><li>El Servicio no está dirigido a menores de 14 años.\n</li></ul>\n<h3>2. Para qué los usamos</h3>\n<ol><li>Crear tu cuenta y mantener tu sesión\n</li><li>Guardar tus notas y mostrarlas solo al público que elijas (Solo yo, un grupo o Todos)\n</li><li>Enviar un recordatorio a la hora que elijas (no se envía si ya escribiste ese día)\n</li><li>Mantener la comunidad segura: filtrar lenguaje ofensivo, atender reportes, bloquear y ocultar\n</li><li>Corregir errores y mejorar el Servicio\n</li><li>Opcional: transcribir y resumir un sermón que envíes\n</li></ol>\n<h3>3. Cuánto tiempo los guardamos</h3>\n<ul><li>Tu cuenta y tus notas <strong>se eliminan al eliminar tu cuenta</strong>.\n</li><li>Los registros de reportes se guardan un año después de resolverse y se anonimizan si quien reportó elimina su cuenta.\n</li></ul>\n<h3>4. Compartir</h3>\n<ul><li>No vendemos tus datos.\n</li><li>Solo los comparten nuestros proveedores, para prestar el Servicio (Google Firebase, Apple, <mark>proveedor de SMS</mark> y, en funciones opcionales, Anthropic y <mark>proveedor de transcripción</mark>), o cuando la ley lo exige.\n</li><li>Los datos viajan cifrados.\n</li></ul>\n<h3>5. Tus derechos</h3>\n<p>Puedes acceder, corregir o eliminar tus datos:</p>\n<ul><li><strong>En la app:</strong> Ajustes › Acerca de › Eliminar cuenta\n</li><li><strong>En la web:</strong> <a href=\"https://dailyjourney.org/delete-account\" target=\"_blank\" rel=\"noopener\">dailyjourney.org/delete-account</a>\n</li><li><strong>Por correo:</strong> <span class=\"mail\">hi@dailyjourney.org</span>\n</li></ul>\n<h3>6. Contacto</h3>\n<p>Daily Journey, Inc. · <span class=\"mail\">hi@dailyjourney.org</span></p>"}, "terms": {"ko": "<p><strong>시행일: <mark>2026년 12월 1일</mark></strong></p>\n<ol><li><strong>서비스:</strong> Daily Thanks는 감사를 기록하고 나누는 서비스입니다. 운영자는 Daily Journey, Inc.입니다.\n</li><li><strong>가입:</strong> 만 14세 이상만 가입할 수 있습니다. Apple, Google, 휴대폰 번호로 로그인합니다.\n</li><li><strong>내가 쓴 글:</strong>\n<ul><li>글의 권리는 작성자에게 있습니다.\n</li><li>「모두」 또는 「소그룹」으로 공개한 글은 서비스 안에서 보여주고, 다른 이용자가 공유할 수 있도록 허락하는 것으로 봅니다.\n</li><li>「나만 보기」 글은 다른 사람에게 보이지 않습니다.\n</li></ul>\n</li><li><strong>금지되는 행동:</strong> 다음 행동은 할 수 없습니다.\n<ul><li>욕설·혐오·괴롭힘\n</li><li>성적인 내용\n</li><li>폭력이나 자해를 부추기는 내용\n</li><li>다른 사람의 개인정보 노출\n</li><li>스팸·광고\n</li><li>다른 사람을 사칭하는 행위\n</li><li>불법적인 내용\n</li><li><strong>부적절한 글과 이를 올리는 이용자는 용납하지 않습니다.</strong> 가입(로그인)하면 이 약관에 동의하는 것으로 봅니다.\n</li></ul>\n</li><li><strong>안전 조치:</strong>\n<ul><li>운영자는 부적절한 표현을 자동으로 걸러낼 수 있습니다.\n</li><li>신고된 글은 검토 후 숨기거나 삭제할 수 있고, 반복해서 위반한 계정은 이용을 제한할 수 있습니다.\n</li><li>잘못 걸러졌다고 생각하면 검토를 요청할 수 있습니다.\n</li></ul>\n</li><li><strong>설교 요약(선택 기능):</strong> 설교는 설교자의 저작물입니다. 요약은 개인 묵상용으로 사용하고, 다른 사람과 나누려면 교회나 설교자의 동의를 받아 주세요.\n</li><li><strong>계정 삭제:</strong> 앱의 설정 › 정보 › 계정 삭제, 또는 <a href=\"https://dailyjourney.org/delete-account에서\" target=\"_blank\" rel=\"noopener\">dailyjourney.org/delete-account에서</a> 언제든 삭제할 수 있습니다.\n</li><li><strong>책임의 한계:</strong> 서비스는 있는 그대로 제공됩니다. 운영자는 법이 허용하는 범위에서 간접적인 손해에 책임지지 않습니다.\n</li><li><strong>변경:</strong> 약관이 바뀌면 시행 7일 전에 알립니다.\n</li><li><strong>문의:</strong> <span class=\"mail\">hi@dailyjourney.org</span>\n</li></ol>", "en": "<p><strong>Effective date: <mark>December 1, 2026</mark></strong></p>\n<ol><li><strong>The Service:</strong> Daily Thanks is a place to record and share gratitude. It is operated by Daily Journey, Inc.\n</li><li><strong>Eligibility:</strong> You must be at least 14. In the U.S., you must be at least 13. You sign in with Apple, Google, or your phone number.\n</li><li><strong>Your content:</strong>\n<ul><li>You own what you write.\n</li><li>Posts you share with Everyone or a group may be displayed in the Service and shared by other users.\n</li><li>\"Only me\" notes are never shown to others.\n</li></ul>\n</li><li><strong>Not allowed:</strong>\n<ul><li>Abuse, hate, or harassment\n</li><li>Sexual content\n</li><li>Content encouraging violence or self-harm\n</li><li>Exposing someone's private information\n</li><li>Spam or ads\n</li><li>Impersonating someone\n</li><li>Illegal content\n</li><li><strong>There is no tolerance for objectionable content or abusive users.</strong> By signing in, you agree to these Terms.\n</li></ul>\n</li><li><strong>Safety:</strong>\n<ul><li>We may automatically filter abusive language.\n</li><li>We may remove reported content after review and limit accounts that repeatedly break these rules.\n</li><li>You can ask for a review if you think a decision was wrong.\n</li></ul>\n</li><li><strong>Sermon notes (optional):</strong> Sermons belong to their preachers. Use summaries for personal reflection, and get permission from the church or preacher before sharing them.\n</li><li><strong>Deleting your account:</strong> Settings › About › Delete account, or <a href=\"https://dailyjourney.org/delete-account\" target=\"_blank\" rel=\"noopener\">dailyjourney.org/delete-account</a>.\n</li><li><strong>Disclaimer:</strong> The Service is provided \"as is\". To the extent the law allows, we are not liable for indirect damages.\n</li><li><strong>Changes:</strong> We will notify you at least 7 days before changes take effect.\n</li><li><strong>Contact:</strong> <span class=\"mail\">hi@dailyjourney.org</span>\n</li></ol>", "es": "<p><strong>Vigencia: <mark>1 de diciembre de 2026</mark></strong></p>\n<ol><li><strong>El Servicio:</strong> Daily Thanks es un lugar para registrar y compartir gratitud, operado por Daily Journey, Inc..\n</li><li><strong>Requisitos:</strong> Debes tener al menos 14 años. Inicias sesión con Apple, Google o tu teléfono.\n</li><li><strong>Tu contenido:</strong>\n<ul><li>Lo que escribes es tuyo.\n</li><li>Lo que compartes con Todos o con un grupo puede mostrarse en el Servicio y otros usuarios pueden compartirlo.\n</li><li>Las notas \"Solo yo\" nunca se muestran a otros.\n</li></ul>\n</li><li><strong>No está permitido:</strong>\n<ul><li>Insultos, odio o acoso\n</li><li>Contenido sexual\n</li><li>Contenido que incite a la violencia o la autolesión\n</li><li>Exponer datos privados de otra persona\n</li><li>Spam\n</li><li>Suplantar a otra persona\n</li><li>Contenido ilegal\n</li><li><strong>No se tolera el contenido ofensivo ni a los usuarios abusivos.</strong> Al iniciar sesión, aceptas estos Términos.\n</li></ul>\n</li><li><strong>Seguridad:</strong>\n<ul><li>Podemos filtrar lenguaje ofensivo y retirar contenido reportado tras revisarlo.\n</li><li>Puedes pedir una revisión si crees que la decisión fue un error.\n</li></ul>\n</li><li><strong>Notas de sermón (opcional):</strong> Los sermones pertenecen a quienes los predican. Úsalas para tu reflexión personal y pide permiso antes de compartirlas.\n</li><li><strong>Eliminar tu cuenta:</strong> Ajustes › Acerca de › Eliminar cuenta, o <a href=\"https://dailyjourney.org/delete-account\" target=\"_blank\" rel=\"noopener\">dailyjourney.org/delete-account</a>.\n</li><li><strong>Contacto:</strong> <span class=\"mail\">hi@dailyjourney.org</span>\n</li></ol>"}, "support": {"ko": "<p><strong>Daily Thanks 고객 문의</strong></p>\n<p>궁금한 점이나 불편한 점이 있으면 언제든 알려 주세요. 보통 2영업일 안에 답장드려요.</p>\n<ul><li>이메일: <span class=\"mail\">hi@dailyjourney.org</span>\n</li></ul>\n<p><strong>자주 묻는 질문</strong></p>\n<ul><li><strong>내 글은 누가 볼 수 있나요?</strong>\n<ul><li>글을 쓸 때 「모두」 또는 「비공개」를 고를 수 있어요.\n</li><li>비공개는 나만 보거나, 고른 소그룹 사람들만 볼 수 있어요.\n</li></ul>\n</li><li><strong>좋아요 숫자는 왜 안 보이나요?</strong>\n<ul><li>비교 없이 편하게 감사를 나누도록, 좋아요 숫자는 글쓴이에게만 보여요.\n</li></ul>\n</li><li><strong>알림 시간을 바꾸고 싶어요.</strong>\n<ul><li>나의 감사 › ⋯ › 알림 시간에서 바꿀 수 있어요.\n</li><li>그날 이미 감사를 썼다면 알림은 오지 않아요.\n</li></ul>\n</li><li><strong>부적절한 글을 봤어요.</strong>\n<ul><li>글 오른쪽의 ⋯ › 신고하기를 눌러 주세요.\n</li><li>같은 메뉴에서 그 글을 숨기거나 그 사람을 차단할 수도 있어요.\n</li></ul>\n</li><li><strong>계정을 삭제하고 싶어요.</strong>\n<ul><li>앱의 설정 › 정보 › 계정 삭제에서 바로 삭제할 수 있어요.\n</li><li>앱 없이도 <a href=\"https://dailyjourney.org/delete-account\" target=\"_blank\" rel=\"noopener\">dailyjourney.org/delete-account</a> 에서 요청할 수 있어요.\n</li></ul>\n</li></ul>\n<p><strong>도움이 필요하다면</strong> 지금 위험한 상황이라면 자살예방상담전화 109(24시간), 긴급 상황은 112 · 119로 연락해 주세요.</p>", "en": "<p><strong>Daily Thanks Support</strong></p>\n<p>Questions or problems? Email <span class=\"mail\">hi@dailyjourney.org</span>. We usually reply within 2 business days.</p>\n<ul><li><strong>Who can see my notes?</strong>\n<ul><li>Choose \"Everyone\" or \"Private\" when you write.\n</li><li>Private means only you, or only the group you pick.\n</li></ul>\n</li><li><strong>Why can't I see like counts?</strong>\n<ul><li>To keep gratitude free of comparison, only the writer sees counts on their own posts.\n</li></ul>\n</li><li><strong>How do I change my reminder time?</strong>\n<ul><li>My Thanks › ⋯ › Reminder time.\n</li><li>No reminder is sent on days you've already written.\n</li></ul>\n</li><li><strong>I saw something inappropriate.</strong>\n<ul><li>Tap ⋯ next to the post › Report.\n</li><li>You can also hide the post or block the person.\n</li></ul>\n</li><li><strong>How do I delete my account?</strong>\n<ul><li>In the app: Settings › About › Delete account.\n</li><li>Or request it at <a href=\"https://dailyjourney.org/delete-account\" target=\"_blank\" rel=\"noopener\">dailyjourney.org/delete-account</a>.\n</li></ul>\n</li></ul>\n<p><strong>If you or someone else is in danger,</strong> call or text 988 (US) or your local emergency number.</p>", "es": "<p><strong>Soporte de Daily Thanks</strong></p>\n<p>Escríbenos a <span class=\"mail\">hi@dailyjourney.org</span>. Respondemos en unos 2 días hábiles.</p>\n<ul><li><strong>Eliminar la cuenta:</strong>\n<ul><li>En la app: Ajustes › Acerca de › Eliminar cuenta.\n</li><li>O en <a href=\"https://dailyjourney.org/delete-account\" target=\"_blank\" rel=\"noopener\">dailyjourney.org/delete-account</a>.\n</li></ul>\n</li><li><strong>Reportar contenido:</strong> Toca ⋯ junto a la publicación › Reportar.\n</li></ul>"}, "delete-account": {"ko": "<p><strong>Daily Thanks 계정 삭제 요청</strong></p>\n<ul><li><strong>앱에서 바로 삭제하기 (권장):</strong> 앱을 열고 나의 감사 › ⋯(설정) › 정보 › <strong>계정 삭제</strong>를 누르세요.\n</li><li><strong>앱이 없을 때:</strong> <span class=\"mail\">hi@dailyjourney.org로</span> 아래 내용을 보내 주세요.\n<ul><li>제목: 계정 삭제 요청\n</li><li>로그인 방법: Apple / Google / 휴대폰 번호\n</li><li>Apple·Google 로그인이라면 그 계정의 이메일, 휴대폰 로그인이라면 휴대폰 번호\n</li></ul>\n</li><li>본인 확인 후 <strong>7일 안에</strong> 삭제하고 결과를 알려 드려요.\n</li></ul>\n<p><strong>삭제되는 정보</strong></p>\n<ul><li>계정 정보\n</li><li>내가 쓴 감사 글과 감사 카드, 돌아보며 쓴 글\n</li><li>좋아요·저장·숨김·차단 기록\n</li><li>알림 설정과 기기 알림 토큰\n</li></ul>\n<p><strong>보관되는 정보</strong></p>\n<ul><li>신고 처리 기록은 안전을 위해 처리 완료 후 1년간 보관해요. 신고한 사람은 익명으로 바뀌어요.\n</li></ul>", "en": "<p><strong>Request account deletion — Daily Thanks</strong></p>\n<ul><li><strong>In the app (fastest):</strong> My Thanks › ⋯ (Settings) › About › <strong>Delete account</strong>.\n</li><li><strong>Without the app:</strong> email <span class=\"mail\">hi@dailyjourney.org</span> with:\n<ul><li>Subject: Delete my account\n</li><li>How you sign in: Apple, Google, or phone\n</li><li>Your account email or phone number\n</li></ul>\n</li><li>We verify and delete within <strong>7 days</strong>, then confirm by email.\n</li></ul>\n<p><strong>Deleted:</strong></p>\n<ul><li>Your account\n</li><li>Your notes, cards, and reflections\n</li><li>Likes, saves, hidden posts, and blocks\n</li><li>Reminder settings and push tokens\n</li></ul>\n<p><strong>Kept:</strong> report records, for one year after resolution for safety. The reporter is anonymized.</p>", "es": "<p><strong>Solicitar la eliminación de la cuenta</strong></p>\n<ul><li><strong>En la app:</strong> Mi gratitud › ⋯ › Acerca de › <strong>Eliminar cuenta</strong>.\n</li><li><strong>Sin la app:</strong> escribe a <span class=\"mail\">hi@dailyjourney.org</span> con el asunto \"Eliminar mi cuenta\". Incluye cómo inicias sesión y tu correo o teléfono.\n</li></ul>\n<p>Eliminamos tus datos en <strong>7 días</strong>. Los registros de reportes se guardan un año, de forma anónima.</p>"}};

const READS = [
  { name:{ko:'영숙',en:'Margaret',es:'Carmen'}, text:{ko:'오늘 손주가 처음으로 "할머니 사랑해요"라고 또박또박 말해 줬어요. 평생 들은 말 중에 제일 예쁜 말이었어요. 이렇게 오래 살게 하셔서 이 말을 듣게 하시니 감사합니다.', en:'Today my grandson said “Grandma, I love you” clearly for the first time. It was the most beautiful thing I’ve heard in my life. Thank you for letting me live long enough to hear it.', es:'Hoy mi nieto me dijo por primera vez, clarito, “Abuela, te quiero”. Fue lo más bonito que he escuchado en mi vida. Gracias por dejarme vivir tanto como para oírlo.'} },
  { name:{ko:'서연',en:'Olivia',es:'Sofía'}, text:{ko:'잠깐 멈춰 보니, 집으로 돌아가는 길에도 예쁜 하늘이 있었어요. 평범한 하루를 아름답게 하심에 감사합니다.', en:'I paused on my way home and found a lovely sky. Thank you for a beautiful ordinary day.', es:'Me detuve camino a casa y encontré un cielo precioso. Gracias por un día común tan bonito.'} },
  { name:{ko:'태호',en:'Daniel',es:'Pablo'}, text:{ko:'아버지와 오랜만에 둘이서 낚시를 갔어요. 고기는 한 마리도 못 잡았지만, 아버지가 젊은 시절 이야기를 처음 들려주셨어요. 그 시간이 잡은 고기보다 훨씬 귀했어요.', en:'I went fishing alone with my dad for the first time in years. We didn’t catch a single fish, but he told me stories from his youth for the first time. That time was worth far more than any catch.', es:'Fui a pescar a solas con mi papá por primera vez en años. No pescamos nada, pero por primera vez me contó historias de su juventud. Ese tiempo valió mucho más que cualquier pesca.'} }
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const APPLE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.5-1-2.5-3.9zM14 5.5c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/></svg>';
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.5 2.8 13.6 12l-9.1 9.2c-.3-.2-.5-.6-.5-1V3.8c0-.4.2-.8.5-1zm10.2 10.3 2.2 2.2-10.6 6 8.4-8.2zm3.5-3.5 2.6 1.5c.8.5.8 1.3 0 1.8l-2.6 1.5-2.4-2.4 2.4-2.4zM6.3 2.7l10.6 6-2.2 2.2-8.4-8.2z"/></svg>';

// On the real website (dailyjourney.org) pages live at /privacy/, /terms/ …; inside the preview they use #privacy.
const WEB = window.SITE_MODE === 'web';
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } }
let lang = store('dt-site-lang') || ((navigator.language || 'en').slice(0, 2));
if (!S[lang]) lang = 'en';

function home(t) {
  return `<section class="hero"><span class="wordmark">daily <em>thanks</em></span>
    <p class="tag"><span>Give <em>thanks</em> daily.</span><span>Live abundantly.</span><span>Share the joy.</span></p>
    <div class="stores"><span class="pill">${APPLE}App Store <small>${t.soon}</small></span><span class="pill">${PLAY}Google Play <small>${t.soon}</small></span></div></section>
  <section class="reads">${READS.map(r => `<article class="read"><div class="col"><p>${esc(r.text[lang])}</p><div class="by">${esc(r.name[lang])} · ${t.today}</div></div></article>`).join('')}</section>
  <section class="how wrap"><h2>${t.how}</h2>
    <div class="steps"><div><h3>${t.s1t}</h3><p>${t.s1}</p></div><div><h3>${t.s2t}</h3><p>${t.s2}</p></div><div><h3>${t.s3t}</h3><p>${t.s3}</p></div></div>
    <div class="reach"><span class="glow" aria-hidden="true"></span><span>${t.reach}</span></div></section>`;
}
// Shared thanks: dailyjourney.org/t/#<base64url JSON {t,n,k,d,l,to,r}> — the words live in the link, nothing is stored.
function post(t) {
  let p = null;
  try {
    const raw = WEB ? location.hash.slice(1) : (location.hash.split('?')[1] || ''); // preview: #t?<code>
    const b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
    p = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64 + '==='.slice((b64.length + 3) % 4)), c => c.charCodeAt(0))));
  } catch { p = null; }
  if (!p || !p.t) return `<section class="hero join"><span class="wordmark">daily <em>thanks</em></span><p class="join-note">${t.postBad}</p>
    <div class="stores"><a class="pill pill-dark" href="/app/">${t.postWrite}</a></div></section>`;
  const kind = { today: t.kToday, ahead: t.kAhead, thanks: t.kThanks, meditation: t.kMed, verse: t.kVerse }[p.k] || t.kToday;
  const text = String(p.t).slice(0, 1500), name = String(p.n || '').slice(0, 40);
  return `<section class="shared col">
    <p class="shared-kind">${esc(kind)}${p.r ? ' · ' + esc(String(p.r).slice(0, 60)) : ''}</p>
    ${p.to ? `<p class="shared-to">Thank you, ${esc(String(p.to).slice(0, 40))}</p>` : ''}
    <p class="shared-text">${esc(text)}</p>
    <p class="shared-by">${name ? esc(name) + ' · ' : ''}${esc(String(p.d || '').slice(0, 10))}</p>
    <div class="shared-cta"><p>${t.postAsk}</p><a class="pill pill-dark" href="/app/">${t.postWrite}</a>
      <div class="stores"><span class="pill">${APPLE}App Store <small>${t.soon}</small></span><span class="pill">${PLAY}Google Play <small>${t.soon}</small></span></div></div>
  </section>`;
}
// Group invite: dailyjourney.org/join/?c=CODE&n=NAME → open the app (daily-thanks://join…), or install it first.
function join(t) {
  const q = new URLSearchParams(WEB ? location.search : (location.hash.split('?')[1] || ''));
  const code = (q.get('c') || '').replace(/[^a-z0-9]/gi, '').slice(0, 24), name = (q.get('n') || '').slice(0, 30);
  const app = `daily-thanks://join?c=${encodeURIComponent(code)}&n=${encodeURIComponent(name)}`;
  return `<section class="hero join"><span class="wordmark">daily <em>thanks</em></span>
    <p class="join-kicker">${t.joinTitle}</p>
    <h1 class="join-name">${esc(name || t.joinGroup)}</h1>
    <p class="join-body">${t.joinBody}</p>
    ${code ? `<div class="stores"><a class="pill pill-dark" href="${esc(app)}">${t.joinOpen}</a></div>
    <p class="join-note">${t.joinNoApp}</p>
    <div class="stores"><span class="pill">${APPLE}App Store <small>${t.soon}</small></span><span class="pill">${PLAY}Google Play <small>${t.soon}</small></span></div>
    <p class="join-note">${t.joinAfter}</p>` : `<p class="join-note">${t.joinBad}</p>`}</section>`;
}
function legal(t, page) {
  return `<article class="legal col"><a class="back" href="#">${t.back}</a><h1>${t.titles[page]}</h1>${PAGES[page][lang] || PAGES[page].en}</article>`;
}
function render() {
  const t = S[lang], page = WEB ? (location.pathname.split('/').filter(Boolean)[0] || '') : location.hash.slice(1).split('?')[0];
  document.documentElement.lang = lang;
  document.getElementById('lang').value = lang;
  document.querySelectorAll('[data-k]').forEach(el => { el.textContent = t[el.dataset.k]; });
  document.querySelectorAll('a[href^="#"]').forEach(a => a.toggleAttribute('aria-current', a.getAttribute('href') === '#' + page && !!page));
  const isLegal = PAGES && PAGES[page], isJoin = page === 'join', isPost = page === 't';
  document.body.classList.toggle('home', !isLegal && !isPost); // home and invite pages show the big wordmark, so the small header one is hidden
  document.getElementById('view').innerHTML = isPost ? post(t) : isJoin ? join(t) : isLegal ? legal(t, page) : home(t);
  if (WEB) document.querySelectorAll('a[href^="#"]').forEach(a => { const h = a.getAttribute('href').slice(1); a.setAttribute('href', h ? `/${h}/` : '/'); });
  document.title = isPost ? `${t.postTitle} · daily thanks` : isJoin ? `${t.joinTitle} · daily thanks` : isLegal ? `${t.titles[page]} · daily thanks` : 'daily thanks';
}
document.getElementById('lang').addEventListener('change', e => { lang = e.target.value; store('dt-site-lang', lang); render(); });
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
document.getElementById('copy-mail').addEventListener('click', e => {
  const b = e.currentTarget, done = () => { b.textContent = S[lang].copied; setTimeout(() => b.textContent = S[lang].copy, 1600); };
  navigator.clipboard?.writeText('hi@dailyjourney.org').then(done, () => { getSelection().selectAllChildren(document.getElementById('mail')); });
});
render();
</script>
