<style>
:root{
  --paper:#FFFFFF; --ink:#1F2326; --text:#3A3F43; --sub:#8A9095; --line:#ECEDEE; --pill:#F1F1F1;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit}
img{max-width:100%}
.wrap{max-width:960px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;padding-block:22px}
.mark{font-family:var(--serif);font-size:21px;color:var(--ink);letter-spacing:-.02em;text-decoration:none}
.lang{appearance:none;border:0;background:var(--pill);border-radius:999px;font:inherit;font-size:13.5px;color:var(--text);padding:7px 14px;cursor:pointer}
.hero{padding-block:64px 56px;text-align:center}
.hero-icon{width:84px;height:84px;border-radius:20px;box-shadow:0 1px 4px #2a303614}
.hero h1{margin:22px 0 0;font-family:var(--serif);font-weight:400;font-size:clamp(48px,9vw,84px);line-height:1.02;letter-spacing:-.03em;color:var(--ink)}
.hero h1 em{font-style:italic}
.hero .lead{margin:14px auto 0;color:var(--ink);font-size:19px;font-weight:400}
.hero p{margin:8px auto 0;max-width:30em;color:var(--sub);font-size:16.5px;text-wrap:balance}
.hero .note{margin-top:14px;font-size:13.5px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns.center{justify-content:center;margin-top:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:50px;padding:0 26px;border-radius:999px;font-size:15.5px;font-weight:400;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--ink);color:#fff}
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 28px;padding-bottom:72px}
@media (max-width:820px){.feats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.feats{grid-template-columns:1fr}}
.feats article{border-top:1px solid var(--line);padding:22px 0 26px;min-width:0}
.feats h3{margin:0 0 6px;font-size:16.5px;font-weight:500;color:var(--ink)}
.feats p{margin:0;color:var(--sub);font-size:15px}
footer{border-top:1px solid var(--line);padding-block:28px 40px;font-size:13.5px;color:var(--sub)}
footer nav{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:10px}
footer nav a{text-decoration:none}
footer nav a:hover{color:var(--ink)}
.co{font-style:normal;line-height:1.7;margin:4px 0 12px}
.co strong{color:var(--ink);font-weight:500}
.co a{text-decoration:none}
.cr{margin:0}
/* live preview: scroll a verse, like it, scroll to the end → today's done */
.top-row{display:flex;align-items:center;justify-content:space-between;gap:40px;padding-block:40px 64px}
.top-row .hero{padding:0;text-align:left;flex:1}
.top-row .btns.center{justify-content:flex-start}
.top-row .hero .lead{margin-left:0;margin-right:0}
@media (max-width:820px){.top-row .hero .lead{margin-inline:auto}}
@media (max-width:820px){.top-row{flex-direction:column;gap:44px;padding-top:40px}.top-row .hero{text-align:center}.top-row .btns.center{justify-content:center}}
.demo{display:flex;flex-direction:column;align-items:center;flex:none}
.hint{position:absolute;left:50%;bottom:44px;margin-left:-11px;width:22px;height:22px;z-index:3;color:#C4C8CB;animation:bob 2.2s ease-in-out infinite;transition:opacity .4s}
.hint svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(6px);opacity:1}}
.phone{position:relative;width:300px;height:560px;border-radius:44px;border:1px solid #E3E5E6;box-shadow:0 18px 50px #2a30361a;background:#fff;overflow:hidden}
.phone .bar{position:absolute;top:22px;left:26px;right:26px;display:flex;justify-content:space-between;align-items:center;z-index:3;font-size:12px;color:#9BA0A3}
.phone .bar .wm{font-family:var(--serif);font-size:16px;color:#B4B8BA}
.reel{position:absolute;inset:0;transition:transform 1.5s cubic-bezier(.65,0,.35,1)}
.vcard{position:absolute;left:0;right:0;height:560px;padding:0 64px 0 28px;display:flex;flex-direction:column;justify-content:center}
.vcard p{margin:0;font-size:21px;line-height:1.7;font-weight:300;color:var(--ink)}
.vcard.end{align-items:center;text-align:center;padding:0 28px}
.vcard.end .ck{width:52px;height:52px;border-radius:50%;background:#F1F2F3;display:grid;place-items:center;margin-bottom:16px;transform:scale(.6);opacity:0;transition:.5s}
.vcard.end.on .ck{transform:scale(1);opacity:1}
.vcard.end b{font-weight:400;font-size:19px;color:var(--ink)}
.vcard.end span{margin-top:6px;font-size:13px;color:var(--sub)}
.rail{position:absolute;right:20px;bottom:110px;display:grid;gap:22px;z-index:3;color:#B8BDC0;transition:opacity .4s}
.rail svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.rail .heart.on svg{fill:#C46B76;stroke:#C46B76}
.ref{position:absolute;left:28px;bottom:112px;z-index:3;font-size:12px;color:#8A9094;display:flex;gap:6px;align-items:center;transition:opacity .4s}
.ref i{font-style:normal;color:#B4B8BA}
.pop{position:absolute;left:50%;top:44%;width:76px;height:76px;margin:-38px 0 0 -38px;z-index:4;opacity:0;pointer-events:none}
.pop svg{width:100%;height:100%;fill:#C46B76}
.pop.go{animation:pop .9s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.4)}25%{opacity:.95;transform:scale(1.1)}60%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
.finger{position:absolute;left:50%;top:62%;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:#1F232614;z-index:5;opacity:0}
.finger.swipe{animation:swipe 1s ease-in-out}
.finger.tap{animation:tap .7s ease-out}
@keyframes swipe{0%{opacity:0;transform:translateY(40px)}20%{opacity:1}80%{opacity:1;transform:translateY(-120px)}100%{opacity:0;transform:translateY(-140px)}}
@keyframes tap{0%,100%{opacity:0;transform:scale(.6)}30%,60%{opacity:1;transform:scale(1)}}
.steps{display:flex;gap:18px;margin-top:22px;font-size:14px;color:#B4B8BA}
.steps span{transition:color .3s}
.steps span.on{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.reel,.pop,.finger{transition:none;animation:none}}
/* the phone preview is off for now: the title sits centered on its own */
.demo[hidden]{display:none}
.top-row:has(.demo[hidden]){justify-content:center}
.top-row:has(.demo[hidden]) .hero{text-align:center}
.top-row:has(.demo[hidden]) .btns.center{justify-content:center}
.top-row:has(.demo[hidden]) .hero .lead{margin-inline:auto}
</style>

    f1: '한 절씩, 한 장씩', f1d: '스크롤 한 번에 한 절. 말씀만 보이는 하얀 화면에서 집중해서 읽어요.',
    f2: '설교 노트', f2d: '설교 본문을 고르고, 들은 말씀을 본문과 함께 내 노트로 남겨요.',
    f3: '읽기 계획', f3d: '함께 읽을 범위와 기간을 정하고 초대해요. 밀려도 남은 날에 나눠서 따라잡아요.',
    f4: '공동체', f4d: '교회 · 공동체 · 수련회 코드나 초대 링크로 들어가 기도제목과 묵상을 나눠요. 공동체 글은 멤버만 볼 수 있어요.',
    f5: '통독 기록', f5d: '몇 번 읽었는지, 언제 시작해 언제 마쳤는지, 날마다 읽은 장이 남아요.',
    f6: '내 기록은 내 것', f6d: '나만 보는 기록은 휴대폰에서 잠근 뒤에 보관해요. 같은 메일로 로그인하면 새 휴대폰에서도 이어지고, 운영자는 읽을 수 없어요.',
    d1: '넘기고', d2: '마음에 담고', d3: '오늘 완료 ✓', today: '오늘의 말씀', done: '오늘의 말씀을 다 읽었어요', book: '시편 23',
    vs: ['여호와는 나의 목자시니 내가 부족함이 없으리로다', '그가 나를 푸른 초장에 누이시며 쉴만한 물 가으로 인도하시는도다', '내 영혼을 소생시키시고 자기 이름을 위하여 의의 길로 인도하시는도다'],
    np: '미국 뉴저지주에 설립된 비영리 법인 · 미국 국세청(IRS) 501(c)(3) 승인 신청 중', privacy: '개인정보 처리방침', terms: '이용약관', support: '고객지원', delete: '계정 삭제', tm: 'Daily Journey™ 이름과 로고, 앱과 웹사이트 디자인은 Daily Journey, Inc.의 자산이며 허락 없이 복제·사용할 수 없어요.' },
  en: { lead: 'With your community, one slide at a time', tag: 'A day focused on the Word', sub: 'Read one verse at a time, keep your sermons, and pray with your community.', open: 'Open on the web', note: 'No download needed. On your phone, add it to your Home Screen to use it like an app.',
    f1: 'One verse at a time', f1d: 'Scroll through Scripture one verse per screen, on a quiet white page.',
    f2: 'Sermon notes', f2d: 'Pick the passage and keep your own notes on the sermon, right beside it.',
    f3: 'Reading plans', f3d: 'Set what to read and for how long, and invite others. Fall behind? It spreads the rest over the days left.',
    f4: 'Community', f4d: 'Join with a code or invite link from your church, community or retreat, and share prayer requests and reflections. Only members see community posts.',
    f5: 'Read-through history', f5d: 'How many times you’ve read the Bible, when each round started and ended, and what you read each day.',
    f6: 'Your notes stay yours', f6d: 'Only-me records are locked on your phone before they’re kept. Sign in with the same e-mail and they follow you to a new phone — and even we can’t read them.',
    d1: 'Scroll', d2: 'Keep what speaks', d3: 'Done for today ✓', today: 'Today’s passage', done: 'You read today’s passage', book: 'Psalm 23',
    vs: ['The LORD is my shepherd; I shall not want.', 'He maketh me to lie down in green pastures: he leadeth me beside the still waters.', 'He restoreth my soul: he leadeth me in the paths of righteousness for his name’s sake.'],
    np: 'A New Jersey nonprofit corporation · 501(c)(3) application pending with the IRS', privacy: 'Privacy', terms: 'Terms', support: 'Support', delete: 'Delete account', tm: 'Daily Journey™, its logo and the design of the app and website belong to Daily Journey, Inc. and may not be copied or used without permission.' },
  es: { lead: 'Con tu comunidad, una página a la vez', tag: 'Un día centrado en la Palabra', sub: 'Lee versículo a versículo, guarda tus sermones y ora con tu comunidad.', open: 'Abrir en la web', note: 'Sin descargas. En tu teléfono, añádela a la pantalla de inicio para usarla como app.',
    f1: 'Versículo a versículo', f1d: 'La Escritura un versículo por pantalla, en una página blanca y tranquila.',
    f2: 'Notas de sermón', f2d: 'Elige el pasaje y guarda tus propias notas del sermón junto a él.',
    f3: 'Planes de lectura', f3d: 'Define qué leer y en cuánto tiempo, e invita a otros. Si te atrasas, reparte lo que falta.',
    f4: 'Comunidad', f4d: 'Únete con un código o enlace de tu iglesia, comunidad o retiro y comparte peticiones y reflexiones. Solo los miembros ven lo de la comunidad.',
    f5: 'Historial de lectura', f5d: 'Cuántas veces has leído la Biblia, cuándo empezó y terminó cada vuelta y qué leíste cada día.',
    f6: 'Tus notas son tuyas', f6d: 'Lo que guardas solo para ti se cifra en tu teléfono antes de guardarse. Entra con el mismo correo y te sigue a un teléfono nuevo; ni nosotros podemos leerlo.',
    d1: 'Desliza', d2: 'Guarda lo que te habla', d3: 'Hecho por hoy ✓', today: 'Pasaje de hoy', done: 'Leíste el pasaje de hoy', book: 'Salmos 23',
    vs: ['Jehová es mi pastor; nada me faltará.', 'En lugares de delicados pastos me hará yacer: Junto á aguas de reposo me pastoreará.', 'Confortará mi alma; Guiaráme por sendas de justicia por amor de su nombre.'],
    np: 'Corporación sin fines de lucro de Nueva Jersey · solicitud 501(c)(3) pendiente ante el IRS', privacy: 'Privacidad', terms: 'Términos', support: 'Soporte', delete: 'Eliminar cuenta', tm: 'Daily Journey™, su logotipo y el diseño de la app y del sitio pertenecen a Daily Journey, Inc. y no pueden copiarse ni usarse sin permiso.' }
};
let lang = 'ko';
try { lang = localStorage.getItem('dj-lang') || ''; } catch (e) {}
if (!S[lang]) { const n = (navigator.language || 'ko').slice(0, 2); lang = S[n] ? n : 'en'; }
const sel = document.getElementById('lang');
function paint() {
  document.documentElement.lang = lang; sel.value = lang;
  document.querySelectorAll('[data-k]').forEach(el => { el.textContent = S[lang][el.dataset.k]; });
  buildDemo();
}
// the live preview: verse 1 → double tap (heart) → verse 2 → verse 3 → ✓ done, then again
const $ = id => document.getElementById(id);
let demoT = [];
function buildDemo() {
  demoT.forEach(clearTimeout); demoT = [];
  const L = S[lang], n = L.vs.length;
  $('sz').textContent = lang === 'ko' ? '가±' : 'A±';
  $('reel').innerHTML = L.vs.map((v, i) => `<div class="vcard" style="top:${i * 560}px"><p>${v}</p></div>`).join('') +
    `<div class="vcard end" id="vend" style="top:${n * 560}px"><div class="ck"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#3a3f44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><b>${L.done}</b><span>${L.book}:1-${n}</span></div>`;
  const ref = i => { $('ref').innerHTML = `☼ ${L.today} <i>·</i> ${L.book}:${i + 1} <i>${i + 1} / ${n}</i>`; };
  const step = () => {};   // (no captions under the phone)
  const go = i => { $('reel').style.transform = `translateY(${-i * 560}px)`; };
  const fx = () => {};   // the faint arrow at the bottom shows the way (as in the app)
  const at = (ms, fn) => demoT.push(setTimeout(fn, ms));
  const loop = () => {
    go(0); ref(0); $('heart').classList.remove('on'); $('vend').classList.remove('on'); $('rail').style.opacity = 1; $('ref').style.opacity = 1; $('hint').style.opacity = 1;
    at(2200, () => { const p = $('pop'); p.className = 'pop'; void p.offsetWidth; p.classList.add('go'); $('heart').classList.add('on'); });
    at(4800, () => { go(1); ref(1); $('heart').classList.remove('on'); });
    at(8000, () => { go(2); ref(2); });
    at(11200, () => { go(3); $('rail').style.opacity = 0; $('ref').style.opacity = 0; $('hint').style.opacity = 0; });
    at(12600, () => { $('vend').classList.add('on'); });
    at(17000, loop);
  };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { go(0); ref(0); return; }
  loop();
}
sel.addEventListener('change', () => { lang = sel.value; try { localStorage.setItem('dj-lang', lang); } catch (e) {} paint(); });
document.getElementById('yr').textContent = new Date().getFullYear();
paint();
</script>
