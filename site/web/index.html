<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Journey</title>
<meta name="description" content="daily journey — 말씀에 집중하는 하루. A day focused on the Word.">
<meta property="og:title" content="daily journey">
<meta property="og:description" content="A day focused on the Word">

<link rel="canonical" href="https://dailyjourney.org/">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Daily Journey, Inc.","url":"https://dailyjourney.org/","email":"hi@dailyjourney.org","logo":"https://dailyjourney.org/dailybible/apple-touch-icon.png","address":{"@type":"PostalAddress","streetAddress":"105 Challenger Rd","addressLocality":"Ridgefield Park","addressRegion":"NJ","postalCode":"07660","addressCountry":"US"}}</script>
<link rel="icon" type="image/png" href="/dailybible/favicon.png">
<link rel="apple-touch-icon" href="/dailybible/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Noto+Sans+KR:wght@300;400;500&display=swap">
<style>
:root{
  --paper:#FFFFFF; --ink:#1F2326; --text:#3A3F43; --sub:#8A9095; --line:#ECEDEE; --pill:#F1F1F1;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit}
img{max-width:100%}
.wrap{max-width:960px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;padding-block:22px}
.mark{font-family:var(--serif);font-size:21px;color:var(--ink);letter-spacing:-.02em;text-decoration:none}
.lang{appearance:none;border:0;background:var(--pill);border-radius:999px;font:inherit;font-size:13.5px;color:var(--text);padding:7px 14px;cursor:pointer}
.hero{padding-block:64px 56px;text-align:center}
.hero-icon{width:84px;height:84px;border-radius:20px;box-shadow:0 1px 4px #2a303614}
.hero h1{margin:22px 0 0;font-family:var(--serif);font-weight:400;font-size:clamp(48px,9vw,84px);line-height:1.02;letter-spacing:-.03em;color:var(--ink)}
.hero h1 em{font-style:italic}
.hero .lead{margin:14px auto 0;color:var(--ink);font-size:19px;font-weight:400}
.hero p{margin:8px auto 0;max-width:30em;color:var(--sub);font-size:16.5px;text-wrap:balance}
.hero .note{margin-top:14px;font-size:13.5px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns.center{justify-content:center;margin-top:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:50px;padding:0 26px;border-radius:999px;font-size:15.5px;font-weight:400;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--ink);color:#fff}
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 28px;padding-bottom:72px}
@media (max-width:820px){.feats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.feats{grid-template-columns:1fr}}
.feats article{border-top:1px solid var(--line);padding:22px 0 26px;min-width:0}
.feats h3{margin:0 0 6px;font-size:16.5px;font-weight:500;color:var(--ink)}
.feats p{margin:0;color:var(--sub);font-size:15px}
footer{border-top:1px solid var(--line);padding-block:28px 40px;font-size:13.5px;color:var(--sub)}
footer nav{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:10px}
footer nav a{text-decoration:none}
footer nav a:hover{color:var(--ink)}
.co{font-style:normal;line-height:1.7;margin:4px 0 12px}
.co strong{color:var(--ink);font-weight:500}
.co a{text-decoration:none}
.cr{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="mark" href="/">Daily Journey</a>
    <select class="lang" id="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="es">Español</option></select>
  </header>

  <section class="hero">
    <img class="hero-icon" src="/dailybible/apple-touch-icon.png" alt="" width="84" height="84">
    <h1>daily <em>journey</em></h1>
    <p class="lead" data-k="tag"></p>
    <p data-k="sub"></p>
    <div class="btns center"><a class="btn primary" href="/daily-bible/" data-k="open"></a></div>
    <p class="note" data-k="note"></p>
  </section>

  <section class="feats">
    <article><h3 data-k="f1"></h3><p data-k="f1d"></p></article>
    <article><h3 data-k="f2"></h3><p data-k="f2d"></p></article>
    <article><h3 data-k="f3"></h3><p data-k="f3d"></p></article>
    <article><h3 data-k="f4"></h3><p data-k="f4d"></p></article>
    <article><h3 data-k="f5"></h3><p data-k="f5d"></p></article>
    <article><h3 data-k="f6"></h3><p data-k="f6d"></p></article>
  </section>

  <footer>
    <nav><a href="/privacy/" data-k="privacy"></a><a href="/terms/" data-k="terms"></a><a href="/support/" data-k="support"></a><a href="/delete-account/" data-k="delete"></a></nav>
    <address class="co">
      <strong>Daily Journey, Inc.</strong><br>
      105 Challenger Rd<br>Ridgefield Park, NJ 07660<br>United States<br>
      <a href="mailto:hi@dailyjourney.org">hi@dailyjourney.org</a>
    </address>
    <p class="cr">© <span id="yr">2026</span> Daily Journey, Inc.</p>
  </footer>
</div>
<script>
const S = {
  ko: { tag: '말씀에 집중하는 하루', sub: '한 절씩 읽고, 설교를 담고, 공동체와 함께 기도해요.', open: '웹에서 열기', note: '앱 설치 없이 바로 시작할 수 있어요. 휴대폰에서는 홈 화면에 추가해 앱처럼 쓰세요.',
    f1: '한 절씩, 한 장씩', f1d: '스크롤 한 번에 한 절. 말씀만 보이는 하얀 화면에서 집중해서 읽어요.',
    f2: '설교 노트', f2d: '설교 본문을 고르고 녹음하면 요약 · 받아쓰기 · 본문이 정리된 노트가 돼요.',
    f3: '읽기 계획', f3d: '함께 읽을 범위와 기간을 정하고 초대해요. 밀려도 남은 날에 나눠서 따라잡아요.',
    f4: '공동체', f4d: '순 · 소모임 · 가족과만 기도제목과 묵상을 나눠요. 모르는 사람의 글은 보이지 않아요.',
    f5: '통독 기록', f5d: '몇 번 읽었는지, 언제 시작해 언제 마쳤는지, 날마다 읽은 장이 남아요.',
    f6: '내 기록은 내 것', f6d: '개인 기록은 기기에서 잠근 뒤 저장해 운영자도 읽을 수 없어요.',
    privacy: '개인정보 처리방침', terms: '이용약관', support: '고객지원', delete: '계정 삭제' },
  en: { tag: 'A day focused on the Word', sub: 'Read one verse at a time, keep your sermons, and pray with your community.', open: 'Open on the web', note: 'No download needed. On your phone, add it to your Home Screen to use it like an app.',
    f1: 'One verse at a time', f1d: 'Scroll through Scripture one verse per screen, on a quiet white page.',
    f2: 'Sermon notes', f2d: 'Pick the passage and record the sermon — get a summary, transcript and the passage in one note.',
    f3: 'Reading plans', f3d: 'Set what to read and for how long, and invite others. Fall behind? It spreads the rest over the days left.',
    f4: 'Community', f4d: 'Share prayer requests and reflections only with your group or family — never with strangers.',
    f5: 'Read-through history', f5d: 'How many times you’ve read the Bible, when each round started and ended, and what you read each day.',
    f6: 'Your notes stay yours', f6d: 'Personal notes are locked on your device before they are saved, so even we can’t read them.',
    privacy: 'Privacy', terms: 'Terms', support: 'Support', delete: 'Delete account' },
  es: { tag: 'Un día centrado en la Palabra', sub: 'Lee versículo a versículo, guarda tus sermones y ora con tu comunidad.', open: 'Abrir en la web', note: 'Sin descargas. En tu teléfono, añádela a la pantalla de inicio para usarla como app.',
    f1: 'Versículo a versículo', f1d: 'La Escritura un versículo por pantalla, en una página blanca y tranquila.',
    f2: 'Notas de sermón', f2d: 'Elige el pasaje y graba el sermón: resumen, transcripción y pasaje en una sola nota.',
    f3: 'Planes de lectura', f3d: 'Define qué leer y en cuánto tiempo, e invita a otros. Si te atrasas, reparte lo que falta.',
    f4: 'Comunidad', f4d: 'Comparte peticiones y reflexiones solo con tu grupo o familia, nunca con desconocidos.',
    f5: 'Historial de lectura', f5d: 'Cuántas veces has leído la Biblia, cuándo empezó y terminó cada vuelta y qué leíste cada día.',
    f6: 'Tus notas son tuyas', f6d: 'Tus notas personales se cifran en tu dispositivo antes de guardarse; ni nosotros podemos leerlas.',
    privacy: 'Privacidad', terms: 'Términos', support: 'Soporte', delete: 'Eliminar cuenta' }
};
let lang = 'ko';
try { lang = localStorage.getItem('dj-lang') || ''; } catch (e) {}
if (!S[lang]) { const n = (navigator.language || 'ko').slice(0, 2); lang = S[n] ? n : 'en'; }
const sel = document.getElementById('lang');
function paint() {
  document.documentElement.lang = lang; sel.value = lang;
  document.querySelectorAll('[data-k]').forEach(el => { el.textContent = S[lang][el.dataset.k]; });
}
sel.addEventListener('change', () => { lang = sel.value; try { localStorage.setItem('dj-lang', lang); } catch (e) {} paint(); });
document.getElementById('yr').textContent = new Date().getFullYear();
paint();
</script>
</body>
</html>
