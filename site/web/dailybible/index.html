<style>
/* Layout: the app's own reading column, opened into spreads — each feature is a two-page spread (words | a phone screen),
   the way a Bible lies open. One accent: the ribbon marker, used only where something is marked. */
:root{
  --paper:#FFFFFF; --ink:#1D2125; --text:#34393E; --sub:#6B7176; --faint:#9AA0A5;
  --pill:#F2F2F1; --line:#ECECEA; --ribbon:#B5453F; --ribbon-soft:#F8ECEA; --shot:#FFFFFF;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141618; --ink:#F0F1F2; --text:#D6D9DC; --sub:#A1A6AB; --faint:#767C81;
  --pill:#22262A; --line:#2A2E32; --ribbon:#D3675F; --ribbon-soft:#2E1F1E; --shot:#1C1F22; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141618; --ink:#F0F1F2; --text:#D6D9DC; --sub:#A1A6AB; --faint:#767C81;
  --pill:#22262A; --line:#2A2E32; --ribbon:#D3675F; --ribbon-soft:#2E1F1E; --shot:#1C1F22; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--paper)}
body{background:var(--paper);color:var(--text);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--faint);outline-offset:3px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto}
.wordmark{font-family:var(--serif);font-weight:400;letter-spacing:-.025em;line-height:1;white-space:nowrap;color:var(--ink)}
.wordmark em{font-style:italic}
.mark{width:22px;height:22px;color:var(--sub);flex:none}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none}
.brand .wordmark{font-size:21px}
.top nav{display:flex;align-items:center;gap:22px;font-size:13px;color:var(--faint)}
.top nav a{text-decoration:none}
.top nav a:hover{color:var(--text)}
.lang{display:flex;align-items:center;gap:5px;color:var(--faint);font-size:13px}
.lang svg{width:15px;height:15px}
.lang select{appearance:none;border:0;background:transparent;color:inherit;font:inherit;padding:4px 0;cursor:pointer}
@media (max-width:680px){.top nav .navlink{display:none}}

/* hero */
.hero{text-align:center;padding-block:clamp(56px,11vw,120px) clamp(48px,8vw,88px)}
.hero .big{display:block;font-size:clamp(54px,12vw,104px);color:var(--ink)}
.tag{margin:clamp(28px,4vw,40px) auto 0;font-family:var(--serif);font-size:clamp(19px,2.5vw,23px);line-height:1.6;color:var(--sub);max-width:28ch;text-wrap:balance}
.cta{margin-top:36px;display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:var(--pill);color:var(--text);padding:12px 22px;font-size:14px;font-weight:400;text-decoration:none;border:0}
.pill svg{width:16px;height:16px}
.pill small{color:var(--faint);font-size:12px;font-weight:300}
.pill-dark{background:var(--ink);color:var(--paper)}
.verse{margin:clamp(48px,7vw,72px) auto 0;max-width:34ch;display:grid;gap:10px;justify-items:center}
.verse q{font-family:var(--serif);font-style:italic;font-size:clamp(22px,3vw,28px);line-height:1.45;color:var(--ink);quotes:none;text-wrap:balance}
.ref{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.06em;color:var(--faint);font-variant-numeric:tabular-nums}
.ref::before{content:"";width:8px;height:14px;background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}

/* spreads */
.spreads{border-top:1px solid var(--line)}
.spread{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:1px solid var(--line)}
.spread > *{padding-block:clamp(48px,7vw,84px)}
.page-words{padding-right:clamp(20px,5vw,64px);display:flex;flex-direction:column;justify-content:center;min-width:0}
.page-shot{padding-left:clamp(20px,5vw,64px);border-left:1px solid var(--line);display:flex;justify-content:center;align-items:center;min-width:0}
.spread.flip .page-words{order:2;padding-right:0;padding-left:clamp(20px,5vw,64px);border-left:1px solid var(--line)}
.spread.flip .page-shot{order:1;border-left:0;padding-left:0;padding-right:clamp(20px,5vw,64px)}
.kicker{margin:0 0 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4.2vw,40px);line-height:1.2;letter-spacing:-.02em;color:var(--ink);margin:0 0 18px;text-wrap:balance}
.lead{margin:0 0 22px;color:var(--sub);max-width:40ch}
.points{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.points li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;font-size:15px;color:var(--text)}
.points li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint);margin-top:11px;justify-self:center}
.points li.marked::before{width:8px;height:13px;border-radius:0;background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);margin-top:7px}
.phone{width:min(300px,100%);border-radius:34px;border:1px solid var(--line);background:var(--shot);padding:8px;box-shadow:0 18px 50px #20262c14}
.phone img{display:block;width:100%;height:auto;border-radius:27px;aspect-ratio:390/844;object-fit:cover;object-position:top}
@media (max-width:760px){
  .spread{grid-template-columns:1fr}
  .spread > *{padding-block:40px}
  .page-words,.spread.flip .page-words{order:1;padding:40px 0 8px;border:0}
  .page-shot,.spread.flip .page-shot{order:2;padding:8px 0 48px;border:0}
}

/* small facts */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(24px,4vw,48px);padding-block:clamp(56px,8vw,96px);border-bottom:1px solid var(--line)}
.facts h3{margin:0 0 6px;font-size:16px;font-weight:500;color:var(--ink)}
.facts p{margin:0;font-size:15px;color:var(--sub)}
@media (max-width:720px){.facts{grid-template-columns:1fr}}

/* pricing */
.price{padding-block:clamp(56px,8vw,96px);border-bottom:1px solid var(--line)}
.price h2{margin-bottom:8px}
.price .lead{margin-bottom:28px}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.plan{border:1px solid var(--line);border-radius:20px;padding:22px 22px 24px;display:grid;gap:6px;align-content:start}
.plan.best{border-color:var(--ribbon);background:var(--ribbon-soft)}
.plan b{font-weight:500;color:var(--ink);font-size:15px}
.plan .amt{font-family:var(--serif);font-size:32px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.plan .amt small{font-family:var(--sans);font-size:13px;color:var(--faint)}
.plan p{margin:0;font-size:14px;color:var(--sub)}
.free-note{margin:18px 0 0;font-size:14px;color:var(--sub)}
@media (max-width:720px){.plans{grid-template-columns:1fr}}

footer{padding-block:40px 56px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;font-size:13px;color:var(--faint)}
footer nav{display:flex;flex-wrap:wrap;gap:18px}
footer a{text-decoration:none}
footer a:hover{color:var(--text)}
@media (prefers-reduced-motion:no-preference){.phone{transition:transform .5s ease}.phone:hover{transform:translateY(-4px)}}
</style>

  ko: { scroll: '한 절씩 읽는 화면: 요한복음 15:1', record: '요한복음 15:1-8 설교를 녹음하며 받아 적는 화면', read: '읽기 화면: 연속 기록과 함께 읽기 계획' },
  en: { scroll: 'Reading one verse at a time: John 15:1', record: 'Recording a sermon on John 15:1-8 with the live transcript', read: 'Reading screen: streak and a shared reading plan' }
};
const pick = () => { try { const s = localStorage.getItem('db-site-lang'); if (S[s]) return s; } catch (e) {} const n = (navigator.language || 'ko').slice(0, 2); return S[n] ? n : 'ko'; };
let lang = pick();
function render() {
  const t = S[lang], im = t.imgs, alt = ALT[im];
  document.documentElement.lang = lang;
  document.getElementById('lang').value = lang;
  document.querySelectorAll('[data-k]').forEach(el => { const v = t[el.dataset.k]; if (v == null) return; if (/<small>/.test(v)) el.innerHTML = v; else el.textContent = v; });
  for (const k of ['scroll', 'record', 'read']) { const img = document.getElementById('img-' + k); img.src = `img/${im}-${k}.png`; img.alt = alt[k]; }
}
document.getElementById('lang').addEventListener('change', e => { lang = e.target.value; try { localStorage.setItem('db-site-lang', lang); } catch (err) {} render(); });
render();
</script>
